<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#fde6ea">
<title>모아쿵! 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  /* 레이아웃: 세로 한 줄 — 상단 HUD / 3D 장면 / 개수 맞춤 / 하단 버튼 */
  :root {
    --page: #f7d9df;
    --table: #fde6ea;
    --ink: #5b3a3e;
    --ink-soft: #8a6a6e;
    --card: #fffaf6;
    --line: #f1d3d8;
    --accent: #ff6f91;
    --accent-dark: #d94f75;
    --mint: #57c4a4;
    --gold: #ffb627;
    --good: #1f9d55;
    --warn: #e67e22;
    --bad: #e2445c;
    --font: "Jua", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "WenQuanYi Zen Hei", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #2b1f24; } }
  :root[data-theme="dark"] { --page: #2b1f24; }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--page); color: var(--ink); font-family: var(--font);
    overscroll-behavior: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
  }
  button { font-family: inherit; color: inherit; }
  #app {
    position: relative; height: 100vh; height: 100dvh; max-width: 480px; margin: 0 auto;
    display: flex; flex-direction: column; background: var(--table); overflow: hidden;
    box-shadow: 0 0 40px rgba(120, 60, 70, 0.18);
  }
  #hud { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: calc(8px + env(safe-area-inset-top)) 10px 6px; }
  .lv-chip { display: flex; align-items: center; gap: 6px; min-width: 0; background: #fff; border-radius: 999px; padding: 4px 12px 4px 4px; box-shadow: 0 2px 0 var(--line); }
  .lv-chip b { display: grid; place-items: center; min-width: 28px; height: 28px; padding: 0 6px; border-radius: 999px; background: var(--accent); color: #fff; font-weight: normal; font-size: 15px; }
  .lv-chip span { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stats { display: flex; gap: 5px; flex: none; }
  .stat { display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; background: #fff; border-radius: 14px; padding: 5px 8px 4px; min-width: 48px; box-shadow: 0 2px 0 var(--line); }
  .stat b { font-weight: normal; font-size: 18px; font-variant-numeric: tabular-nums; }
  .stat small { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
  .pips { display: flex; gap: 3px; height: 18px; align-items: center; }
  .pip { width: 10px; height: 14px; border-radius: 50% 50% 45% 45%; background: var(--accent); box-shadow: inset 0 -3px 0 rgba(0,0,0,0.12); }
  .pip.used { background: #f2dfe2; box-shadow: inset 0 0 0 2px #e8c6cc; }
  .bump { animation: bump 0.35s ease; }
  @keyframes bump { 40% { transform: scale(1.25); } }

  #stage-wrap {
    flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden;
    /* 공중에 뜬 디오라마 뒤 하늘: 위는 라일락, 아래는 복숭아빛 */
    background: radial-gradient(120% 70% at 50% 38%, #fff6f2 0%, rgba(255,246,242,0) 60%), linear-gradient(180deg, #e8dcff 0%, #fbe3ef 48%, #ffd9c9 100%);
  }
  canvas#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .float-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #banner {
    position: absolute; left: 50%; top: 10px; transform: translateX(-50%); max-width: calc(100% - 24px);
    background: rgba(255,255,255,0.94); border-radius: 999px; padding: 7px 14px; font-size: 14px; white-space: nowrap;
    box-shadow: 0 3px 10px rgba(120,60,70,0.15); transition: opacity 0.2s; overflow: hidden; text-overflow: ellipsis;
  }
  #banner:empty { opacity: 0; }
  #aimcard {
    position: absolute; width: 262px; max-width: calc(100% - 16px); background: rgba(255,253,250,0.97); border-radius: 14px;
    padding: 9px 12px 9px 17px; box-shadow: 0 6px 18px rgba(120,60,60,0.28); font-size: 13px; line-height: 1.35; display: none;
  }
  #aimcard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 7px; border-radius: 14px 0 0 14px; background: var(--c, var(--good)); }
  #aimcard .h { color: var(--ink-soft); font-size: 12px; }
  #aimcard .m { font-size: 17px; color: var(--c, var(--good)); margin: 1px 0 2px; }
  #aimcard .hint { margin-top: 4px; background: #fff3c4; color: #8a6200; border-radius: 9px; padding: 2px 8px; font-size: 12px; }
  #aimcard .hint.warn { background: #ffe8d6; color: #a5501b; }
  #cakehud {
    position: absolute; transform: translate(-50%, 0); display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: rgba(255,255,255,0.9); border-radius: 12px; padding: 4px 8px 5px; box-shadow: 0 2px 8px rgba(120,60,70,0.15); font-size: 11px; white-space: nowrap;
  }
  #cakehud .layers { display: flex; gap: 3px; align-items: center; }
  #cakehud .layer { width: 46px; height: 7px; border-radius: 4px; background: #f0e2e4; overflow: hidden; position: relative; }
  #cakehud .layer i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--lc, #6fd3a0); border-radius: 4px; }
  #cakehud .layer.gone { background: #e6dadb; opacity: 0.45; }
  #cakehud .layer.cur { outline: 2px solid #ff8fab; outline-offset: 1px; }
  #cakehud .layer em { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(255,255,255,0.85); animation: blink 0.6s infinite alternate; }
  @keyframes blink { from { opacity: 0.35; } to { opacity: 0.95; } }
  .dots i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #ead7da; margin-left: 2px; }
  .dots i.on { background: #ff6f91; }
  .bubble {
    position: absolute; transform: translate(-50%, -100%); background: var(--accent); color: #fff; border-radius: 999px;
    padding: 3px 9px; font-size: 14px; white-space: nowrap; box-shadow: 0 0 0 2px #fff; font-variant-numeric: tabular-nums;
  }
  .bubble small { font-size: 11px; opacity: 0.9; margin-left: 3px; }
  .bubble.rest { background: #ff8fab; font-size: 12px; padding: 2px 7px; }
  .ftext {
    position: absolute; transform: translate(-50%, -50%); font-size: 22px; white-space: nowrap;
    color: var(--c, var(--ink)); text-shadow: 0 0 4px #fff, 0 0 4px #fff, 0 2px 0 #fff; animation: rise var(--d, 1s) ease-out forwards;
  }
  /* 만화풍 충돌 글자: 주황 그라디언트 + 굵은 테두리 + 기울임 */
  .ftext.boom {
    font-size: 54px; letter-spacing: -1px; color: transparent; text-shadow: none;
    background: linear-gradient(180deg, #fff27a 0%, #ffb627 45%, #ff5f3a 100%); -webkit-background-clip: text; background-clip: text;
    -webkit-text-stroke: 3px #5b2a2e; paint-order: stroke fill; filter: drop-shadow(0 4px 0 rgba(91,42,46,0.35));
    animation: boom var(--d, 0.9s) cubic-bezier(.2,1.6,.4,1) forwards;
  }
  @keyframes boom {
    0% { transform: translate(-50%, -50%) rotate(-14deg) scale(2.2); opacity: 0; }
    12% { transform: translate(-50%, -50%) rotate(-8deg) scale(0.92); opacity: 1; }
    24% { transform: translate(-50%, -50%) rotate(-9deg) scale(1.06); }
    75% { opacity: 1; }
    100% { transform: translate(-50%, -78%) rotate(-9deg) scale(1); opacity: 0; }
  }
  @keyframes rise { 0% { transform: translate(-50%, -30%) scale(0.6); opacity: 0; } 15% { transform: translate(-50%, -50%) scale(1.12); opacity: 1; } 70% { opacity: 1; } 100% { transform: translate(-50%, -160%) scale(1); opacity: 0; } }

  #lockbar { flex: none; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 6px 10px 0; font-size: 14px; color: var(--ink-soft); }
  #lockbar .stepper { display: flex; align-items: center; background: #fff; border-radius: 999px; box-shadow: 0 2px 0 var(--line); overflow: hidden; }
  #lockbar button { border: 0; background: transparent; width: 44px; height: 40px; font-size: 22px; cursor: pointer; color: var(--accent-dark); }
  #lockbar button:active { background: #ffe8ee; }
  #lock-val { min-width: 84px; text-align: center; font-size: 16px; color: var(--ink); border-left: 1px solid var(--line); border-right: 1px solid var(--line); height: 40px; display: grid; place-items: center; cursor: pointer; font-variant-numeric: tabular-nums; }
  #lock-val.on { background: #fff1f4; color: var(--accent-dark); }

  #bar { flex: none; display: flex; justify-content: space-between; gap: 6px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); }
  .tb { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: #fff; border-radius: 14px; padding: 6px 4px 5px; font-size: 12px; box-shadow: 0 2px 0 var(--line); cursor: pointer; min-height: 44px; }
  .tb svg { width: 20px; height: 20px; }
  .tb.armed { background: #ffe1e8; color: #c0284f; }

  #overlay { position: absolute; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(110,60,70,0.32); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  #overlay.show { display: flex; }
  .card { position: relative; width: 100%; max-width: 400px; max-height: 100%; overflow: auto; background: var(--card); border-radius: 24px; padding: 20px 18px 18px; box-shadow: 0 14px 40px rgba(120,50,60,0.35); text-align: center; animation: pop 0.28s cubic-bezier(.2,1.4,.5,1); }
  @keyframes pop { from { transform: scale(0.88); opacity: 0; } }
  .card h2 { margin: 0 0 6px; font-weight: normal; font-size: 24px; text-wrap: balance; }
  .card p { margin: 6px 0; font-size: 15px; line-height: 1.45; }
  .sub { color: var(--ink-soft); font-size: 14px; }
  .logo { font-size: 60px; line-height: 1; margin: 2px 0; color: #ff5f87; text-shadow: 0 4px 0 #ffd0dc, 0 7px 12px rgba(200,80,110,0.25); }
  .logo span { display: inline-block; animation: hop 1.6s ease-in-out infinite; }
  .logo span:nth-child(2) { animation-delay: .12s; } .logo span:nth-child(3) { animation-delay: .24s; color: #ffb627; } .logo span:nth-child(4) { animation-delay: .36s; color: #57c4a4; }
  .logo sup { font-size: 20px; color: var(--mint); vertical-align: top; }
  @keyframes hop { 30% { transform: translateY(-8px); } 60% { transform: none; } }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 16px; padding: 12px 18px; font-size: 18px; cursor: pointer; min-height: 48px; background: var(--accent); color: #fff; box-shadow: 0 4px 0 var(--accent-dark); }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--accent-dark); }
  .btn.ghost { background: #fff; color: var(--ink); box-shadow: 0 4px 0 var(--line); }
  .btn-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .btn-row .btn { flex: 1 1 120px; }
  button:focus-visible { outline: 3px solid #7cc6ff; outline-offset: 2px; }

  /* 레벨 지도: 구불구불한 길 */
  .map { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 8px; margin: 14px 4px 4px; }
  .node { display: flex; flex-direction: column; align-items: center; gap: 3px; border: 0; background: none; cursor: pointer; padding: 0; }
  .node .ball { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: #fff; box-shadow: 0 4px 0 var(--line), inset 0 -6px 0 rgba(0,0,0,0.04); position: relative; }
  .node .ball .mini { width: 40px; height: 34px; }
  .node .ball .num { position: absolute; top: -6px; left: -4px; min-width: 22px; height: 22px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 13px; display: grid; place-items: center; box-shadow: 0 0 0 2px #fff; }
  .node .name { font-size: 12px; line-height: 1.2; max-width: 96px; color: var(--ink); }
  .node .stars { color: var(--gold); font-size: 13px; letter-spacing: 1px; height: 14px; }
  .node .stars .off { color: #ecd9c6; }
  .node.next .ball { box-shadow: 0 0 0 4px #ffd0dc, 0 4px 0 var(--line); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  .node:disabled { cursor: not-allowed; opacity: 0.5; }
  .node:disabled .ball .num { background: #cdb9bc; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: #fff0f4; color: var(--accent-dark); margin: 0 2px; }
  .feat { display: flex; gap: 10px; align-items: center; text-align: left; background: #fff; border-radius: 16px; padding: 10px 12px; margin-top: 10px; box-shadow: 0 2px 0 var(--line); }
  .feat .mini { width: 70px; height: 60px; flex: none; }
  .feat p { margin: 0; font-size: 14px; }
  .layer-list { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; margin-top: 8px; font-size: 13px; color: var(--ink-soft); }
  .layer-list span { background: #fff; border-radius: 10px; padding: 3px 8px; box-shadow: 0 1px 0 var(--line); }
  .bigstars { font-size: 42px; color: var(--gold); letter-spacing: 4px; margin: 2px 0; }
  .bigstars .off { color: #ecd9c6; }
  .score { font-size: 30px; font-variant-numeric: tabular-nums; }
  .log { text-align: left; background: #fff; border-radius: 14px; padding: 8px 12px; margin: 10px 0 0; font-size: 14px; line-height: 1.6; list-style: none; }
  .log li { display: flex; justify-content: space-between; gap: 8px; }
  .log li em { font-style: normal; color: var(--ink-soft); white-space: nowrap; }
  .tip { background: #fff7e3; border-radius: 14px; padding: 10px 12px; font-size: 15px; margin-top: 10px; color: #7a5a1e; line-height: 1.45; }
  .help-steps { display: grid; gap: 8px; text-align: left; margin-top: 10px; }
  .help-steps div { display: flex; gap: 10px; align-items: flex-start; background: #fff; border-radius: 14px; padding: 10px 12px; font-size: 15px; line-height: 1.45; box-shadow: 0 2px 0 var(--line); }
  .help-steps b { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--mint); color: #fff; font-weight: normal; }
  .close-x { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: #fff; font-size: 20px; cursor: pointer; box-shadow: 0 2px 0 var(--line); }
  .book { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .book div { background: #fff; border-radius: 14px; padding: 8px 4px; box-shadow: 0 2px 0 var(--line); font-size: 12px; line-height: 1.3; }
  .book .mini { width: 56px; height: 48px; margin: 0 auto 4px; }
  .book small { display: block; color: var(--gold); font-size: 12px; }
  #toast { position: absolute; left: 50%; top: 64px; transform: translateX(-50%) translateY(-10px); z-index: 30; background: #fff; border-radius: 999px; padding: 8px 16px; font-size: 15px; white-space: nowrap; box-shadow: 0 6px 18px rgba(120,60,70,0.25); opacity: 0; pointer-events: none; transition: all 0.25s; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; font-size: 18px; color: var(--ink-soft); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  @media (prefers-reduced-motion: reduce) { .logo span, .node.next .ball { animation: none; } }
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="lv-chip"><b id="hud-lv">1</b><span id="hud-name">커스터드 푸딩</span></div>
    <div class="stats">
      <div class="stat" title="남은 낙하"><span class="pips" id="hud-drops"></span><small>낙하</small></div>
      <div class="stat" title="쟁반 위 재료 (들고 있는 것 포함)"><b id="hud-mats">0</b><small>재료</small></div>
      <div class="stat" title="점수"><b id="hud-score">0</b><small>점수</small></div>
    </div>
  </header>

  <main id="stage-wrap">
    <div id="loading">불러오는 중…</div>
    <canvas id="scene" aria-label="모아쿵 3D 게임 화면"></canvas>
    <div class="float-layer" id="ui-layer">
      <div id="cakehud"></div>
      <div id="aimcard"></div>
      <div id="badges"></div>
    </div>
    <div class="float-layer" id="fx-layer"></div>
    <div id="banner"></div>
    <div id="live" class="sr" aria-live="polite"></div>
  </main>

  <div id="lockbar">
    모을 개수
    <div class="stepper">
      <button id="lock-minus" type="button" aria-label="모을 개수 줄이기">−</button>
      <div id="lock-val" role="button" tabindex="0" aria-label="개수 제한 켜기/끄기">제한 없음</div>
      <button id="lock-plus" type="button" aria-label="모을 개수 늘리기">+</button>
    </div>
  </div>

  <footer id="bar">
    <button class="tb" id="btn-map" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5 9 4.5l6 2 5-2v13l-5 2-6-2-5 2z"/><path d="M9 4.5v13M15 6.5v13"/></svg>지도</button>
    <button class="tb" id="btn-restart" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5"/><path d="M4.5 4.5v4h4"/></svg><span>다시하기</span></button>
    <button class="tb" id="btn-book" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5h10.5a3 3 0 0 1 3 3V19.5H8a3 3 0 0 1-3-3z"/><path d="M5 16.5a3 3 0 0 1 3-3h10.5"/></svg>도감</button>
    <button class="tb" id="btn-help" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.6a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.4"/><circle cx="12" cy="16.8" r=".6" fill="currentColor"/></svg>조작법</button>
    <button class="tb" id="btn-sound" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 9.5h3.5l4.5-4v13l-4.5-4H4.5z"/><path id="snd-wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg><span id="snd-label">소리</span></button>
  </footer>

  <div id="overlay" role="dialog" aria-modal="true"></div>
  <div id="toast"></div>
</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/cannon-es.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script src="assets/strawberry_rose_tea.glb.js"></script>
<script src="js/rules.js"></script>
<script src="js/audio.js"></script>
<script src="js/world.js"></script>
<script src="js/game.js"></script>
</body>
</html>
