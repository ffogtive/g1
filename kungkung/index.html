<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>킁킁!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<!--
  킁킁! v2 — 강아지 코 피하기 아케이드 (목업)
  가설: "바닥의 내 폰을 강아지가 위에서 들여다본다" 앵글의 귀여움은 눈맞춤과 다가오는 코에서 나온다.
        v2는 강아지를 아기 비율(큰 눈·짧은 주둥이·외곽선)로 다시 그리고, 공격을 "빨간 것만 아프다" 규칙의
        6가지 패턴으로 늘려 "귀여워졌나? 풍부해졌나?"를 먼저 확인한다. (지도·간식은 다음 단계)
  - 한 번의 공격 = 단계 배열(PAT): 킁킁(흰 원이 쿠키를 따라옴) → 잠금(빨강) → 돌진(볼록렌즈처럼 코가 다가옴) → 쿵
  - 흰 원은 아직 안 아프다(가짜일 수 있음). 빨간 것만 아프다.
  - 견종마다 버릇: 회색이 = 킁 · 크게 킁 · 멈칫 킁 · 두 번 / 시바 = 킁 · 갸웃(가짜) · 앞발 콩콩 · 세 번
  - 테스트용 주소 옵션: ?seed=숫자 ?dog=grey|shiba ?pat=패턴이름
-->
<style>
  :root { --ink:#3b2a22; --pill:rgba(255,255,255,.92); --line:#e7d6c8; --accent:#ff7a59; --gold:#ffc23a; color-scheme: light; }
  html, body { margin:0; height:100%; overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; touch-action:none; color:var(--ink); background:#6fb6f2; font-family:"Jua","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; }
  #app { position:fixed; inset:0; padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px); }
  #stage { position:relative; width:100%; height:100%; }
  canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block; }
  #over { position:absolute; inset:0; display:none; place-items:center; background:rgba(40,30,25,.38); z-index:5; padding:16px; box-sizing:border-box; }
  #over.show { display:grid; }
  .card { background:#fffaf3; border-radius:24px; padding:18px 22px; text-align:center; box-shadow:0 12px 40px rgba(59,42,34,.35); animation:pop .3s cubic-bezier(.2,1.5,.5,1); max-width:300px; }
  @keyframes pop { from { transform:scale(.8); opacity:0; } }
  .card h2 { margin:0 0 6px; font-weight:normal; font-size:30px; }
  .big { font-size:40px; margin:2px 0; font-variant-numeric:tabular-nums; }
  .sub { font-size:15px; color:#8a6a5a; margin:4px 0 12px; line-height:1.5; }
  .shot { display:block; width:170px; height:238px; margin:6px auto 10px; border-radius:6px; background:#fff; padding:6px 6px 22px; box-shadow:0 4px 14px rgba(0,0,0,.18); transform:rotate(-2deg); object-fit:cover; }
  .row { display:flex; gap:10px; justify-content:center; }
  .pill { min-width:72px; height:52px; border:0; border-radius:999px; background:var(--pill); box-shadow:0 3px 0 var(--line); font:inherit; font-size:24px; color:var(--ink); padding:0 18px; cursor:pointer; }
  .pill.main { background:var(--accent); color:#fff; box-shadow:0 3px 0 #c9553a; }
  .pill:active { transform:translateY(2px); }
  #rot { position:fixed; inset:0; display:none; place-items:center; text-align:center; font-size:22px; background:#fff1cf; z-index:20; }
  @media (orientation: landscape) and (max-height: 520px) { #rot { display:grid; } }
</style>
</head>
<body>
<div id="rot">📱 세로로 돌려 주세요</div>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="over"><div class="card" id="card"></div></div>
  </div>
</div>
<script>
(function () {
  'use strict';
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d'), stage = document.getElementById('stage');
  var OL = '#3b2a22', BEST_KEY = 'kungkung.best', DOG_KEY = 'kungkung.dog';
  var Q = new URLSearchParams(location.search);

  /* ---------------- 시드 난수 (테스트 재현: ?seed=숫자) ---------------- */
  function mulberry(a) { return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  var seedParam = Q.get('seed');
  var rnd = mulberry(seedParam && /^\d+$/.test(seedParam) ? +seedParam : (Date.now() & 0xffffffff));
  var FX = Math.random;   // 연출용 (판정과 무관)

  /* ---------------- 레이아웃 (논리 px: 세로 390 기준) ---------------- */
  var s = 1, dpr = 1, Wl = 390, Hl = 760, floorY = 590;
  function resize() {
    var r = stage.getBoundingClientRect(); if (r.width < 10 || r.height < 10) return;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    s = Math.min(r.width / 390, r.height / 700);
    Wl = r.width / s; Hl = r.height / s; floorY = Hl * 0.8;
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    if (G) G.cookie.x = clampX(G.cookie.x);
  }
  function clampX(x) { return Math.max(46, Math.min(Wl - 46, x)); }
  function cookieY() { return floorY + 22; }

  /* ---------------- 견종 (숫자·색만 다르고 그리는 함수는 하나) ---------------- */
  var BREEDS = {
    grey: { name: '회색이', fur: '#a9abbe', shade: '#8b8da2', line: '#4a4b60', mark: '#f7f4ee', muzzle: '#f7f4ee', marks: 'blaze', ear: 'rose', earIn: '#f2b6ba',
      brow: '#7d7f95', blush: 'rgba(255,120,150,0.42)', nose: ['#7a6870', '#2c2227'], noseY: 0.58, eyeY: 0.0, tuft: 0,
      mix: ['kung', 'big', 'hold', 'double'] },
    shiba: { name: '시바', fur: '#eda457', shade: '#c97d36', line: '#6a3a1a', mark: '#fff4e2', muzzle: '#fff4e2', marks: 'urajiro', ear: 'tri', earIn: '#fff4e2',
      brow: '#fff4e2', blush: 'rgba(255,105,115,0.45)', nose: ['#6a5450', '#2b1f1d'], noseY: 0.56, eyeY: 0.02, tuft: 1,
      mix: ['kung', 'feint', 'paws', 'triple'] }
  };
  var UNLOCK_T = [0, 10, 20, 32];   // mix[i]가 풀리는 시각(초)

  /* ---------------- 표정 (숫자는 부드럽게 바뀌고 눈·입 모양은 바로 바뀜) ---------------- */
  var EXPR = {
    idle:   { eye: 'round',   mouth: 'w', lid: 0,    pupil: 1,    brow: 0,     tongue: 0,    blush: 1,   ear: 0,     puff: 0 },
    smile:  { eye: 'happy',   mouth: 'w', lid: 0,    pupil: 1,    brow: -0.04, tongue: 0,    blush: 1.3, ear: 0.1,   puff: 0 },
    focus:  { eye: 'round',   mouth: 'w', lid: 0,    pupil: 1.12, brow: -0.05,  tongue: 0,    blush: 1,   ear: -0.15, puff: 0.25 },
    inhale: { eye: 'round',   mouth: 'w', lid: 0,    pupil: 0.8,  brow: -0.1,  tongue: 0,    blush: 1.2, ear: -0.2,  puff: 0.9 },
    hold:   { eye: 'round',   mouth: 'w', lid: 0.35, pupil: 0.85, brow: 0.02,  tongue: 0,    blush: 1.5, ear: -0.1,  puff: 1 },
    lunge:  { eye: 'spark',   mouth: 'o', lid: 0,    pupil: 1.25, brow: -0.08, tongue: 0.45, blush: 1.5, ear: 0.6,   puff: 0 },
    huh:    { eye: 'dot',     mouth: 'w', lid: 0,    pupil: 1,    brow: -0.1,  tongue: 0,    blush: 1,   ear: 0.3,   puff: 0 },
    sneeze: { eye: 'squeeze', mouth: 'o', lid: 0,    pupil: 1,    brow: 0.06,  tongue: 0,    blush: 1.4, ear: 0.5,   puff: 0.5 },
    yum:    { eye: 'happy',   mouth: 'w', lid: 0,    pupil: 1,    brow: -0.06, tongue: 1,    blush: 2.1, ear: 0.2,   puff: 0 },
    tease:  { eye: 'wink',    mouth: 'w', lid: 0,    pupil: 1,    brow: -0.04, tongue: 0.9,  blush: 1.4, ear: 0.1,   puff: 0 }
  };
  var EKEYS = ['lid', 'pupil', 'brow', 'tongue', 'blush', 'ear', 'puff'];
  function exprCopy(m) { var o = {}, T = EXPR[m]; for (var k in T) o[k] = T[k]; return o; }

  /* ---------------- 공격 패턴 = 단계 배열 ----------------
     tell  : 킁킁. 흰 원이 쿠키를 늦게 따라옴 (아직 안 아픔)
     lunge : 돌진. 들어갈 때 원이 잠겨 빨개짐. fake면 흰 원 그대로 반쯤 오다 멈춤 (판정·톡 없음)
     hold  : 멈칫. 빨간 원이 쿠키 쪽으로 슬금슬금
     stamp : 쿵(유리에 코). back: 돌아감. tilt: 갸웃 + 메롱
     paws/slam : 앞발 두 개가 정해진 자리에 콩·콩 (처음부터 빨강) */
  var PAT = {
    kung:   { name: '킁',      boop: 1, steps: [{ k: 'tell', d: 0.55 }, { k: 'lunge' }, { k: 'stamp' }, { k: 'back', d: 0.32 }] },
    big:    { name: '크게 킁', label: '크게 킁!', boop: 1, big: 1, steps: [{ k: 'tell', d: 1.1, grow: 96, inhale: 1 }, { k: 'lunge', d: 0.55 }, { k: 'stamp' }, { k: 'back', d: 0.4 }] },
    hold:   { name: '멈칫 킁', label: '멈칫…', boop: 1, steps: [{ k: 'tell', d: 0.55 }, { k: 'hold' }, { k: 'lunge', d: 0.3 }, { k: 'stamp' }, { k: 'back', d: 0.32 }] },
    double: { name: '두 번 킁', label: '두 번!', boop: 1, reps: 2, steps: [{ k: 'tell', d: 0.6 }, { k: 'lunge' }, { k: 'stamp', d: 0.2 }, { k: 'back', d: 0.22 }] },
    triple: { name: '세 번 킁', label: '세 번!', boop: 1, reps: 3, steps: [{ k: 'tell', d: 0.6 }, { k: 'lunge' }, { k: 'stamp', d: 0.2 }, { k: 'back', d: 0.22 }] },
    feint:  { name: '갸웃 킁', label: '가짜?', boop: 1, steps: [{ k: 'tell', d: 0.55 }, { k: 'lunge', d: 0.22, zTo: 0.32, fake: 1 }, { k: 'tilt', d: 0.5 }, { k: 'tell', d: 0.42 }, { k: 'lunge' }, { k: 'stamp' }, { k: 'back', d: 0.32 }] },
    paws:   { name: '앞발 콩콩', label: '콩콩!', steps: [{ k: 'paws', d: 0.9 }, { k: 'slam', d: 0.95 }, { k: 'back', d: 0.3 }] }
  };
  var RETELL = 0.32;   // 연타 사이 다시 노리는 시간 (공정성: 0.3초 이상)

  /* ---------------- 상태 ---------------- */
  var G = null;
  var RULE = { HIT_R: 62, PAW_R: 48, CLOSE: 26, BOOP_Z0: 0.45, BOOP_Z0_BIG: 0.35, BOOP_Z1: 0.97, SAFE: 48 };
  var FORCE_PAT = PAT[Q.get('pat')] ? Q.get('pat') : null;
  var dogId = (function () { var q = Q.get('dog'); if (BREEDS[q]) return q; try { var v = localStorage.getItem(DOG_KEY); if (BREEDS[v]) return v; } catch (e) { /* 무시 */ } return 'grey'; })();
  function setDog(id) { dogId = id; try { localStorage.setItem(DOG_KEY, id); } catch (e) { /* 무시 */ } }
  function loadBest() { try { return +(localStorage.getItem(BEST_KEY) || 0); } catch (e) { return 0; } }
  function saveBest(v) { try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) { /* 무시 */ } }
  function newGame(started) {
    G = {
      state: started ? 'play' : 'title', t: 0, play: 0, score: 0, hearts: 3, combo: 0, best: loadBest(), prints: [], floorPrints: [], printCount: 0, dodges: 0, boops: 0,
      seen: {}, kinds: [], hitKinds: [], warnF2: 0, endT: null,
      cookie: { x: Wl / 2, tx: Wl / 2, wet: 0, scared: 0, run: 0, inv: 0, squash: 0 },
      dog: { z: 0, tilt: 0, tiltT: 0, look: 0, blink: 0, blinkT: 2, sneeze: 0, sniff: 0, recoil: 0, huh: 0, yum: 0, tease: 0, inhale: 0, squash: 0, flop: 0, flopT: 0, quirk: null, quirkT: 3, mood: 'idle', E: exprCopy('idle') },
      atk: null, nextAtk: 2.0, fx: [], pops: [], shake: 0, freeze: 0, lickT: 0, shot: null
    };
    hideOver();
  }

  /* ---------------- 소리·진동 ---------------- */
  var AC = null;
  function audio() {
    try {
      if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); var b = AC.createBuffer(1, 1, 22050), src = AC.createBufferSource(); src.buffer = b; src.connect(AC.destination); src.start(0); }
      if (AC.state !== 'running') AC.resume();
    } catch (e) { AC = null; }
  }
  ['pointerup', 'touchend', 'click'].forEach(function (t) { document.addEventListener(t, audio, { passive: true }); });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  function tone(type, f0, f1, dur, vol, delay) {
    if (!AC) return;
    try {
      var t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (e) { /* 무시 */ }
  }
  function noise(dur, vol, freq, type, delay) {
    if (!AC) return;
    try {
      var n = Math.floor(AC.sampleRate * dur), b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 1.5);
      var src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
      src.buffer = b; f.type = type || 'lowpass'; f.frequency.value = freq || 900; g.gain.value = vol;
      src.connect(f); f.connect(g); g.connect(AC.destination); src.start(AC.currentTime + (delay || 0));
    } catch (e) { /* 무시 */ }
  }
  var SND = {
    sniff: function () { noise(0.09, 0.22, 1800, 'bandpass'); noise(0.09, 0.22, 2100, 'bandpass', 0.14); },
    inhale: function () { noise(0.7, 0.16, 1200, 'bandpass'); tone('sine', 300, 700, 0.8, 0.06); },
    whoosh: function () { noise(0.25, 0.18, 900, 'lowpass'); },
    bonk: function () { tone('sine', 180, 70, 0.22, 0.45); noise(0.08, 0.2, 2600, 'bandpass'); tone('triangle', 900, 700, 0.06, 0.08); },
    paw: function () { tone('sine', 140, 60, 0.18, 0.4); noise(0.06, 0.15, 500, 'lowpass'); },
    pawTell: function () { tone('triangle', 660, 0, 0.07, 0.12); tone('triangle', 660, 0, 0.07, 0.12, 0.16); },
    dodge: function (c) { var f = [523, 587, 659, 784, 880, 988][Math.min(5, c)]; tone('triangle', f, 0, 0.14, 0.2); tone('sine', f * 2, 0, 0.08, 0.05); },
    close: function () { tone('sine', 880, 1320, 0.12, 0.18); },
    lick: function () { noise(0.4, 0.3, 600, 'bandpass'); tone('sine', 300, 180, 0.3, 0.2); },
    squish: function () { tone('sine', 240, 120, 0.16, 0.3); noise(0.12, 0.2, 900, 'bandpass'); },
    boop: function () { tone('sine', 700, 1500, 0.08, 0.3); tone('triangle', 1500, 0, 0.1, 0.08, 0.06); },
    sneeze: function () { tone('triangle', 520, 900, 0.12, 0.15); noise(0.3, 0.35, 3000, 'highpass', 0.12); },
    huh: function () { tone('sine', 400, 620, 0.18, 0.12); },
    tease: function () { tone('triangle', 700, 500, 0.1, 0.12); tone('triangle', 820, 600, 0.12, 0.12, 0.12); },
    over: function () { [523, 440, 349].forEach(function (f, i) { tone('triangle', f, 0, 0.25, 0.16, i * 0.15); }); }
  };
  function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) { /* 무시 */ } }

  /* ---------------- 입력: 아래(바닥) = 쿠키 끌기, 다가온 코 = 톡 ---------------- */
  function toL(e) { var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / s, y: (e.clientY - r.top) / s }; }
  var drags = {};
  function chipRects() {   // 제목 화면 견종 고르기
    var y = Hl - 40, w = 112, gap = 12, x0 = Wl / 2 - w - gap / 2;
    return [{ id: 'grey', x: x0, y: y - 20, w: w, h: 40 }, { id: 'shiba', x: x0 + w + gap, y: y - 20, w: w, h: 40 }];
  }
  cv.addEventListener('pointerdown', function (e) {
    audio();
    var p = toL(e);
    if (G.state === 'title') {
      var hit = chipRects().filter(function (c) { return p.x >= c.x && p.x <= c.x + c.w && p.y >= c.y && p.y <= c.y + c.h; })[0];
      if (hit) { if (hit.id !== dogId) { setDog(hit.id); G.dog.quirk = { k: 'happy', t: 0.8 }; SND.huh(); } return; }
      newGame(true); G.cookie.tx = clampX(p.x); drags[e.pointerId] = true; try { cv.setPointerCapture(e.pointerId); } catch (er) { /* 무시 */ } return;
    }
    if (G.state !== 'play') return;
    try { cv.setPointerCapture(e.pointerId); } catch (er) { /* 무시 */ }
    if (tryBoop(p)) return;   // 코가 바닥 가까이 내려와 있어도 코 위를 누르면 톡이 먼저
    if (p.y >= floorY - 70) { drags[e.pointerId] = true; G.cookie.tx = clampX(p.x); }
  });
  cv.addEventListener('pointermove', function (e) { if (!drags[e.pointerId] || !G || G.state !== 'play') return; G.cookie.tx = clampX(toL(e).x); });
  function endP(e) { delete drags[e.pointerId]; }
  cv.addEventListener('pointerup', endP); cv.addEventListener('pointercancel', endP);
  /** 코 톡: 진짜 돌진 후반(코가 가까울 때) 코를 누르면 재채기하며 물러남. 가짜 돌진·앞발엔 안 됨 */
  function tryBoop(p) {
    var a = G.atk, D = G.dog; if (!a || !a.st || a.st.k !== 'lunge' || a.fake || !a.P.boop || G.endT != null) return false;
    var n = nosePose(), d = Math.hypot(p.x - n.x, p.y - n.y), z0 = a.P.big ? RULE.BOOP_Z0_BIG : RULE.BOOP_Z0;
    if (d > n.r * 1.25 || D.z < z0 || D.z > RULE.BOOP_Z1) return false;
    var pts = a.P.big ? 50 : 30;
    a.st = { k: 'boop' }; a.t = 0; a.dur = 0.6; a.z0 = D.z; a.locked = false;
    D.sneeze = 1; D.recoil = 1; G.boops++; G.combo++;
    addScore(pts); pop('에취!', n.x, n.y - n.r - 10, 34, '#ffffff'); pop('+' + pts, n.x + 50, n.y, 22, '#ffd23f');
    SND.boop(); setTimeout(SND.sneeze, 120); buzz([15, 30, 15]); G.shake = 6;
    for (var i = 0; i < 14; i++) G.fx.push({ type: 'mist', x: n.x + (FX() - 0.5) * n.r, y: n.y + n.r * 0.3, vx: (FX() - 0.5) * 260, vy: 60 + FX() * 160, t: 0, life: 0.6 + FX() * 0.3, r: 4 + FX() * 6 });
    return true;
  }

  /* ---------------- 공격 ---------------- */
  function interval() { return Math.max(0.7, 1.6 - G.play * 0.025); }
  function lungeTime() { return Math.max(0.28, 0.42 - G.play * 0.003); }
  /** 견종 버릇표에서 고름. 새로 풀린 패턴은 처음 한 번은 꼭 보여 줌. rnd는 항상 1번만 씀(재현) */
  function pickKind() {
    var r = rnd();
    if (FORCE_PAT) return FORCE_PAT;
    var mix = BREEDS[dogId].mix, avail = [], i;
    for (i = 0; i < mix.length; i++) if (G.play >= UNLOCK_T[i]) avail.push(mix[i]);

    if (sc) { ctx.ellipse(0, 6, 3, 3.5, 0, 0, Math.PI * 2); ctx.stroke(); } else { ctx.moveTo(-4, 5); ctx.quadraticCurveTo(0, 9, 4, 5); ctx.stroke(); }
    ctx.fillStyle = 'rgba(255,120,120,0.45)'; ctx.beginPath(); ctx.ellipse(-14, 4, 4, 2.5, 0, 0, Math.PI * 2); ctx.ellipse(14, 4, 4, 2.5, 0, 0, Math.PI * 2); ctx.fill();
    if (C.wet > 0) { ctx.fillStyle = 'rgba(140,200,255,0.85)'; [[-22, -18], [18, -16], [0, -22]].forEach(function (p, i) { var yy = p[1] + ((G.t * 30 + i * 7) % 14); ctx.beginPath(); ctx.moveTo(p[0], yy - 5); ctx.quadraticCurveTo(p[0] + 4, yy + 2, p[0], yy + 4); ctx.quadraticCurveTo(p[0] - 4, yy + 2, p[0], yy - 5); ctx.fill(); }); }
    if (sc && !C.wet) { ctx.fillStyle = '#8fd6ff'; ctx.beginPath(); ctx.moveTo(26, -16); ctx.quadraticCurveTo(31, -8, 26, -6); ctx.quadraticCurveTo(21, -8, 26, -16); ctx.fill(); }
    ctx.restore();
  }

  /* ---------------- 그리기 ---------------- */
  function drawText(t, x, y, size, color, align) { ctx.font = size + 'px Jua, sans-serif'; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round'; ctx.lineWidth = size * 0.26; ctx.strokeStyle = OL; ctx.strokeText(t, x, y); ctx.fillStyle = color; ctx.fillText(t, x, y); }
  /** 바닥의 목표: 흰 점선 = 아직 노리는 중(안 아픔), 빨강 = 잠김(아픔). 앞발 자리는 처음부터 빨강 */
  function drawAim(outlineOnly) {
    var a = G.atk; if (!a || !a.st) return;
    var k = a.st.k, y = cookieY() + 4, pulse = 1 + Math.sin(G.t * 20) * 0.04;
    function ring(x, r, red, fillAl) {
      if (!outlineOnly) { ctx.fillStyle = red ? 'rgba(255,90,90,' + 0.32 * fillAl + ')' : 'rgba(60,40,40,' + 0.24 * fillAl + ')'; ctx.beginPath(); ctx.ellipse(x, y, r * pulse, 16 * pulse, 0, 0, Math.PI * 2); ctx.fill(); }
      ctx.strokeStyle = red ? 'rgba(255,90,90,' + (outlineOnly ? 0.6 : 0.85) + ')' : 'rgba(255,255,255,' + (outlineOnly ? 0.5 : 0.8) + ')'; ctx.lineWidth = 3; ctx.setLineDash([8, 6]);
      ctx.beginPath(); ctx.ellipse(x, y, r, 16, 0, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    }
    if (k === 'tell' || k === 'lunge' || k === 'hold' || k === 'tilt') ring(a.locked ? a.lockX : a.tx, a.r, a.locked, 1);
    else if ((k === 'paws' || k === 'slam') && a.slams) a.slams.forEach(function (sl) { if (!sl.done) ring(sl.x, a.r, true, k === 'paws' ? 0.4 + 0.6 * Math.min(1, a.t / a.dur) : 1); });
  }
  function drawPaws() {
    var a = G.atk; if (!a || !a.st || !a.slams) return;
    var k = a.st.k, B = BREEDS[dogId], ground = cookieY() - 4, hover = floorY - 150;
    var order = a.slams.slice().sort(function (p, q) { return p.x - q.x; });
    a.slams.forEach(function (sl, i) {
      if (sl.cancel) return;
      var y, sc, sd = order[0] === sl ? -1 : 1, sh = shoulder(sd);
      if (k === 'paws') { y = hover + Math.sin(G.t * 9 + i * 2) * 8; sc = 0.85; }   // 앞다리를 들어 올려 들썩 (어디로 올지 예고)
      else if (k === 'slam') {
        var u = a.t - (sl.at - 0.1);
        if (u < 0) { y = hover; sc = 0.85; }
        else if (u < 0.1) { var q = u / 0.1; y = hover + (ground - hover) * q * q; sc = 0.85 + 0.15 * q; }
        else if (u < 0.32) { y = ground; sc = 1; }
        else { var q2 = Math.min(1, (u - 0.32) / 0.25); y = ground + (hover - ground) * q2; sc = 1 - 0.15 * q2; }
      } else return;
      drawLeg(ctx, B, sh.x, sh.y, sl.x, y);
      drawPaw(ctx, B, sl.x, y, sc);
    });
  }
  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
    var shx = (FX() - 0.5) * G.shake * 2, shy = (FX() - 0.5) * G.shake * 2;
    ctx.setTransform(dpr * s, 0, 0, dpr * s, shx * dpr * s, shy * dpr * s);
    var B = BREEDS[dogId];
    // 하늘 (아래에서 올려다본 파란 하늘 + 흰 구름)
    var g = ctx.createLinearGradient(0, 0, 0, floorY);
    g.addColorStop(0, '#3f8fe0'); g.addColorStop(0.6, '#6fb6f2'); g.addColorStop(1, '#a9d6fb');
    ctx.fillStyle = g; ctx.fillRect(-30, -30, Wl + 60, Hl + 60);
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    for (var c = 0; c < 6; c++) { var cx = ((c * 97 + G.t * (8 + c * 3)) % (Wl + 160)) - 80, cy = 40 + c * 70 % 260; ctx.beginPath(); ctx.ellipse(cx, cy, 34, 9, 0, 0, Math.PI * 2); ctx.ellipse(cx + 18, cy - 5, 18, 8, 0, 0, Math.PI * 2); ctx.fill(); }
    // 강아지가 앞쪽(코가 다가올 때)이면 쿠키 위로 그림
    var dogFront = G.dog.z > 0.55, ak = G.atk && G.atk.st ? G.atk.st.k : '';
    drawBody(ctx, B, ak === 'paws' || ak === 'slam');
    if (!dogFront) drawDog(ctx, B, G.dog.E, dogPose());
    // 바닥: 나무 상자 모서리 (사진처럼 아래 가장자리)
    ctx.fillStyle = '#d9b48a'; ctx.beginPath(); ctx.moveTo(-30, floorY); ctx.quadraticCurveTo(Wl / 2, floorY - 14, Wl + 30, floorY); ctx.lineTo(Wl + 30, Hl + 30); ctx.lineTo(-30, Hl + 30); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e8c9a2'; ctx.beginPath(); ctx.moveTo(-30, floorY); ctx.quadraticCurveTo(Wl / 2, floorY - 14, Wl + 30, floorY); ctx.lineTo(Wl + 30, floorY + 10); ctx.quadraticCurveTo(Wl / 2, floorY - 4, -30, floorY + 10); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(150,100,60,0.35)'; ctx.lineWidth = 2; for (var gr = 0; gr < 4; gr++) { ctx.beginPath(); ctx.moveTo(-30, floorY + 30 + gr * 28); ctx.quadraticCurveTo(Wl / 2, floorY + 18 + gr * 28, Wl + 30, floorY + 30 + gr * 28); ctx.stroke(); }
    // 바닥에 남은 발자국
    G.floorPrints.forEach(function (p) {
      var al = Math.max(0, 1 - p.t / p.life) * 0.45, y = cookieY() + 8;
      ctx.save(); ctx.globalAlpha = al; ctx.fillStyle = '#9a6b45'; ctx.translate(p.x, y); ctx.scale(1, 0.35);
      ctx.beginPath(); ctx.ellipse(0, 6, 22, 18, 0, 0, Math.PI * 2); ctx.fill();
      [[-30, -14], [-11, -26], [11, -26], [30, -14]].forEach(function (b) { ctx.beginPath(); ctx.ellipse(b[0], b[1], 8, 10, 0, 0, Math.PI * 2); ctx.fill(); });
      ctx.restore();
    });
    drawAim(false);
    drawCookie();
    if (dogFront) { drawDog(ctx, B, G.dog.E, dogPose()); drawAim(true); }
    drawPaws();
    // 효과
    G.fx.forEach(function (p) {
      var al = 1 - p.t / p.life;
      if (p.type === 'heart') { ctx.save(); ctx.globalAlpha = al; ctx.translate(p.x, p.y); ctx.scale(p.r / 9, p.r / 9); ctx.fillStyle = '#ff7aa2'; ctx.beginPath(); ctx.moveTo(0, 9); ctx.bezierCurveTo(-16, -2, -9, -15, 0, -6); ctx.bezierCurveTo(9, -15, 16, -2, 0, 9); ctx.fill(); ctx.restore(); return; }
      ctx.fillStyle = p.type === 'mist' ? 'rgba(255,255,255,' + al * 0.8 + ')' : 'rgba(140,200,255,' + al + ')'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    });
    // 날름: 큰 혀가 화면을 쓱
    if (G.lickT > 0) {
      var q = G.lickT / 0.7, L = 90 + Math.sin(q * Math.PI) * Hl * 0.42, TW = 78;
      ctx.save(); ctx.translate(G.lickX, Hl + 40); ctx.rotate(-0.9 + q * 1.8);
      ctx.fillStyle = '#ff8fab'; ctx.strokeStyle = '#e0607f'; ctx.lineWidth = 5; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(-TW, 0); ctx.lineTo(-TW, -L + TW); ctx.arc(0, -L + TW, TW, Math.PI, 0); ctx.lineTo(TW, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -L + TW * 0.7); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.beginPath(); ctx.ellipse(-TW * 0.45, -L + TW * 1.2, TW * 0.18, TW * 0.5, 0.1, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    // 유리에 남은 코 도장
    G.prints.forEach(function (p) {
      var al = Math.max(0, 1 - p.t / p.life) * Math.min(1, p.t / 0.5), r = p.r;
      if (al <= 0) return;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = al;
      ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.beginPath(); ctx.moveTo(-r * 1.05, -r * 0.2);
      ctx.quadraticCurveTo(-r, -r * 0.95, 0, -r * 0.9); ctx.quadraticCurveTo(r, -r * 0.95, r * 1.05, -r * 0.2);
      ctx.quadraticCurveTo(r, r * 0.75, r * 0.2, r * 0.8); ctx.quadraticCurveTo(0, r * 0.62, -r * 0.2, r * 0.8); ctx.quadraticCurveTo(-r, r * 0.75, -r * 1.05, -r * 0.2); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(90,100,120,0.22)'; [-1, 1].forEach(function (sd) { ctx.beginPath(); ctx.ellipse(sd * r * 0.42, r * 0.05, r * 0.18, r * 0.27, sd * 0.5, 0, Math.PI * 2); ctx.fill(); });
      ctx.fillStyle = 'rgba(255,255,255,0.35)'; for (var k = 0; k < 9; k++) { var an = k * 2.4, rr2 = r * (0.25 + (k % 3) * 0.2); ctx.beginPath(); ctx.arc(Math.cos(an) * rr2, Math.sin(an) * rr2 * 0.7 - r * 0.2, r * 0.05, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
    });
    // 강아지 머리 위: 갸웃 "??", 연타 ●●●
    var hb = headBase(), HR = headR(), a = G.atk;
    if (G.dog.huh > 0) { ctx.save(); ctx.globalAlpha = Math.min(1, G.dog.huh * 2); drawText('??', hb.x + HR * 1.2, hb.y - HR * 1.0, 34, '#ffffff'); ctx.restore(); }
    if (a && a.P.reps && a.st && a.st.k !== 'boop') {
      var done = a.rep - 1 + ((a.st.k === 'stamp' || a.st.k === 'back') ? 1 : 0);
      for (var j = 0; j < a.P.reps; j++) { var dx = hb.x + (j - (a.P.reps - 1) / 2) * 26, dy = hb.y - HR * 1.5; ctx.beginPath(); ctx.arc(dx, dy, 9, 0, Math.PI * 2); ctx.fillStyle = j < done ? 'rgba(255,255,255,0.45)' : '#ff6b6b'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = OL; ctx.stroke(); }
    }
    // 팝업 글자
    G.pops.forEach(function (p) {
      var q = p.t / p.life, sc = q < 0.15 ? 0.6 + q / 0.15 * 0.6 : 1.2 - Math.min(0.2, q - 0.15);
      ctx.save(); ctx.globalAlpha = q > 0.75 ? (1 - q) / 0.25 : 1; ctx.translate(p.x, p.y - q * 30); ctx.scale(sc, sc);
      drawText(p.text, 0, 0, p.size, p.color); ctx.restore();
    });
    // 위: 하트 · 점수
    if (G.state !== 'title') {
      for (var i = 0; i < 3; i++) { var hx = 26 + i * 34, hy = 34, on = i < G.hearts; ctx.save(); ctx.translate(hx, hy); ctx.fillStyle = on ? '#ff6b8b' : 'rgba(255,255,255,0.4)'; ctx.strokeStyle = OL; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(0, 9); ctx.bezierCurveTo(-16, -2, -9, -15, 0, -6); ctx.bezierCurveTo(9, -15, 16, -2, 0, 9); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }
      drawText(String(G.score), Wl - 18, 36, 34, '#ffffff', 'right');
      if (G.combo >= 2) drawText(G.combo + '연속', Wl - 18, 66, 18, '#ffd23f', 'right');
    } else {
      // 제목 화면
      drawText('킁킁!', Wl / 2, Hl * 0.1, 64, '#ffffff');
      if (G.best) drawText('최고 ' + G.best, Wl / 2, Hl * 0.1 + 48, 18, '#ffd23f');
      var pz = (G.t % 1.6) / 1.6, hx2 = Wl / 2 + Math.sin(pz * Math.PI * 2) * 70, hy2 = floorY + 62;
      ctx.fillStyle = 'rgba(255,255,255,0.95)'; ctx.strokeStyle = OL; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(hx2, hy2, 15, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      drawText('쿠키를 끌어서 코를 피해요', Wl / 2, floorY + 0.45 * (Hl - floorY) + 10, 22, '#ffffff');
      chipRects().forEach(function (ch) {
        var on = ch.id === dogId;
        ctx.fillStyle = on ? '#ff7a59' : 'rgba(255,255,255,0.9)'; ctx.strokeStyle = OL; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.roundRect ? ctx.roundRect(ch.x, ch.y, ch.w, ch.h, 20) : ctx.rect(ch.x, ch.y, ch.w, ch.h); ctx.fill(); ctx.stroke();
        ctx.font = '20px Jua, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = on ? '#ffffff' : OL; ctx.fillText(BREEDS[ch.id].name, ch.x + ch.w / 2, ch.y + ch.h / 2 + 1);
      });
    }
  }

  /* ---------------- 루프 ---------------- */
  var last = performance.now(), fpsAcc = 0, fpsN = 0, fps = 60;
  function frame(now) {
    requestAnimationFrame(frame);
    var raw = (now - last) / 1000, dt = Math.min(0.05, raw); last = now;
    fpsAcc += raw; fpsN++; if (fpsAcc >= 1) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
    if (G) { update(dt); render(); }
  }
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);

  /* ---------------- 읽기 전용 관찰 창 (자동 검증용) ---------------- */
  function toClient(x, y) { var r = cv.getBoundingClientRect(); return { x: Math.round(r.left + x * s), y: Math.round(r.top + y * s) }; }
  var PHASE = { tell: 'windup', paws: 'windup', lunge: 'lunge', hold: 'hold', tilt: 'tilt', stamp: 'impact', slam: 'slam', back: 'back', boop: 'boop' };
  window.kung = {
    snapshot: function () {
      var a = G.atk, n = nosePose(), cn = toClient(n.x, n.y), ck = toClient(G.cookie.x, cookieY()), D = G.dog, aim = null;
      if (a && a.st) aim = a.locked && a.lockX != null ? a.lockX : a.tx;
      var hits = hitsOf(a);
      return { state: G.state, t: +G.play.toFixed(2), score: G.score, hearts: G.hearts, combo: G.combo, dodges: G.dodges, boops: G.boops, prints: G.printCount, best: G.best,
        breed: dogId, mood: D.mood, eye: D.E.eye, warnF2: G.warnF2, hitKinds: G.hitKinds.slice(), fps: Math.round(fps), kinds: G.kinds.slice(),
        cookie: { x: Math.round(G.cookie.x), sx: ck.x, sy: ck.y }, look: +D.look.toFixed(3), z: +D.z.toFixed(3),
        atk: a && a.st ? { kind: a.kind, phase: a.fake ? 'fake' : PHASE[a.st.k], step: a.st.k, i: a.i, rep: a.rep, t: +a.t.toFixed(3), fake: a.fake ? 1 : 0, color: a.locked ? 'red' : 'white', first: a.first ? 1 : 0,
          r: Math.round(a.r), tx: aim == null ? null : Math.round(aim), stx: aim == null ? null : toClient(aim, 0).x,
          hits: hits.map(function (v) { return [Math.round(v[0]), Math.round(v[1])]; }), shits: hits.map(function (v) { return [toClient(v[0], 0).x, toClient(v[1], 0).x]; }),
          paws: a.slams ? a.slams.map(function (sl) { return { x: Math.round(sl.x), sx: toClient(sl.x, 0).x, done: sl.done ? 1 : 0 }; }) : null } : null,
        nose: { sx: cn.x, sy: cn.y, r: Math.round(n.r * s) }, floor: toClient(0, floorY + 40).y, over: document.getElementById('over').classList.contains('show'), shot: !!G.shot,
        chips: G.state === 'title' ? chipRects().map(function (c) { var p = toClient(c.x + c.w / 2, c.y + c.h / 2); return { id: c.id, sx: p.x, sy: p.y }; }) : null };
    }
  };

  resize();
  newGame(false);
  requestAnimationFrame(frame);
})();
</script>
