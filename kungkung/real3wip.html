<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>킁킁! 실사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<!--
  킁킁! 실사 — 3열×2줄 (회색이·잔디 / 타조·사바나)
  가설: 카메라가 낮아 두 줄의 화면 간격이 40px 남짓이다. 앞뒤를 연속 깊이로 두지 않고 두 줄 사이를 0.12초 "폴짝"으로
        건너게 하면, 가로 끌기와 폴짝이 동시에 되는 대각선이 회피 기술이 되고, 6칸 모두에서 "그 자리만 앙" 하는 손맛이 산다.
  - 칸: 앞줄 F0·F1·F2, 뒷줄 B0·B1·B2. 칸 = 클립에서 잰 입(부리)이 땅에 닿는 점. 영상을 가로·세로로 밀어 그 점을 칸 중심에 맞춘다.
  - 쿠키: 땅 좌표 X(칸 단위, −1.42~+1.42)와 줄로 움직인다. 화면 x는 줄마다 칸 중심 세 점을 잇는 선으로 바꾼다(뒷줄은 약 0.7배).
  - 조작: 상대 끌기(손가락 105px = 1칸). 위·아래로 44px 끌거나 빠르게 쓸면 폴짝. 가로와 폴짝은 동시에 된다(대각선).
  - 판정: 같은 줄이고 |X쿠키 − X칸| < R(칸 단위)이면 물린다. 화면에 그린 타원이 곧 판정이다.
  - 영상 전환: 숨긴 채 미리 되감아 두고(prime) 새 프레임이 준비된 뒤 위층만 0→1 (끊김 없음).
  - 테스트 옵션: ?sp=grey|ostrich ?cells=3(앞줄 3칸만) ?vy=0(세로 밀기 끄기) ?seed=숫자 ?pat=패턴 ?hs=히트스톱ms ?nocv=1(그림 숨김)
-->
<style>
  :root { --ink:#3b2a22; --pill:rgba(255,255,255,.92); --line:#e7d6c8; --accent:#ff7a59; color-scheme: light; }
  html, body { margin:0; height:100%; overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; touch-action:none; color:var(--ink); background:#5f9fe0; font-family:"Jua","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; }
  #app { position:fixed; inset:0; padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px); }
  #stage { position:relative; width:100%; height:100%; overflow:hidden; background:linear-gradient(#4f8fdc,#8cc2f2); }
  #vids { position:absolute; left:0; top:0; width:100%; height:100%; will-change:transform; }
  /* 영상 층: 대기(arm)는 거의 투명하게 깔아 두고(완전 0이면 브라우저가 프레임을 안 그림), 들어오는 층(in)만 위에서 0→1 (JS) */
  #vids video, #vids img { position:absolute; inset:0; width:100%; height:100%; object-fit:fill; opacity:0; z-index:1; pointer-events:none; }
  #vids .arm { opacity:.001; }
  #vids .live { opacity:1; z-index:2; }
  #vids .in { z-index:3; }
  #vids .mir { transform:scaleX(-1); }
  canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block; }
  #pick { position:absolute; left:0; right:0; top:19%; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; padding:0 16px; z-index:4; }
  #pick[hidden] { display:none; }
  #pick .pill { font-size:20px; height:48px; opacity:.72; }
  #pick .pill.on { opacity:1; background:#fffaf3; box-shadow:0 3px 0 var(--accent), 0 0 0 3px rgba(255,122,89,.55); }
  #over { position:absolute; inset:0; display:none; place-items:center; background:rgba(40,30,25,.38); z-index:5; padding:16px; box-sizing:border-box; }
  #over.show { display:grid; }
  .card { background:#fffaf3; border-radius:24px; padding:18px 22px; text-align:center; box-shadow:0 12px 40px rgba(59,42,34,.35); animation:pop .3s cubic-bezier(.2,1.5,.5,1); max-width:300px; }
  @keyframes pop { from { transform:scale(.8); opacity:0; } }
  .card h2 { margin:0 0 6px; font-weight:normal; font-size:30px; }
  .big { font-size:40px; margin:2px 0; font-variant-numeric:tabular-nums; }
  .sub { font-size:15px; color:#8a6a5a; margin:4px 0 12px; line-height:1.5; }
  .shot { display:block; width:170px; height:238px; margin:6px auto 10px; border-radius:6px; background:#fff; padding:6px 6px 22px; box-shadow:0 4px 14px rgba(0,0,0,.18); transform:rotate(-2deg); object-fit:cover; }
  .row { display:flex; gap:10px; justify-content:center; }
  .pill { min-width:72px; height:52px; border:0; border-radius:999px; background:var(--pill); box-shadow:0 3px 0 var(--line); font:inherit; font-size:24px; color:var(--ink); padding:0 18px; cursor:pointer; }
  .pill.main { background:var(--accent); color:#fff; box-shadow:0 3px 0 #c9553a; }
  #rot { position:fixed; inset:0; display:none; place-items:center; text-align:center; font-size:22px; background:#fff1cf; z-index:20; }
  @media (orientation: landscape) and (max-height: 520px) { #rot { display:grid; } }
</style>
</head>
<body>

<div id="app">
  <div id="stage">
    <div id="vids"><img id="v_base" class="live" src="real/v3/base.jpg" alt=""></div>
    <canvas id="cv"></canvas>
    <div id="pick" hidden>
      <button class="pill" data-sp="grey" aria-label="회색이, 잔디">회색이 · 잔디</button>
      <button class="pill" data-sp="ostrich" aria-label="타조, 사바나">타조 · 사바나</button>
    </div>
    <div id="over"><div class="card" id="card"></div></div>

</div>
<script>
(function () {

  var DUR = 5.04;

              nose: [[0, 0.50, 0.42], [0.6, 0.50, 0.50], [0.8, 0.50, 0.64], [1, 0.50, 0.82]] },

        bc: { file: 'v3/back_c', rev: 'v3/back_c_rev', appr: [0.40, 1.00], up: 4.0, bite: { x: 0.54, y: 0.86 },
              nose: [[0, 0.50, 0.42], [0.17, 0.53, 0.55], [0.42, 0.52, 0.65], [0.67, 0.55, 0.76], [0.92, 0.55, 0.85], [1, 0.54, 0.86]] },
        bl: { file: 'v3/back_l', rev: 'v3/back_l_rev', appr: [2.15, 2.85], up: 4.5, bite: { x: 0.28, y: 0.845 },
              nose: [[0, 0.50, 0.42], [0.15, 0.53, 0.55], [0.36, 0.36, 0.825], [0.6, 0.25, 0.82], [1, 0.28, 0.845]] },
        h:  { file: 'v3/hsnap', rev: null, appr: [0.08, 0.23], up: 1.25, bite: { x: 0.50, y: 0.90 },
              nose: [[0, 0.50, 0.86], [0.3, 0.50, 0.72], [0.6, 0.50, 0.62], [0.85, 0.50, 0.80], [1, 0.50, 0.90]] }
      },
      hover: { file: 'v3/hover', down: [0.3, 1.0] },                       // 멈칫: 고개 숙여 입 벌린 채 킁킁
      feint: { file: 'v3/feint', down: [0.35, 1.6], tilt: [1.6, 4.6] },    // 가짜: 숙이다 멈칫 → 킁킁·갸웃 → 듦
      special: { file: 'v3/paws', label: '콩콩!', hit: '콩!', snd: 'paw', row: 0, from: 1.1, to: 3.2, rate: 1.4,   // 앞발 콩콩: 앞줄 오른쪽(반전 왼쪽)
                 taps: [{ t: 1.7, x: 0.62, y: 0.92 }, { t: 2.7, x: 0.68, y: 0.92 }] },
      sneeze: { file: 'v3/sneeze', seg: [2.9, 3.9], rate: 1.4 },          // 코 톡 → 에취

    },
    ostrich: {
      name: '타조', place: '사바나', idle: 'ostrich/idle', base: 'real/ostrich/base.jpg',
      sky: 'linear-gradient(#d9a868,#f3dcae)', body: '#e3b87c',
      rows: [0.93, 0.88], nose0: { x: 0.58, y: 0.56 },
      words: { bite: '콕!', miss: '콕?', sneeze: '푸드득!' },
      tuft: ['rgba(170,126,58,0.95)', 'rgba(212,176,102,0.95)'], blade: '196,154,82', guide: '255,246,220',
      snd: { chomp: 'peck', chew: 'gulp' },
      snap: {

              nose: [[0, 0.58, 0.60], [0.6, 0.60, 0.79], [0.83, 0.60, 0.88], [1, 0.60, 0.95]] },
        fr: { file: 'ostrich/front_r', rev: 'ostrich/front_r_rev', appr: [2.15, 2.60], up: 4.5, bite: { x: 0.75, y: 0.91 },
              nose: [[0, 0.58, 0.55], [0.22, 0.60, 0.61], [0.44, 0.64, 0.70], [0.67, 0.72, 0.79], [0.89, 0.72, 0.90], [1, 0.75, 0.91]] },
        bc: { file: 'ostrich/back_c', rev: 'ostrich/back_c_rev', appr: [0.40, 1.40], up: 4.4, bite: { x: 0.53, y: 0.89 },
              nose: [[0, 0.56, 0.59], [0.2, 0.54, 0.67], [0.4, 0.54, 0.73], [0.6, 0.53, 0.78], [0.8, 0.54, 0.845], [1, 0.53, 0.90]] },
        bl: { file: 'ostrich/back_l', rev: null, back: 'fwd', appr: [0.50, 3.30], up: 4.4, bite: { x: 0.36, y: 0.88 }, minLunge: 0.6,   // 가운데로 숙였다가 왼쪽으로 가서 콕 (2.8초 구간)
              nose: [[0, 0.57, 0.57], [0.27, 0.52, 0.79], [0.71, 0.35, 0.77], [1, 0.36, 0.88]] },
        h:  { file: 'ostrich/hsnap', rev: null, appr: [0.15, 0.36], up: 0.9, bite: { x: 0.58, y: 0.89 },
              nose: [[0, 0.57, 0.76], [0.48, 0.60, 0.78], [0.81, 0.58, 0.845], [1, 0.58, 0.89]] }
      },
      hover: { file: 'ostrich/hover', down: [0.3, 1.0] },
      feint: { file: 'ostrich/feint', down: [0.5, 1.25], tilt: [1.25, 4.8] },
      special: { file: 'ostrich/stomp', label: '쿵!', hit: '쿵!', snd: 'stomp', row: 1, from: 1.0, to: 4.4, rate: 1.7,   // 발 구르기: 뒷줄 오른쪽(반전 왼쪽)
                 taps: [{ t: 3.35, x: 0.65, y: 0.86 }] },
      sneeze: { file: 'ostrich/sneeze', seg: [1.9, 3.8], rate: 1.6 },     // 머리 털기
      eat: { file: 'ostrich/gulp', to: 4.6, word: '꿀꺽!' }
    }
  };
  /** 6칸: 줄(0 앞, 1 뒤) × 열(0 왼쪽). 바깥 칸은 한 클립을 반전해 쓴다 */
  var CELL_KEYS = [
    { row: 0, col: 0, key: 'fr', mir: true }, { row: 0, col: 1, key: 'fc', mir: false }, { row: 0, col: 2, key: 'fr', mir: false },
    { row: 1, col: 0, key: 'bl', mir: false }, { row: 1, col: 1, key: 'bc', mir: false }, { row: 1, col: 2, key: 'bl', mir: true }];
  var CELL_NAME = ['F0', 'F1', 'F2', 'B0', 'B1', 'B2'];
  var ROWS = Q.get('cells') === '3' ? 1 : 2, NCELL = ROWS * 3;
  function loadSp() { try { return localStorage.getItem(SP_KEY); } catch (e) { return null; } }
  function saveSp(k) { try { localStorage.setItem(SP_KEY, k); } catch (e) { /* 무시 */ } }
  var SPK = SPECIES[Q.get('sp')] ? Q.get('sp') : SPECIES[loadSp()] ? loadSp() : 'grey', SP = SPECIES[SPK];
  var IDLE = SP.idle, FIRST_FILES = [], MORE_FILES = [];
  function fileLists() {
    IDLE = SP.idle; FIRST_FILES = [IDLE]; MORE_FILES = [];
    ['fc', 'fr'].concat(ROWS > 1 ? ['bc', 'bl'] : []).forEach(function (k) { var c = SP.snap[k]; FIRST_FILES.push(c.file); if (c.rev) FIRST_FILES.push(c.rev); });
    MORE_FILES = [SP.feint.file, SP.hover.file, SP.snap.h.file, SP.sneeze.file, SP.eat.file].concat(ROWS > 1 ? [SP.special.file] : []);
  }
  fileLists();

  /* ---------------- 시드 난수 ---------------- */
  function mulberry(a) { return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  var sp = Q.get('seed'), rnd = mulberry(sp && /^\d+$/.test(sp) ? +sp : (Date.now() & 0xffffffff)), FX = Math.random;

  /* ---------------- 레이아웃: 영상 상자 + 두 줄 + 6칸 ---------------- */
  var s = 1, dpr = 1, Wl = 390, Hl = 760, G = null, BUDGET = 40;
  var VB = { x: 0, y: 0, w: 390, h: 693 };   // 영상 층 상자 (논리 px): 영상 비율 그대로 화면을 덮음
  var YB = { up: 20, down: 60 };            // 세로 밀기 여유: 무는 높이가 칸마다 달라 영상을 위로 20px·아래로 60px까지 민다
  var XMAX = 1.42, FW = 105, HOP = 0.12, FL = 0.28, CELL = [], rowY = [590, 550];
  function resize() {
    var r = stage.getBoundingClientRect(); if (r.width < 10 || r.height < 10) return;
    dpr = Math.min(2, window.devicePixelRatio || 1); s = Math.min(r.width / 390, r.height / 700);
    Wl = r.width / s; Hl = r.height / s;
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    // 영상 층: 화면을 덮되 좌우·위아래로 밀 여유가 생기게 조금 크게, 앞줄 무는 높이가 화면 아래 손 닿는 곳에 오게
    var cover = Math.max(Wl / 720, Hl / 1280), ov = Math.max(1.06, (Wl + 2 * 46) / (720 * cover), (Hl + YB.up + YB.down) / (1280 * cover));
    VB.w = 720 * cover * ov; VB.h = 1280 * cover * ov; VB.x = (Wl - VB.w) / 2;
    VB.y = Math.max(Hl + YB.up - VB.h, Math.min(-YB.down, Hl - Math.max(66, Hl * 0.09) - VB.h * SP.rows[0]));
    BUDGET = (VB.w - Wl) / 2 - 2;
    rowY = SP.rows.map(function (fy) { return VB.y + VB.h * fy; });
    FW = Math.min(Wl * 0.27, (Wl / 2 - 46) / XMAX);   // 앞줄 1칸 = 105px (390 기준), 뒷줄은 0.7배
    // 칸 = 목표 자리(가운데 대칭)를 그 칸 클립이 영상을 밀어 닿을 수 있는 범위로 자른 곳
    CELL = CELL_KEYS.slice(0, NCELL).map(function (L) {
      var set = SP.snap[L.key], bx = biteX(set, L.mir), want = Wl / 2 + (L.col - 1) * FW * (L.row ? 0.7 : 1);
      return { row: L.row, col: L.col, key: L.key, mir: L.mir, set: set, x: Math.max(bx - BUDGET, Math.min(bx + BUDGET, want)), y: rowY[L.row] };
    });
    vids.style.left = (VB.x * s) + 'px'; vids.style.top = (VB.y * s) + 'px'; vids.style.width = (VB.w * s) + 'px'; vids.style.height = (VB.h * s) + 'px';
    if (G) G.cookie.x = cookieSX();
  }
  /** 땅 X(칸 단위) → 그 줄의 화면 x: 칸 중심 세 점을 잇는 선 (바깥은 같은 기울기로 연장) */
  function sxRow(row, X) { var c0 = CELL[row * 3].x, c1 = CELL[row * 3 + 1].x, c2 = CELL[row * 3 + 2].x; return X <= 0 ? c1 + (c1 - c0) * X : c1 + (c2 - c1) * X; }
  function gxRow(row, x) { var c0 = CELL[row * 3].x, c1 = CELL[row * 3 + 1].x, c2 = CELL[row * 3 + 2].x; return x <= c1 ? (x - c1) / (c1 - c0) : (x - c1) / (c2 - c1); }
  function slopeRow(row, X) { var c0 = CELL[row * 3].x, c1 = CELL[row * 3 + 1].x, c2 = CELL[row * 3 + 2].x; return X <= 0 ? c1 - c0 : c2 - c1; }
  /** 두 줄 사이(rt = 0 앞 ~ 1 뒤) 어디쯤의 화면 점과 크기 */
  function at(rt, X) {
    if (ROWS < 2) rt = 0;
    var x0 = sxRow(0, X), y0 = rowY[0], sl0 = slopeRow(0, X);
    if (rt <= 0) return { x: x0, y: y0, sl: sl0, k: 1 };
    var x1 = sxRow(1, X), sl1 = slopeRow(1, X);
    return { x: x0 + (x1 - x0) * rt, y: y0 + (rowY[1] - y0) * rt, sl: sl0 + (sl1 - sl0) * rt, k: 1 - 0.3 * rt };
  }
  function nearestCol(X) { return Math.max(0, Math.min(2, Math.round(X) + 1)); }
  function judgeRow() { return ROWS < 2 ? 0 : (G.cookie.rowT >= 0.5 ? 1 : 0); }   // 폴짝이 50%를 넘는 순간 새 줄
  function hopArc() { var C = G.cookie, d = Math.abs(C.row - C.rowT); return d > 0 && d < 1 ? Math.sin(Math.PI * (1 - d)) * 14 : 0; }

    var pt = G.punchT; G.zoom = 1 + (pt < 0.04 ? pt / 0.04 : pt < 0.2 ? 1 - (pt - 0.04) / 0.16 : 0) * G.punchAmp;

    vids.style.transformOrigin = ((G.ox - VB.x) * s).toFixed(1) + 'px ' + ((G.oy - VB.y) * s).toFixed(1) + 'px';
    vids.style.transform = 'translate(' + ((G.shift + shx) * s).toFixed(1) + 'px,' + ((G.shiftY + shy) * s).toFixed(1) + 'px) scale(' + G.zoom.toFixed(3) + ')';
  }
  function gameOver() {

    var isBest = G.score > G.best; if (isBest) { G.best = G.score; saveBest(G.score); }
    document.getElementById('card').innerHTML = '<h2>다 먹혔어요!</h2>' + (G.shot ? '<img class="shot" alt="물린 순간" src="' + G.shot + '">' : '') +
      '<div class="big">' + G.score + '</div><div class="sub">' + SP.name + ' · ' + (isBest ? '최고 기록!' : '최고 ' + G.best) + '<br>피함 ' + G.dodges + ' · 코 톡 ' + G.boops + ' · 폴짝 ' + G.hops + '</div>' +
      '<div class="row"><button class="pill" data-act="title" aria-label="처음으로">처음</button><button class="pill main" data-act="again" aria-label="다시">↻ 다시</button></div>';
    document.getElementById('over').classList.add('show');
  }
  function hideOver() { document.getElementById('over').classList.remove('show'); document.getElementById('card').innerHTML = ''; }
  document.getElementById('over').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; audio(); newGame(b.getAttribute('data-act') !== 'title'); });

  /* ---------------- 그리기 (영상 위 투명 캔버스): 실사 바닥 + 실사 비스킷 ---------------- */
  var IMG = { biscuit: new Image() }, BISC = [];
  IMG.biscuit.src = 'real/biscuit.webp';
  IMG.biscuit.onload = function () {   // 잇자국 1~3개 비스킷을 미리 깎아 둠 (하트 3 = 잇자국 3)
    try {
      var b = IMG.biscuit, W = b.width, H = b.height, marks = [[0.9, 0.22, 0.17], [0.1, 0.78, 0.16], [0.52, 0.02, 0.15]];
      for (var n = 1; n <= 3; n++) {
        var c = document.createElement('canvas'); c.width = W; c.height = H; var x = c.getContext('2d'); x.drawImage(b, 0, 0);
        for (var m = 0; m < n; m++) {
          var mk = marks[m], cx = mk[0] * W, cy = mk[1] * H, r = mk[2] * W;
          x.globalCompositeOperation = 'destination-out';
          [-0.55, 0, 0.55].forEach(function (o) { x.beginPath(); x.arc(cx + o * r * 0.9 * (mk[1] < 0.5 ? 1 : -1) * 0.6, cy + o * r * 0.5, r * 0.62, 0, Math.PI * 2); x.fill(); });   // 이빨 자국 세 개가 겹친 반달
          x.globalCompositeOperation = 'source-atop'; x.strokeStyle = 'rgba(90,50,20,0.55)'; x.lineWidth = W * 0.012;
          [-0.55, 0, 0.55].forEach(function (o) { x.beginPath(); x.arc(cx + o * r * 0.9 * (mk[1] < 0.5 ? 1 : -1) * 0.6, cy + o * r * 0.5, r * 0.62 + W * 0.006, 0, Math.PI * 2); x.stroke(); });
        }
        BISC[n] = c;
      }
    } catch (e) { BISC = []; }
  };
  function drawText(t, x, y, size, color, align) { ctx.font = size + 'px Jua, sans-serif'; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round'; ctx.lineWidth = size * 0.26; ctx.strokeStyle = OL; ctx.strokeText(t, x, y); ctx.fillStyle = color; ctx.fillText(t, x, y); }
  /** 쿠키 밑동 앞풀: 가는 풀잎 몇 가닥을 앞에 그려 바닥에 '놓인' 느낌 (뒷줄은 작게) */
  var TUFT = [[-40, 15, -6], [-27, 21, 3], [-14, 17, -2], [-2, 23, 4], [10, 18, -3], [23, 22, 5], [36, 16, -4], [46, 12, 2]];
  function drawTuft(x, y, k) {
    ctx.lineCap = 'round';
    TUFT.forEach(function (b, i) {
      var bx = x + b[0] * k, by = y + 26 * k, sway = Math.sin(G.t * 2 + i) * 1.5;
      ctx.strokeStyle = SP.tuft[i % 2]; ctx.lineWidth = 3.2 * k;
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.quadraticCurveTo(bx + b[2] * 0.4 * k, by - b[1] * 0.6 * k, bx + (b[2] + sway) * k, by - b[1] * k); ctx.stroke();
    });
  }
  /** 바닥 띠 2줄: 줄마다 옅은 띠와 칸 자리 점 (깊이 보강) */
  function drawGuides() {
    if (ROWS < 2) return;
    for (var r = 0; r < ROWS; r++) {
      var k = r ? 0.7 : 1, y = rowY[r] + 12 * k, x0 = sxRow(r, -XMAX), x1 = sxRow(r, XMAX), h = 15 * k;
      ctx.fillStyle = 'rgba(' + SP.guide + ',0.07)'; ctx.beginPath(); ctx.ellipse((x0 + x1) / 2, y, (x1 - x0) / 2 + h, h, 0, 0, Math.PI * 2); ctx.fill();
      for (var c = 0; c < 3; c++) { ctx.fillStyle = 'rgba(' + SP.guide + ',0.16)'; ctx.beginPath(); ctx.ellipse(CELL[r * 3 + c].x, y, 9 * k, 3 * k, 0, 0, Math.PI * 2); ctx.fill(); }
    }
  }
  /** 앞줄을 무는 머리가 뒷줄 쿠키를 가리는 중인가 (그러면 쿠키를 흰 외곽선 + 55%로) */
  function occluded() {
    var a = G.atk, C = G.cookie; if (!a || !a.st || !a.set || a.lockRow !== 0 || judgeRow() !== 1 || a.fake) return false;
    var k = a.st.k, deep = k === 'stamp' || (k === 'lunge' && a.t / a.dur > 0.5) || (k === 'back' && a.caught);
    return deep && Math.abs(C.X - a.lockX) < 0.9;
  }
  function drawCookie() {
    var C = G.cookie; if (C.hidden) return;
    var k = 1 - 0.3 * C.rowT, x = C.x, y = cookieSY(), run = Math.max(-1, Math.min(1, C.run / 900)), sq = C.squash, b = IMG.biscuit, W = 96 * k, H = 46 * k;
    var pp = C.popT, ps = pp >= 1 ? 1 : pp < 0.6 ? pp / 0.6 * 1.15 : 1.15 - 0.15 * (pp - 0.6) / 0.4;   // 퐁: 0 → 1.15 → 1

    ctx.fillStyle = 'rgba(20,40,10,' + (0.35 * k * k * (1 - arc / 28)).toFixed(3) + ')'; ctx.beginPath(); ctx.ellipse(0, H * 0.42 + arc, W * 0.42, 6 * k, 0, 0, Math.PI * 2); ctx.fill();   // 바닥 그림자 (뒷줄은 작고 옅게, 폴짝 중엔 바닥에 남음)
    var bites = Math.max(0, Math.min(3, 3 - G.hearts)), img = BISC[bites] || b;

    ctx.fillStyle = '#2b1a12';
    [-9, 9].forEach(function (ex) { ctx.beginPath(); if (sc) ctx.ellipse(ex, -2, 3.4, 4.4, 0, 0, Math.PI * 2); else ctx.arc(ex, -2, 2.8, 0, Math.PI * 2); ctx.fill(); });
    ctx.fillStyle = '#ffffff'; [-9, 9].forEach(function (ex) { ctx.beginPath(); ctx.arc(ex - 0.9, -3.2, sc ? 1.3 : 1, 0, Math.PI * 2); ctx.fill(); });

    if (sc) ctx.ellipse(0, 6, 2.8, 3.4, 0, 0, Math.PI * 2); else { ctx.moveTo(-4, 5); ctx.quadraticCurveTo(0, 8.5, 4, 5); }
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,110,110,0.4)'; ctx.beginPath(); ctx.ellipse(-17, 4, 4.5, 2.6, 0, 0, Math.PI * 2); ctx.ellipse(17, 4, 4.5, 2.6, 0, 0, Math.PI * 2); ctx.fill();
    if (sc) { ctx.fillStyle = '#8fd6ff'; ctx.beginPath(); ctx.moveTo(30, -18); ctx.quadraticCurveTo(35, -9, 30, -7); ctx.quadraticCurveTo(25, -9, 30, -18); ctx.fill(); }
    ctx.restore();
    if (!ghost && !arc) drawTuft(x, y, k);
  }
  /** 판정 타원: 잔디 위에 납작한 타원 (줄마다 크기 다름). 빨강 = 잠긴 판정, 흰색 = 아직 노리는 중 */
  function ringAt(rt, X0, X1, rcell, red, al) {
    var A = at(rt, X0), B = at(rt, X1), cx = (A.x + B.x) / 2, rx = Math.max(4, (B.x - A.x) / 2), ry = Math.max(4, rcell * (A.sl + B.sl) / 2 * FL), y = (A.y + B.y) / 2 + 12 * A.k, pulse = 1 + Math.sin(G.t * 20) * 0.04;
    ctx.fillStyle = red ? 'rgba(255,80,80,' + 0.34 * al + ')' : 'rgba(255,255,255,' + 0.22 * al + ')'; ctx.beginPath(); ctx.ellipse(cx, y, rx * pulse, ry * pulse, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = red ? 'rgba(255,70,70,' + 0.95 * al + ')' : 'rgba(255,255,255,' + 0.95 * al + ')'; ctx.lineWidth = 3 * A.k; ctx.setLineDash([8 * A.k, 6 * A.k]); ctx.beginPath(); ctx.ellipse(cx, y, rx, ry, 0, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  }
  function drawAim() {
    var a = G.atk; if (!a || !a.st) return;
    var k = a.st.k; if (!(k === 'tell' || k === 'lunge' || k === 'hold' || k === 'tilt' || k === 'spec')) return;
    var hits = hitsOf(a);
    if (hits.length) { hits.forEach(function (h) { ringAt(h.row, h.a, h.b, a.taps ? a.r : h.row === a.lockRow ? a.r : a.rOther, true, 1); }); return; }
    if (a.taps) return;

    if (a.P.big && ROWS > 1) ringAt(1 - Math.round(a.ringRowT), a.ringGX - RULE.BIG_OTHER, a.ringGX + RULE.BIG_OTHER, RULE.BIG_OTHER, false, Math.min(1, (a.r - RULE.HIT) / (RULE.BIG - RULE.HIT)) * 0.8);   // 십자의 다른 줄 팔
  }
  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); ctx.setTransform(dpr * s, 0, 0, dpr * s, 0, 0);
    // 세계 층(원·쿠키·입자)은 영상과 똑같이 흔들리고 펀치된다
    ctx.save(); ctx.translate(G.camX + G.ox, G.camY + G.oy); ctx.scale(G.zoom, G.zoom); ctx.translate(-G.ox, -G.oy);
    drawGuides(); drawAim(); drawCookie();
    G.fx.forEach(function (p) {
      var al = 1 - p.t / p.life;
      ctx.fillStyle = p.c === 'blade' ? 'rgba(' + SP.blade + ',' + al + ')' : p.c === 'crumb' ? 'rgba(196,132,68,' + al + ')' : p.c === 'dust' ? 'rgba(214,186,140,' + al * 0.55 + ')' : 'rgba(255,255,255,' + al * 0.8 + ')';
      ctx.beginPath(); if (p.c === 'blade') ctx.ellipse(p.x, p.y, p.r * 0.6, p.r * 2.2, p.vx * 0.004, 0, Math.PI * 2); else ctx.arc(p.x, p.y, p.c === 'dust' ? p.r * (1 + p.t / p.life) : p.r, 0, Math.PI * 2); ctx.fill();

    if (a && a.P.reps && a.st && a.st.k !== 'boop') {   // 연타 ●●●

      for (var j = 0; j < a.P.reps; j++) { ctx.beginPath(); ctx.arc(Wl / 2 + (j - (a.P.reps - 1) / 2) * 26, 78, 9, 0, Math.PI * 2); ctx.fillStyle = j < done ? 'rgba(255,255,255,0.5)' : '#ff6b6b'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = OL; ctx.stroke(); }

    G.pops.forEach(function (p) { var q = p.t / p.life, sc = q < 0.15 ? 0.6 + q / 0.15 * 0.6 : 1.2 - Math.min(0.2, q - 0.15); ctx.save(); ctx.globalAlpha = q > 0.75 ? (1 - q) / 0.25 : 1; ctx.translate(p.x, p.y - q * 30); ctx.scale(sc, sc); drawText(p.text, 0, 0, p.size, p.color); ctx.restore(); });

      for (var i = 0; i < 3; i++) { ctx.save(); ctx.translate(26 + i * 34, 34); ctx.fillStyle = i < G.hearts ? '#ff6b8b' : 'rgba(255,255,255,0.4)'; ctx.strokeStyle = OL; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(0, 9); ctx.bezierCurveTo(-16, -2, -9, -15, 0, -6); ctx.bezierCurveTo(9, -15, 16, -2, 0, 9); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }
      drawText(String(G.score), Wl - 18, 36, 34, '#ffffff', 'right');
      if (G.combo >= 2) drawText(G.combo + '연속', Wl - 18, 66, 18, '#ffd23f', 'right');
      if (ROWS > 1 && G.state === 'play' && G.play < 5 && !G.hops) { ctx.save(); ctx.globalAlpha = Math.min(1, (5 - G.play) / 1.5); drawText('위·아래로 쓸면 폴짝!', Wl / 2, Hl * 0.46, 24, '#ffffff'); ctx.restore(); }
    } else {
      drawText('킁킁!', Wl / 2, Hl * 0.08, 60, '#ffffff');
      if (G.best) drawText('최고 ' + G.best, Wl / 2, Hl * 0.08 + 44, 18, '#ffd23f');
      drawText(ready < FIRST_FILES.length ? SP.name + ' 불러오는 중… ' + ready + '/' + FIRST_FILES.length : '쿠키를 끌어서 ' + SP.words.bite + ' 을 피해요', Wl / 2, rowY[ROWS - 1] - 110, 22, '#ffffff');
      if (ROWS > 1 && ready >= FIRST_FILES.length) drawText('위·아래로 쓸면 앞줄·뒷줄 폴짝', Wl / 2, rowY[ROWS - 1] - 80, 17, '#fff4cc');
    }
  }

  /* ---------------- 루프 ---------------- */
  var last = performance.now();
  function frame(now) { requestAnimationFrame(frame); checkReady(); var dt = Math.min(0.05, (now - last) / 1000); last = now; if (G) { update(dt); render(); } }
  window.addEventListener('resize', resize); if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);

  /* ---------------- 읽기 전용 관찰 창 (자동 검증용) ---------------- */
  function toClient(x, y) { var r = cv.getBoundingClientRect(); return { x: Math.round(r.left + x * s), y: Math.round(r.top + y * s) }; }
  window.kung = {
    snapshot: function () {
      var a = G.atk, C = G.cookie, n = nosePose(), cn = toClient(n.x, n.y), hits = hitsOf(a), cs = toClient(C.x, cookieSY());
      return { state: G.state, sp: SPK, rows: ROWS, now: Math.round(performance.now()), t: +G.play.toFixed(2), score: G.score, hearts: G.hearts, combo: G.combo, dodges: G.dodges, boops: G.boops, prints: G.printCount, stomps: G.stomps, hops: G.hops, best: G.best,
        ready: ready, readyAll: readyAll, files: FIRST_FILES.length + MORE_FILES.length, kinds: G.kinds.slice(), hitKinds: G.hitKinds.slice(), lanes: G.lanes.slice(), warnF2: G.warnF2,
        clip: cur.f, mir: cur.mir ? 1 : 0, clipT: +(+(VE[cur.f] && VE[cur.f].currentTime) || 0).toFixed(2), shift: Math.round(G.shift), shiftY: Math.round(G.shiftY), zoom: +G.zoom.toFixed(3),
        src: VE[IDLE] ? VE[IDLE].currentSrc.split('/').pop() : '', fw: Math.round(FW * s),
        cells: CELL.map(function (c) { var p = toClient(c.x, c.y); return { name: CELL_NAME[c.row * 3 + c.col], sx: p.x, sy: p.y, key: c.key, mir: c.mir ? 1 : 0 }; }),
        cookie: { X: +C.X.toFixed(3), tX: +C.tX.toFixed(3), row: C.row, rowT: +C.rowT.toFixed(2), jr: judgeRow(), x: Math.round(C.x), sx: cs.x, sy: cs.y, hidden: C.hidden ? 1 : 0, bites: Math.max(0, 3 - G.hearts), popT: +C.popT.toFixed(2), squash: +C.squash.toFixed(2), ghost: occluded() ? 1 : 0 },
        sfx: { want: SFXN.want, loaded: SFXN.loaded, failed: SFXN.failed }, budget: Math.round(BUDGET), hsN: G.hsN, hsTotal: +G.hsTotal.toFixed(3), freeze: G.freeze > 0 ? 1 : 0,
        bite: a && a.set && !a.fake && !a.taps ? (function () { var b = frameToScreen(a.set.bite.x, a.set.bite.y, a.mir), c = toClient(b.x, b.y); return { sx: c.x, sy: c.y }; })() : null,
        taps: a && a.taps ? a.taps.map(function (tp) { var sp3 = SP.special.taps[a.taps.indexOf(tp)], f = frameToScreen(sp3.x, sp3.y, a.mir), c = toClient(f.x, f.y), g = toClient(sxRow(tp.row, tp.X), rowY[tp.row]); return { row: tp.row, X: +tp.X.toFixed(3), done: tp.done ? 1 : 0, sx: g.x, sy: g.y, fx: c.x, fy: c.y }; }) : null,
        atk: a && a.st ? { kind: a.kind, step: a.st.k, phase: a.fake ? 'fake' : a.st.k, i: a.i, rep: a.rep, t: +a.t.toFixed(3), dur: +a.dur.toFixed(3), fake: a.fake ? 1 : 0, color: a.locked ? 'red' : 'white', first: a.first ? 1 : 0,
          r: +a.r.toFixed(3), rOther: +a.rOther.toFixed(3), lockRow: a.locked ? a.lockRow : null, lockX: a.locked && a.lockX != null ? +a.lockX.toFixed(3) : null, cell: a.cell == null ? null : CELL_NAME[a.cell],

        nose: { sx: cn.x, sy: cn.y, r: Math.round(n.r * s) }, over: document.getElementById('over').classList.contains('show'), shot: !!G.shot,
