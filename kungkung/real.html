<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>킁킁! 실사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<!--
  킁킁! 실사 v2 — 5칸 방향 공격 + 가짜·연타·멈칫·크게·앞발
  가설: "정면만 공격"으로 보인 건 강아지는 늘 정중앙으로 오고 영상만 밀었기 때문이다.
        칸마다 그 방향으로 고개를 틀어 오는 클립을 고르고(왼쪽 칸은 좌우 반전), 가짜·연타·멈칫은
        같은 클립을 거꾸로/멈춤/빠르게 재생해 만들면, 새 클립 몇 개로 그림 버전의 공격 패턴을 실사로 옮길 수 있다.
  - 모든 클립은 같은 기준 사진에서 시작·끝 → 클립을 바꿔도 이음새가 거의 없다.
  - 판정·공정 규칙은 그림 버전(index.html)과 같다: 흰 원은 아직 안 아픔, 빨간 것만 아프다.
  - 테스트 옵션: ?seed=숫자 ?pat=패턴이름
-->
<style>
  :root { --ink:#3b2a22; --pill:rgba(255,255,255,.92); --line:#e7d6c8; --accent:#ff7a59; color-scheme: light; }
  html, body { margin:0; height:100%; overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; touch-action:none; color:var(--ink); background:#5f9fe0; font-family:"Jua","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; }
  #app { position:fixed; inset:0; padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px); }
  #stage { position:relative; width:100%; height:100%; overflow:hidden; background:linear-gradient(#4f8fdc,#8cc2f2); }
  #vids { position:absolute; left:0; top:0; width:100%; height:100%; will-change:transform; }
  #vids video, #vids img { position:absolute; inset:0; width:100%; height:100%; object-fit:fill; opacity:0; transition:opacity .08s linear; pointer-events:none; }
  #vids .on { opacity:1; }
  #vids .mir { transform:scaleX(-1); }
  canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block; }
  #over { position:absolute; inset:0; display:none; place-items:center; background:rgba(40,30,25,.38); z-index:5; padding:16px; box-sizing:border-box; }
  #over.show { display:grid; }
  .card { background:#fffaf3; border-radius:24px; padding:18px 22px; text-align:center; box-shadow:0 12px 40px rgba(59,42,34,.35); animation:pop .3s cubic-bezier(.2,1.5,.5,1); max-width:300px; }
  @keyframes pop { from { transform:scale(.8); opacity:0; } }
  .card h2 { margin:0 0 6px; font-weight:normal; font-size:30px; }
  .big { font-size:40px; margin:2px 0; font-variant-numeric:tabular-nums; }
  .sub { font-size:15px; color:#8a6a5a; margin:4px 0 12px; line-height:1.5; }
  .shot { display:block; width:170px; height:238px; margin:6px auto 10px; border-radius:6px; background:#fff; padding:6px 6px 22px; box-shadow:0 4px 14px rgba(0,0,0,.18); transform:rotate(-2deg); object-fit:cover; }
  .row { display:flex; gap:10px; justify-content:center; }
  .pill { min-width:72px; height:52px; border:0; border-radius:999px; background:var(--pill); box-shadow:0 3px 0 var(--line); font:inherit; font-size:24px; color:var(--ink); padding:0 18px; cursor:pointer; }
  .pill.main { background:var(--accent); color:#fff; box-shadow:0 3px 0 #c9553a; }
  #rot { position:fixed; inset:0; display:none; place-items:center; text-align:center; font-size:22px; background:#fff1cf; z-index:20; }
  @media (orientation: landscape) and (max-height: 520px) { #rot { display:grid; } }
</style>
</head>
<body>
<div id="rot">📱 세로로 돌려 주세요</div>
<div id="app">
  <div id="stage">
    <div id="vids"><img id="v_base" class="on" src="real/base.jpg" alt=""></div>
    <canvas id="cv"></canvas>
    <div id="over"><div class="card" id="card"></div></div>
  </div>
</div>
<script>
(function () {
  'use strict';
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d'), stage = document.getElementById('stage'), vids = document.getElementById('vids');
  var OL = '#3b2a22', BEST_KEY = 'kungkung.real.best';
  var Q = new URLSearchParams(location.search);

  /* ---------------- 클립 (초·영상 프레임 비율): 프레임 시트로 잰 값 ---------------- */
  var DUR = 5.04, START = { x: 0.51, y: 0.40 };   // 모든 클립의 기준 프레임에서 코 자리
  /** 돌진 클립: 준비 → 다가옴 → 꾹 → 물러남, land = 코가 유리에 눌리는 자리, lick = 같은 방향 날름 클립 */
  var PRESS = {
    c:  { file: 'press',    rev: 'press_rev',    lick: 'lick',    lickFrom: 2.0, ready: [0.7, 1.4], appr: [1.4, 2.5], hold: [2.5, 3.3], back: [3.9, DUR], land: { x: 0.50, y: 0.62 } },
    r1: { file: 'press_r1', rev: 'press_r1_rev', lick: 'lick_r1', lickFrom: 2.4, ready: [0.6, 1.2], appr: [1.2, 2.5], hold: [2.5, 3.3], back: [3.9, DUR], land: { x: 0.85, y: 0.72 } },
    r2: { file: 'press_r2', rev: 'press_r2_rev', lick: 'lick_r2', lickFrom: 2.2, ready: [0.3, 0.9], appr: [0.9, 1.7], hold: [1.7, 2.5], back: [3.8, DUR], land: { x: 0.96, y: 0.62 } }
  };
  var PAWS = { file: 'paws', tell: [0.0, 0.5], slam: [0.5, 1.6], taps: [0.67, 1.33], back: [1.6, 3.3], land: { x: 0.33, y: 0.80 } };   // 앞발로 같은 자리를 톡톡
  var SNEEZE = { file: 'sneeze', seg: [1.2, 3.4] };   // 찡긋 → 에취 → 원래 자세
  var TEASE = { file: 'lick', seg: [3.0, 3.8] };     // 혀 내밀고 할짝 (가짜 뒤 메롱)
  var LANES = [0.14, 0.32, 0.5, 0.68, 0.86];          // 5칸 (화면 폭 비율)
  var FIRST_FILES = ['sniff', 'press', 'press_rev', 'lick'];
  var MORE_FILES = ['press_r1', 'press_r1_rev', 'lick_r1', 'press_r2', 'press_r2_rev', 'lick_r2', 'paws', 'sneeze'];

  /* ---------------- 시드 난수 ---------------- */
  function mulberry(a) { return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  var sp = Q.get('seed'), rnd = mulberry(sp && /^\d+$/.test(sp) ? +sp : (Date.now() & 0xffffffff)), FX = Math.random;

  /* ---------------- 레이아웃 ---------------- */
  var s = 1, dpr = 1, Wl = 390, Hl = 760, floorY = 590, G = null;
  var VB = { x: 0, y: 0, w: 390, h: 693 };   // 영상 층 상자 (논리 px): 영상 비율 그대로 화면을 덮음
  function resize() {
    var r = stage.getBoundingClientRect(); if (r.width < 10 || r.height < 10) return;
    dpr = Math.min(2, window.devicePixelRatio || 1); s = Math.min(r.width / 390, r.height / 700);
    Wl = r.width / s; Hl = r.height / s; floorY = Hl * 0.82;
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    var k = Math.max(r.width / 720, r.height / 1280); VB.w = 720 * k / s; VB.h = 1280 * k / s; VB.x = (Wl - VB.w) / 2; VB.y = (Hl - VB.h) / 2;
    vids.style.left = (VB.x * s) + 'px'; vids.style.top = (VB.y * s) + 'px'; vids.style.width = (VB.w * s) + 'px'; vids.style.height = (VB.h * s) + 'px';
    if (G) G.cookie.x = clampX(G.cookie.x);
  }
  function clampX(x) { return Math.max(46, Math.min(Wl - 46, x)); }
  function cookieY() { return floorY + 26; }
  /** 영상 프레임의 점(비율, 반전 적용 전) → 화면 논리 좌표 (확대 기준점·밀기 반영) */
  function frameToScreen(fx, fy, mir) {
    var px = VB.x + VB.w * (mir ? 1 - fx : fx), py = VB.y + VB.h * fy;
    return { x: G.ox + (px - G.ox) * G.zoom + G.shift, y: G.oy + (py - G.oy) * G.zoom + G.shiftY };
  }
  function framePt(fx, fy, mir) { return { x: VB.x + VB.w * (mir ? 1 - fx : fx), y: VB.y + VB.h * fy }; }

  /* ---------------- 영상 관리자 ---------------- */
  var VE = { base: document.getElementById('v_base') }, cur = { f: 'base', mir: false }, seg = null;
  function makeVideo(f) {
    var v = document.createElement('video'); v.muted = true; v.playsInline = true; v.preload = 'auto';
    v.setAttribute('muted', ''); v.setAttribute('playsinline', '');
    v.innerHTML = '<source src="real/' + f + '.webm" type="video/webm"><source src="real/' + f + '.mp4" type="video/mp4">';
    if (f === 'sniff') v.loop = true;
    vids.appendChild(v); VE[f] = v; return v;
  }
  FIRST_FILES.forEach(makeVideo);
  setTimeout(function () { MORE_FILES.forEach(makeVideo); }, 400);   // 나머지는 뒤에서 받음
  function ok(f) { return VE[f] && VE[f].readyState >= 2; }
  function okSet(st) { return ok(st.file) && ok(st.rev) && ok(st.lick); }
  function show(f, mir) {
    var v = VE[f];
    if (cur.f !== f) { VE[cur.f].classList.remove('on'); if (cur.f !== 'base') VE[cur.f].pause(); v.classList.add('on'); }
    v.classList.toggle('mir', !!mir); cur = { f: f, mir: !!mir };
  }
  /** 클립 f의 [from, to] 구간을 dur초에 맞춰 재생, 끝나면 then */
  function playSeg(f, from, to, dur, mir, then) {
    var v = VE[f]; if (!v) return;
    try { v.currentTime = from; } catch (e) { /* 무시 */ }
    v.playbackRate = Math.max(0.25, Math.min(4, (to - from) / Math.max(0.05, dur)));
    var p = v.play(); if (p && p.catch) p.catch(function () { /* 무시 */ });
    show(f, mir); seg = { f: f, to: to, then: then || null };
  }
  function pauseVideo() { seg = null; if (cur.f !== 'base') VE[cur.f].pause(); }
  function idle() { seg = null; var v = VE.sniff; v.playbackRate = 1; try { v.currentTime = 0; } catch (e) { /* 무시 */ } var p = v.play(); if (p && p.catch) p.catch(function () { /* 무시 */ }); show('sniff', false); }
  function tickVideo() { if (!seg) return; var v = VE[seg.f]; if (v.currentTime >= seg.to - 0.03 || v.ended) { var f = seg.then; seg = null; if (f) f(); else v.pause(); } }
  var ready = 0, readyAll = 0;
  function checkReady() { ready = FIRST_FILES.filter(ok).length; readyAll = FIRST_FILES.concat(MORE_FILES).filter(ok).length; }

  /* ---------------- 상태 ---------------- */
  var RULE = { HIT_R: 62, PAW_R: 52, CLOSE: 26, SAFE: 48, BOOP_Q0: 0.45, BOOP_Q0_BIG: 0.35 };
  var PAT = {
    kung:   { boop: 1, steps: [{ k: 'tell', d: 0.6 }, { k: 'lunge' }, { k: 'stamp' }, { k: 'back' }] },
    big:    { label: '크게 킁!', boop: 1, big: 1, steps: [{ k: 'tell', d: 1.1, grow: 96 }, { k: 'lunge', d: 0.62 }, { k: 'stamp' }, { k: 'back' }] },
    hold:   { label: '멈칫…', boop: 1, steps: [{ k: 'tell', d: 0.6 }, { k: 'hold' }, { k: 'lunge', d: 0.3 }, { k: 'stamp' }, { k: 'back' }] },
    feint:  { label: '가짜?', boop: 1, steps: [{ k: 'tell', d: 0.6 }, { k: 'lunge', d: 0.32, zTo: 0.42, fake: 1 }, { k: 'tilt', d: 0.75 }, { k: 'tell', d: 0.45 }, { k: 'lunge' }, { k: 'stamp' }, { k: 'back' }] },
    double: { label: '두 번!', boop: 1, reps: 2, steps: [{ k: 'tell', d: 0.6 }, { k: 'lunge' }, { k: 'stamp', d: 0.22 }, { k: 'back' }] },
    triple: { label: '세 번!', boop: 1, reps: 3, steps: [{ k: 'tell', d: 0.6 }, { k: 'lunge' }, { k: 'stamp', d: 0.22 }, { k: 'back' }] },
    paws:   { label: '콩콩!', paws: 1, steps: [{ k: 'paws', d: 0.8 }, { k: 'slam', d: 1.1 }, { k: 'back', d: 0.9 }] }
  };
  var SCHEDULE = [['kung', 0], ['big', 10], ['feint', 16], ['hold', 22], ['paws', 27], ['double', 32], ['triple', 42]];
  var RETELL = 0.34, COMBO_BACK = 0.24;
  var FORCE_PAT = PAT[Q.get('pat')] ? Q.get('pat') : null, SHIFT_MAX = 72;
  function loadBest() { try { return +(localStorage.getItem(BEST_KEY) || 0); } catch (e) { return 0; } }
  function saveBest(v) { try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) { /* 무시 */ } }
  function newGame(started) {
    G = { state: started ? 'play' : 'title', t: 0, play: 0, score: 0, hearts: 3, combo: 0, best: loadBest(), dodges: 0, boops: 0, prints: [], printCount: 0,
      seen: {}, kinds: [], hitKinds: [], warnF2: 0, lanes: [],
      cookie: { x: Wl / 2, tx: Wl / 2, wet: 0, scared: 0, run: 0, inv: 0, squash: 0 }, atk: null, nextAtk: 2.0, pops: [], fx: [], shake: 0, shot: null, endT: null,
      shift: 0, shiftT: 0, shiftY: 0, zoom: 1, zoomWant: 1, ox: Wl / 2, oy: Hl * 0.4, jit: 0, huh: 0 };
    hideOver(); idle();
  }

  /* ---------------- 소리·진동 ---------------- */
  var AC = null;
  function audio() { try { if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); var b = AC.createBuffer(1, 1, 22050), src = AC.createBufferSource(); src.buffer = b; src.connect(AC.destination); src.start(0); } if (AC.state !== 'running') AC.resume(); } catch (e) { AC = null; } }
  ['pointerup', 'touchend', 'click'].forEach(function (t) { document.addEventListener(t, audio, { passive: true }); });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  function tone(type, f0, f1, dur, vol, delay) { if (!AC) return; try { var t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.02); } catch (e) { /* 무시 */ } }
  function noise(dur, vol, freq, type, delay) { if (!AC) return; try { var n = Math.floor(AC.sampleRate * dur), b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0); for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 1.5); var src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(); src.buffer = b; f.type = type || 'lowpass'; f.frequency.value = freq || 900; g.gain.value = vol; src.connect(f); f.connect(g); g.connect(AC.destination); src.start(AC.currentTime + (delay || 0)); } catch (e) { /* 무시 */ } }
  var SND = {
    sniff: function () { noise(0.09, 0.22, 1800, 'bandpass'); noise(0.09, 0.22, 2100, 'bandpass', 0.14); },
    inhale: function () { noise(0.7, 0.16, 1200, 'bandpass'); tone('sine', 300, 700, 0.8, 0.06); },
    whoosh: function () { noise(0.25, 0.18, 900, 'lowpass'); },
    bonk: function () { tone('sine', 180, 70, 0.22, 0.45); noise(0.08, 0.2, 2600, 'bandpass'); },
    paw: function () { tone('sine', 140, 60, 0.18, 0.4); noise(0.06, 0.15, 500, 'lowpass'); },
    dodge: function (c) { var f = [523, 587, 659, 784, 880, 988][Math.min(5, c)]; tone('triangle', f, 0, 0.14, 0.2); },
    close: function () { tone('sine', 880, 1320, 0.12, 0.18); },
    lick: function () { noise(0.5, 0.3, 600, 'bandpass'); tone('sine', 300, 180, 0.3, 0.2); },
    squish: function () { tone('sine', 240, 120, 0.16, 0.3); noise(0.12, 0.2, 900, 'bandpass'); },
    boop: function () { tone('sine', 700, 1500, 0.08, 0.3); noise(0.3, 0.3, 3000, 'highpass', 0.12); },
    huh: function () { tone('sine', 400, 620, 0.18, 0.12); },
    tease: function () { tone('triangle', 700, 500, 0.1, 0.12); tone('triangle', 820, 600, 0.12, 0.12, 0.12); },
    over: function () { [523, 440, 349].forEach(function (f, i) { tone('triangle', f, 0, 0.25, 0.16, i * 0.15); }); }
  };
  function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) { /* 무시 */ } }

  /* ---------------- 입력 ---------------- */
  function toL(e) { var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / s, y: (e.clientY - r.top) / s }; }
  var drags = {};
  cv.addEventListener('pointerdown', function (e) {
    audio(); var p = toL(e);
    if (G.state === 'title') { if (ready < FIRST_FILES.length) return; newGame(true); G.cookie.tx = clampX(p.x); drags[e.pointerId] = true; try { cv.setPointerCapture(e.pointerId); } catch (er) { /* 무시 */ } return; }
    if (G.state !== 'play') return;
    try { cv.setPointerCapture(e.pointerId); } catch (er) { /* 무시 */ }
    if (tryBoop(p)) return;
    if (p.y >= floorY - 70) { drags[e.pointerId] = true; G.cookie.tx = clampX(p.x); }
  });
  cv.addEventListener('pointermove', function (e) { if (!drags[e.pointerId] || !G || G.state !== 'play') return; G.cookie.tx = clampX(toL(e).x); });
  function endP(e) { delete drags[e.pointerId]; }
  cv.addEventListener('pointerup', endP); cv.addEventListener('pointercancel', endP);

  /* ---------------- 칸 → 클립 ---------------- */
  function laneOf(x) { var best = 0; LANES.forEach(function (f, i) { if (Math.abs(f * Wl - x) < Math.abs(LANES[best] * Wl - x)) best = i; }); return best; }
  /** 칸에 맞는 돌진 클립 (왼쪽 칸은 반전). 바깥 칸은 r1·r2 중 시드로, 안 받아졌으면 가운데 클립을 밀어 씀 */
  function laneSet(l, roll) {
    if (l === 2) return { key: 'c', set: PRESS.c, mir: false };
    var near = l === 1 || l === 3, key;
    if (near) key = 'c';   // 안쪽 칸: 가운데 클립을 옆으로 밀어 씀 (바깥 클립을 많이 밀면 과하게 확대돼 어색)
    else key = roll < 0.5 && okSet(PRESS.r2) ? 'r2' : okSet(PRESS.r1) ? 'r1' : okSet(PRESS.r2) ? 'r2' : 'c';
    return { key: key, set: PRESS[key], mir: key !== 'c' && l < 2 };
  }
  /** 돌진 클립을 정하고, 코가 눌리는 자리가 목표 x에 오도록 밀 양을 계산 (확대 반영, 최대 ±SHIFT_MAX) */
  function aimLane(a, x) {
    var L = laneSet(laneOf(x), a.laneRoll); a.lane = laneOf(x); a.key = L.key; a.set = L.set; a.mir = L.mir;
    var p = framePt(a.set.land.x, a.set.land.y, a.mir);
    setOriginY(p.y); a.shiftT = solveShift(p.x, x, 1 + (a.P.big ? 0.22 : 0.08)); G.lanes.push(a.lane + ':' + a.key + (a.mir ? 'm' : ''));
  }
  function setOriginY(y) { G.shiftY += (G.oy - y) * (1 - G.zoom); G.oy = y; }   // 세로 기준점을 옮겨도 튀지 않게 (shiftY는 천천히 0으로)
  function coverZ(sh) {   // 이만큼 밀었을 때 영상 가장자리가 안 보이려면 필요한 확대 (가로 기준점 = 화면 가운데)
    return Math.max(1, (G.ox + sh + 4) / Math.max(1, G.ox - VB.x), (Wl - G.ox - sh + 4) / Math.max(1, VB.x + VB.w - G.ox));
  }
  function solveShift(px, X, want) {
    var sh = X - px;
    for (var i = 0; i < 4; i++) { var Z = Math.max(want, coverZ(sh)); sh = Math.max(-SHIFT_MAX, Math.min(SHIFT_MAX, X - G.ox - (px - G.ox) * Z)); }
    return sh;
  }

  /* ---------------- 공격 (그림 버전 index.html의 실행기를 영상에 연결) ---------------- */
  function interval() { return Math.max(0.8, 1.7 - G.play * 0.022); }

      var b = IMG.biscuit, c = document.createElement('canvas'); c.width = b.width; c.height = b.height; var x = c.getContext('2d');
      x.drawImage(b, 0, 0); x.globalCompositeOperation = 'source-atop'; x.fillStyle = 'rgba(70,40,20,0.38)'; x.fillRect(0, 0, c.width, c.height);
      x.fillStyle = 'rgba(255,255,255,0.35)'; x.beginPath(); x.ellipse(c.width * 0.4, c.height * 0.3, c.width * 0.22, c.height * 0.08, -0.1, 0, Math.PI * 2); x.fill();
      wetBiscuit = c;
    } catch (e) { wetBiscuit = null; }
  };
  function drawText(t, x, y, size, color, align) { ctx.font = size + 'px Jua, sans-serif'; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round'; ctx.lineWidth = size * 0.26; ctx.strokeStyle = OL; ctx.strokeText(t, x, y); ctx.fillStyle = color; ctx.fillText(t, x, y); }
  function drawGrass() {
    var g = IMG.grass, top = floorY - 34, h = Hl - top + 4;
    if (g.complete && g.naturalWidth) { var w = Math.max(Wl, h * g.naturalWidth / g.naturalHeight); ctx.drawImage(g, (Wl - w) / 2, top, w, h); }
    else { ctx.fillStyle = '#4f9a3a'; ctx.fillRect(0, floorY, Wl, Hl - floorY); }
  }
  function drawCookie() {
    var C = G.cookie, x = C.x, y = cookieY(), run = Math.max(-1, Math.min(1, C.run / 900)), sq = C.squash, b = IMG.biscuit, W = 96, H = 46;
    ctx.save(); ctx.translate(x, y + sq * 6); ctx.rotate(run * 0.2); ctx.scale(1 + 0.35 * sq, 1 - 0.4 * sq);
    if (C.inv > 0 && Math.floor(G.t * 16) % 2) ctx.globalAlpha = 0.55;
    ctx.fillStyle = 'rgba(20,40,10,0.35)'; ctx.beginPath(); ctx.ellipse(0, H * 0.42, W * 0.42, 6, 0, 0, Math.PI * 2); ctx.fill();   // 잔디 위 그림자
    if (b.complete && b.naturalWidth) { H = W * b.naturalHeight / b.naturalWidth; ctx.drawImage(C.wet > 0 && wetBiscuit ? wetBiscuit : b, -W / 2, -H / 2, W, H); }
    // 작은 점 눈·입 (질겁·젖음 표정)
    var sc = C.scared;
    ctx.fillStyle = '#2b1a12';
    [-9, 9].forEach(function (ex) { ctx.beginPath(); if (sc) ctx.ellipse(ex, -2, 3.4, 4.4, 0, 0, Math.PI * 2); else ctx.arc(ex, -2, 2.8, 0, Math.PI * 2); ctx.fill(); });
    ctx.fillStyle = '#ffffff'; [-9, 9].forEach(function (ex) { ctx.beginPath(); ctx.arc(ex - 0.9, -3.2, sc ? 1.3 : 1, 0, Math.PI * 2); ctx.fill(); });
    ctx.strokeStyle = '#2b1a12'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.beginPath();
    if (sc) ctx.ellipse(0, 6, 2.8, 3.4, 0, 0, Math.PI * 2); else { ctx.moveTo(-4, 5); ctx.quadraticCurveTo(0, 8.5, 4, 5); }
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,110,110,0.4)'; ctx.beginPath(); ctx.ellipse(-17, 4, 4.5, 2.6, 0, 0, Math.PI * 2); ctx.ellipse(17, 4, 4.5, 2.6, 0, 0, Math.PI * 2); ctx.fill();
    if (C.wet > 0) { ctx.fillStyle = 'rgba(150,205,255,0.9)'; [[-26, -20], [22, -18], [2, -24]].forEach(function (p, i) { var yy = p[1] + ((G.t * 30 + i * 7) % 16); ctx.beginPath(); ctx.moveTo(p[0], yy - 5); ctx.quadraticCurveTo(p[0] + 4, yy + 2, p[0], yy + 4); ctx.quadraticCurveTo(p[0] - 4, yy + 2, p[0], yy - 5); ctx.fill(); }); }
    if (sc && !C.wet) { ctx.fillStyle = '#8fd6ff'; ctx.beginPath(); ctx.moveTo(30, -18); ctx.quadraticCurveTo(35, -9, 30, -7); ctx.quadraticCurveTo(25, -9, 30, -18); ctx.fill(); }
    ctx.restore();
  }
  function drawAim() {
    var a = G.atk; if (!a || !a.st) return;
    var k = a.st.k, y = cookieY() + 8, pulse = 1 + Math.sin(G.t * 20) * 0.04;
    function ring(x, r, red, al) {
      ctx.fillStyle = red ? 'rgba(255,80,80,' + 0.34 * al + ')' : 'rgba(255,255,255,' + 0.22 * al + ')'; ctx.beginPath(); ctx.ellipse(x, y, r * pulse, 16 * pulse, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = red ? 'rgba(255,70,70,0.95)' : 'rgba(255,255,255,0.95)'; ctx.lineWidth = 3; ctx.setLineDash([8, 6]); ctx.beginPath(); ctx.ellipse(x, y, r, 16, 0, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    }
    if (k === 'tell' || k === 'lunge' || k === 'hold' || k === 'tilt') ring(a.locked ? a.lockX : a.tx, a.r, a.locked, 1);
    else if ((k === 'paws' || k === 'slam') && a.slams) { var left = a.slams.filter(function (sl) { return !sl.done; }); if (left.length) ring(left[0].x, a.r, true, k === 'paws' ? 0.4 + 0.6 * Math.min(1, a.t / a.dur) : 1); }
  }
  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); ctx.setTransform(dpr * s, 0, 0, dpr * s, 0, 0);
    drawGrass(); drawAim(); drawCookie();
    G.fx.forEach(function (p) { ctx.fillStyle = 'rgba(255,255,255,' + (1 - p.t / p.life) * 0.8 + ')'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); });
    G.prints.forEach(function (p) {   // 유리에 남은 코 김서림
      var al = Math.max(0, 1 - p.t / p.life) * Math.min(1, p.t / 0.6) * 0.5; if (al <= 0) return;
      var g = ctx.createRadialGradient(p.x, p.y, p.r * 0.2, p.x, p.y, p.r); g.addColorStop(0, 'rgba(255,255,255,' + al * 0.7 + ')'); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r * 1.1, p.r * 0.85, 0, 0, Math.PI * 2); ctx.fill();
    });
    var a = G.atk;
    if (a && a.P.reps && a.st && a.st.k !== 'boop') {   // 연타 ●●●
      var done = a.rep - 1 + ((a.st.k === 'stamp' || a.st.k === 'back') ? 1 : 0);
      for (var j = 0; j < a.P.reps; j++) { ctx.beginPath(); ctx.arc(Wl / 2 + (j - (a.P.reps - 1) / 2) * 26, 78, 9, 0, Math.PI * 2); ctx.fillStyle = j < done ? 'rgba(255,255,255,0.5)' : '#ff6b6b'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = OL; ctx.stroke(); }
    }
    if (G.huh > 0) { ctx.save(); ctx.globalAlpha = Math.min(1, G.huh * 2); drawText('??', Wl * 0.78, Hl * 0.16, 36, '#ffffff'); ctx.restore(); }
    G.pops.forEach(function (p) { var q = p.t / p.life, sc = q < 0.15 ? 0.6 + q / 0.15 * 0.6 : 1.2 - Math.min(0.2, q - 0.15); ctx.save(); ctx.globalAlpha = q > 0.75 ? (1 - q) / 0.25 : 1; ctx.translate(p.x, p.y - q * 30); ctx.scale(sc, sc); drawText(p.text, 0, 0, p.size, p.color); ctx.restore(); });
    if (G.state !== 'title') {
      for (var i = 0; i < 3; i++) { ctx.save(); ctx.translate(26 + i * 34, 34); ctx.fillStyle = i < G.hearts ? '#ff6b8b' : 'rgba(255,255,255,0.4)'; ctx.strokeStyle = OL; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(0, 9); ctx.bezierCurveTo(-16, -2, -9, -15, 0, -6); ctx.bezierCurveTo(9, -15, 16, -2, 0, 9); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }
      drawText(String(G.score), Wl - 18, 36, 34, '#ffffff', 'right');
      if (G.combo >= 2) drawText(G.combo + '연속', Wl - 18, 66, 18, '#ffd23f', 'right');
    } else {
      drawText('킁킁!', Wl / 2, Hl * 0.08, 60, '#ffffff');
      if (G.best) drawText('최고 ' + G.best, Wl / 2, Hl * 0.08 + 44, 18, '#ffd23f');
      drawText(ready < FIRST_FILES.length ? '강아지 불러오는 중…' : '쿠키를 끌어서 코를 피해요', Wl / 2, floorY - 60, 22, '#ffffff');
    }
  }

  /* ---------------- 루프 ---------------- */
  var last = performance.now();
  function frame(now) { requestAnimationFrame(frame); checkReady(); var dt = Math.min(0.05, (now - last) / 1000); last = now; if (G) { update(dt); render(); } }
  window.addEventListener('resize', resize); if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);

  /* ---------------- 읽기 전용 관찰 창 (자동 검증용) ---------------- */
  function toClient(x, y) { var r = cv.getBoundingClientRect(); return { x: Math.round(r.left + x * s), y: Math.round(r.top + y * s) }; }
  window.kung = {
    snapshot: function () {
      var a = G.atk, n = nosePose(), cn = toClient(n.x, n.y), aim = a && a.st ? (a.locked && a.lockX != null ? a.lockX : a.tx) : null, hits = hitsOf(a);
      return { state: G.state, t: +G.play.toFixed(2), score: G.score, hearts: G.hearts, combo: G.combo, dodges: G.dodges, boops: G.boops, prints: G.printCount, best: G.best,
        ready: ready, readyAll: readyAll, files: FIRST_FILES.length + MORE_FILES.length, kinds: G.kinds.slice(), hitKinds: G.hitKinds.slice(), lanes: G.lanes.slice(), warnF2: G.warnF2,
        clip: cur.f, mir: cur.mir ? 1 : 0, clipT: +(+(VE[cur.f].currentTime) || 0).toFixed(2), shift: Math.round(G.shift), zoom: +G.zoom.toFixed(3),
        src: VE.sniff ? VE.sniff.currentSrc.split('/').pop() : '',
        cookie: { x: Math.round(G.cookie.x), sx: toClient(G.cookie.x, 0).x },
        atk: a && a.st ? { kind: a.kind, step: a.st.k, phase: a.fake ? 'fake' : a.st.k, i: a.i, rep: a.rep, t: +a.t.toFixed(3), fake: a.fake ? 1 : 0, color: a.locked ? 'red' : 'white', first: a.first ? 1 : 0,
          r: Math.round(a.r), tx: aim == null ? null : Math.round(aim), stx: aim == null ? null : toClient(aim, 0).x, lane: a.lane == null ? null : a.lane, key: a.key || null, mir: a.mir ? 1 : 0,
          hits: hits.map(function (v) { return [Math.round(v[0]), Math.round(v[1])]; }), shits: hits.map(function (v) { return [toClient(v[0], 0).x, toClient(v[1], 0).x]; }) } : null,
        nose: { sx: cn.x, sy: cn.y, r: Math.round(n.r * s) }, over: document.getElementById('over').classList.contains('show'), shot: !!G.shot };
    }
  };

  resize(); newGame(false); requestAnimationFrame(frame);
})();
</script>
