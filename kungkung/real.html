<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>킁킁! 실사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<!--
  킁킁! 실사 v3 시험 — 잔디 구도에서 칸마다 "앙"
  가설: 타격감이 없던 건 카메라가 하늘을 올려다봐 "아래로 = 렌즈 쪽"이라 코가 화면 전체를 덮었기 때문이다.
        잔디가 보이는 낮은 구도에서 강아지가 칸마다 고개를 숙여 잔디 위 한 점(쿠키 자리)을 입으로 "앙" 물면,
        일러스트판처럼 딱 그 자리만 찍는 손맛과 "정확히 물려는" 긴장감이 산다.
  - 시험 단계: 앙 클립 2개(가운데·오른쪽, 왼쪽은 반전)로 3칸. 판정·공정 규칙은 그림 버전(index.html)과 같다.
  - 영상 전환: 숨긴 채 미리 되감아 두고(prime) 새 프레임이 준비된 뒤 위층만 0→1 (끊김 없음).
  - 무는 순간: 히트스톱·줌 펀치·흔들림(영상과 그림 함께)·"앙!" — 물리면 쿠키가 입 속으로 사라졌다가 잇자국을 달고 퐁.
  - 테스트 옵션: ?seed=숫자 ?pat=패턴이름 ?hs=히트스톱ms ?nocv=1(그림 숨김, 픽셀 검사용)
-->
<style>
  :root { --ink:#3b2a22; --pill:rgba(255,255,255,.92); --line:#e7d6c8; --accent:#ff7a59; color-scheme: light; }
  html, body { margin:0; height:100%; overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; touch-action:none; color:var(--ink); background:#5f9fe0; font-family:"Jua","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; }
  #app { position:fixed; inset:0; padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px); }
  #stage { position:relative; width:100%; height:100%; overflow:hidden; background:linear-gradient(#4f8fdc,#8cc2f2); }
  #vids { position:absolute; left:0; top:0; width:100%; height:100%; will-change:transform; }
  /* 영상 층: 대기(arm)는 거의 투명하게 깔아 두고(완전 0이면 브라우저가 프레임을 안 그림), 들어오는 층(in)만 위에서 0→1 (JS) */
  #vids video, #vids img { position:absolute; inset:0; width:100%; height:100%; object-fit:fill; opacity:0; z-index:1; pointer-events:none; }
  #vids .arm { opacity:.001; }
  #vids .live { opacity:1; z-index:2; }
  #vids .in { z-index:3; }
  #vids .mir { transform:scaleX(-1); }
  canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block; }
  #over { position:absolute; inset:0; display:none; place-items:center; background:rgba(40,30,25,.38); z-index:5; padding:16px; box-sizing:border-box; }
  #over.show { display:grid; }
  .card { background:#fffaf3; border-radius:24px; padding:18px 22px; text-align:center; box-shadow:0 12px 40px rgba(59,42,34,.35); animation:pop .3s cubic-bezier(.2,1.5,.5,1); max-width:300px; }
  @keyframes pop { from { transform:scale(.8); opacity:0; } }
  .card h2 { margin:0 0 6px; font-weight:normal; font-size:30px; }
  .big { font-size:40px; margin:2px 0; font-variant-numeric:tabular-nums; }
  .sub { font-size:15px; color:#8a6a5a; margin:4px 0 12px; line-height:1.5; }
  .shot { display:block; width:170px; height:238px; margin:6px auto 10px; border-radius:6px; background:#fff; padding:6px 6px 22px; box-shadow:0 4px 14px rgba(0,0,0,.18); transform:rotate(-2deg); object-fit:cover; }
  .row { display:flex; gap:10px; justify-content:center; }
  .pill { min-width:72px; height:52px; border:0; border-radius:999px; background:var(--pill); box-shadow:0 3px 0 var(--line); font:inherit; font-size:24px; color:var(--ink); padding:0 18px; cursor:pointer; }
  .pill.main { background:var(--accent); color:#fff; box-shadow:0 3px 0 #c9553a; }
  #rot { position:fixed; inset:0; display:none; place-items:center; text-align:center; font-size:22px; background:#fff1cf; z-index:20; }
  @media (orientation: landscape) and (max-height: 520px) { #rot { display:grid; } }
</style>
</head>
<body>
<div id="rot">📱 세로로 돌려 주세요</div>
<div id="app">
  <div id="stage">
    <div id="vids"><img id="v_base" class="live" src="real/v3/base.jpg" alt=""></div>
    <canvas id="cv"></canvas>
    <div id="over"><div class="card" id="card"></div></div>
  </div>
</div>
<script>
(function () {
  'use strict';
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d'), stage = document.getElementById('stage'), vids = document.getElementById('vids');
  var OL = '#3b2a22', BEST_KEY = 'kungkung.real.best';
  var Q = new URLSearchParams(location.search);

  /* ---------------- 클립 (초·영상 프레임 비율): 프레임 시트로 잰 값 ---------------- */
  var DUR = 5.04;
  /** 앙 클립: appr = 고개를 숙이며 입을 벌림 → 끝 프레임이 무는 순간. bite = 입이 잔디에 닿는 점, up = 원래 자세로 돌아온 시각.
      nose = 다가옴 진행률별 코 자리 [진행률, x, y] (코 톡 판정용) */
  var SNAP = {
    c:  { file: 'v3/snap_c',  rev: 'v3/snap_c_rev',  appr: [1.50, 1.72], up: 4.2, bite: { x: 0.50, y: 0.89 },
          nose: [[0, 0.50, 0.42], [0.6, 0.50, 0.50], [0.8, 0.50, 0.64], [1, 0.50, 0.82]] },
    r2: { file: 'v3/snap_r2', rev: 'v3/snap_r2_rev', appr: [0.95, 1.22], up: 4.2, bite: { x: 0.60, y: 0.89 },
          nose: [[0, 0.50, 0.42], [0.37, 0.52, 0.40], [0.52, 0.62, 0.53], [0.68, 0.72, 0.62], [0.84, 0.80, 0.78], [1, 0.75, 0.86]] }
  };
  /** 멈칫 전용: 망설이는 클립(hover: 고개 숙여 입 벌린 채 킁킁)에 그 끝의 진짜 앙(hsnap: 살짝 들어 입 크게 → 내리꽂기)을 이어 씀 */
  var HOVER = { file: 'v3/hover', down: [0.3, 1.0] };
  SNAP.h = { file: 'v3/hsnap', rev: null, appr: [0.08, 0.23], up: 1.25, bite: { x: 0.50, y: 0.90 },
             nose: [[0, 0.50, 0.86], [0.3, 0.50, 0.72], [0.6, 0.50, 0.62], [0.85, 0.50, 0.80], [1, 0.50, 0.90]] };
  /** 가짜 전용: 고개를 숙이다 스스로 멈칫 → 킁킁 → 갸웃 → 다시 듦 (거꾸로 재생 없이 한 흐름) */
  var FEINT = { file: 'v3/feint', down: [0.35, 1.6], tilt: [1.6, 4.6] };
  var NOSE0 = { x: 0.50, y: 0.42 };                       // 기준 자세의 코
  var IDLE = 'v3/idle';                                   // 기준 자세로 가만히 숨쉬기 (앞뒤로 이어 붙인 고리)
  var LANE_KEYS = [{ key: 'r2', mir: true }, { key: 'c', mir: false }, { key: 'r2', mir: false }];   // 시험 3칸 (왼쪽은 반전)
  var GROUND_FY = 0.89;                                   // 입이 잔디에 닿는 높이 (프레임 비율)
  var FIRST_FILES = [IDLE, 'v3/snap_c', 'v3/snap_c_rev', 'v3/snap_r2', 'v3/snap_r2_rev'];
  var MORE_FILES = [FEINT.file, HOVER.file, 'v3/hsnap'];

  /* ---------------- 시드 난수 ---------------- */
  function mulberry(a) { return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  var sp = Q.get('seed'), rnd = mulberry(sp && /^\d+$/.test(sp) ? +sp : (Date.now() & 0xffffffff)), FX = Math.random;

  /* ---------------- 레이아웃 ---------------- */
  var s = 1, dpr = 1, Wl = 390, Hl = 760, floorY = 590, G = null, BUDGET = 40, laneX = [100, 195, 290];
  var VB = { x: 0, y: 0, w: 390, h: 693 };   // 영상 층 상자 (논리 px): 영상 비율 그대로 화면을 덮음
  function resize() {
    var r = stage.getBoundingClientRect(); if (r.width < 10 || r.height < 10) return;
    dpr = Math.min(2, window.devicePixelRatio || 1); s = Math.min(r.width / 390, r.height / 700);
    Wl = r.width / s; Hl = r.height / s;
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    // 영상 층: 화면을 덮되 좌우로 밀 여유가 생기게 조금 크게, 입이 닿는 높이가 화면 아래 손 닿는 곳에 오게
    var cover = Math.max(Wl / 720, Hl / 1280), ov = Math.max(1.06, (Wl + 2 * 46) / (720 * cover));
    VB.w = 720 * cover * ov; VB.h = 1280 * cover * ov; VB.x = (Wl - VB.w) / 2;
    VB.y = Math.max(Hl - VB.h, Math.min(0, Hl - Math.max(66, Hl * 0.09) - VB.h * GROUND_FY));
    floorY = VB.y + VB.h * GROUND_FY - 26;   // cookieY() = 입이 닿는 높이
    BUDGET = (VB.w - Wl) / 2 - 2;
    var out = Math.min(Wl * 0.78, biteX(SNAP.r2, false) + BUDGET);
    laneX = [Wl - out, biteX(SNAP.c, false), out];   // 칸 = 강아지가 무는 자리 (바깥 칸은 영상을 밀어 맞춤)
    vids.style.left = (VB.x * s) + 'px'; vids.style.top = (VB.y * s) + 'px'; vids.style.width = (VB.w * s) + 'px'; vids.style.height = (VB.h * s) + 'px';
    if (G) G.cookie.x = clampX(G.cookie.x);
  }
  function clampX(x) { return Math.max(46, Math.min(Wl - 46, x)); }
  function cookieY() { return floorY + 26; }
  /** 영상 프레임의 점(비율, 반전 적용 전) → 화면 논리 좌표 (확대 기준점·밀기 반영) */
  function frameToScreen(fx, fy, mir) {
    var px = VB.x + VB.w * (mir ? 1 - fx : fx), py = VB.y + VB.h * fy;
    return { x: G.ox + (px - G.ox) * G.zoom + G.shift, y: G.oy + (py - G.oy) * G.zoom + G.shiftY };
  }
  function framePt(fx, fy, mir) { return { x: VB.x + VB.w * (mir ? 1 - fx : fx), y: VB.y + VB.h * fy }; }

  /* ---------------- 영상 관리자: 끊김 없는 전환 ----------------
     가설: 끊김은 (1) 되감은 직후 바로 보여줘 옛 프레임이 비치고 (2) 두 층이 함께 페이드돼 배경이 비치고
           (3) 예고(킁킁)마다 클립을 바꿔서 생긴다.
     → 숨긴 채 다음 시작점으로 미리 되감아 두고(prime), 새 프레임이 준비된 뒤 위층만 0→1로 올린다(cut).
       판정은 게임 시계가 정하고, 영상은 그 시각을 따라가기만 한다(follow: 늦으면 살짝 빨리, 많이 늦으면 다시 맞춤). */
  var VE = { base: document.getElementById('v_base') }, cur = { f: 'base', mir: false }, seg = null;
  var FADE = 0.12, LATE_MAX = 0.25, fading = null, VLOG = [], VSTAT = { cuts: 0, late: 0, seekLive: 0, resync: 0, tellCuts: 0, minCover: 1 };
  function playV(v) { var p = v.play(); if (p && p.catch) p.catch(function () { /* 무시 */ }); }
  function makeVideo(f) {
    var v = document.createElement('video'); v.muted = true; v.playsInline = true; v.preload = 'auto'; v.className = 'arm';
    v.setAttribute('muted', ''); v.setAttribute('playsinline', '');
    v.innerHTML = '<source src="real/' + f + '.webm" type="video/webm"><source src="real/' + f + '.mp4" type="video/mp4">';
    if (f === IDLE) v.loop = true;
    v._f = f; v._want = null; v._armed = false; v._tok = 0; v._mir = false;
    v.addEventListener('loadeddata', function () { if (v._want == null) prime(f, nextStart(f), false); else if (!v._armed) prime(f, v._want, v._mir, true); });
    vids.appendChild(v); VE[f] = v; return v;
  }
  FIRST_FILES.forEach(makeVideo);
  setTimeout(function () { MORE_FILES.forEach(makeVideo); }, 400);   // 나머지는 뒤에서 받음
  function ok(f) { return VE[f] && VE[f].readyState >= 2; }
  function okSet(st) { return ok(st.file) && ok(st.rev); }
  /** 숨긴 클립이 다음에 쓰일 시작점 (쓰고 나면 여기로 미리 되감아 둔다) */
  function nextStart(f) {
    if (f === IDLE) return 0;
    if (f === FEINT.file) return FEINT.down[0];
    if (f === HOVER.file) return HOVER.down[0];
    for (var k in SNAP) { var p = SNAP[k]; if (p.file === f) return p.appr[0]; if (p.rev === f) return DUR - (p.appr[1] + 0.3); }
    return 0;
  }
  /** 숨긴 채 t초로 되감아, 그 프레임이 실제로 준비되면 armed (보이는 층·페이드 중인 층은 건드리지 않음) */
  function prime(f, t, mir, force) {
    var v = VE[f]; if (!v || f === 'base' || f === cur.f || (fading && (fading.v === v || fading.old === v))) return;
    mir = !!mir; if (v._mir !== mir) { v._mir = mir; v.classList.toggle('mir', mir); }
    if (!force && v._want != null && Math.abs(v._want - t) < 0.01 && (v._armed || v.seeking)) return;
    v._want = t; v._armed = false; var tok = ++v._tok;
    if (v.readyState < 1) return;   // loadeddata에서 다시
    try { if (!v.paused) v.pause(); } catch (e) { /* 무시 */ }
    function fin(mt) {
      if (tok !== v._tok) return;
      if (v.readyState >= 2) { v._armed = true; v._mt = mt; }
      else setTimeout(function () { if (tok === v._tok) prime(f, t, v._mir, true); }, 120);
    }
    function waitFrame() {   // 되감은 프레임이 실제로 그려질 때까지 (없으면 rAF 두 번)
      if (v.requestVideoFrameCallback) {
        var done = false, to = setTimeout(function () { if (!done) { done = true; fin(v.currentTime); } }, 160);
        v.requestVideoFrameCallback(function (n, md) { if (done) return; done = true; clearTimeout(to); fin(md && md.mediaTime != null ? md.mediaTime : v.currentTime); });
      } else requestAnimationFrame(function () { requestAnimationFrame(function () { fin(v.currentTime); }); });
    }
    if (Math.abs(v.currentTime - t) < 0.002 && !v.seeking && v.readyState >= 2) { fin(v.currentTime); return; }
    function onSeeked() { v.removeEventListener('seeked', onSeeked); if (tok === v._tok) waitFrame(); }
    v.addEventListener('seeked', onSeeked);
    try { v.currentTime = t; } catch (e) { v.removeEventListener('seeked', onSeeked); }
  }
  /** 클립 f의 [from, to] 구간을 게임 시간 dur초에 맞춰 재생, 끝나면 then. loop면 그냥 반복 */
  function playSeg(f, from, to, dur, mir, then, loop) {
    var v = VE[f]; if (!v) return;
    if (fading) endFade();
    mir = !!mir;
    if (G && G.atk && G.atk.st && G.atk.st.k === 'tell') VSTAT.tellCuts++;   // 예고(킁킁) 중 전환 — 0이어야 함
    var rate = loop ? 1 : Math.max(0.25, Math.min(4, (to - from) / Math.max(0.05, dur)));
    seg = { f: f, from: from, to: to, dur: dur, rate: rate, mir: mir, then: then || null, loop: !!loop, el: 0, waited: 0, shown: false, fired: false };
    if (f === cur.f) {   // 같은 층: 되감지 않고 이어서 (거리가 멀 때만 그 자리에서 되감음)
      if (cur.mir !== mir) { v.classList.toggle('mir', mir); v._mir = mir; cur.mir = mir; }
      var ct0 = v.currentTime;
      if (!loop && Math.abs(ct0 - from) < 0.3 && ct0 < to - 0.02) { seg.from = from = ct0; seg.rate = rate = Math.max(0.25, Math.min(4, (to - ct0) / Math.max(0.05, dur))); }   // 조금 덜 왔거나 앞섰으면 그 자리에서 이어 감
      var far = !loop && Math.abs(ct0 - from) > 0.06;
      if (far) { try { v.currentTime = from; } catch (e) { /* 무시 */ } VSTAT.seekLive++; }
      v._armed = false; v._want = null;   // 재생을 시작하면 '준비됨' 표시는 무효
      v.playbackRate = rate; playV(v); seg.shown = true; vlog(far ? 'seek' : 'same', v, 0, ct0); return;
    }
    prime(f, from, mir);
    tryReveal();
  }
  function tryReveal() {
    var v = VE[seg.f], armed = v._armed && Math.abs(v._want - seg.from) < 0.01 && v._mir === seg.mir;
    if (armed || (seg.waited >= LATE_MAX && v.readyState >= 2 && cur.f !== 'base')) reveal(!armed);
  }
  function reveal(late) {
    var v = VE[seg.f], old = VE[cur.f], mt = v.currentTime;
    v._armed = false; v._want = null;   // 재생을 시작하면 '준비됨' 표시는 무효 (다음 사용 전 다시 prime)
    v.playbackRate = seg.rate; if (!seg.pauseOnShow) playV(v);
    v.classList.remove('arm'); v.classList.add('in'); v.style.opacity = '0';
    fading = { v: v, old: old, oldF: cur.f, t: 0 };
    cur = { f: seg.f, mir: seg.mir }; seg.shown = true;
    VSTAT.cuts++; if (late) VSTAT.late++;
    vlog('cut', v, late ? seg.waited : 0, mt);
  }
  function endFade() {
    var F = fading; if (!F) return; fading = null;
    F.v.style.opacity = ''; F.v.classList.remove('in'); F.v.classList.add('live');
    if (F.old && F.old !== F.v) {
      F.old.classList.remove('live', 'in'); F.old.style.opacity = '';
      if (F.oldF !== 'base') {
        F.old.classList.add('arm'); try { F.old.pause(); } catch (e) { /* 무시 */ }
        var f = F.oldF; setTimeout(function () { if (cur.f !== f) prime(f, nextStart(f), false); }, 150);   // 돌진 중 디코더 다툼을 피해 조금 뒤에
      }
    }
  }
  function vlog(kind, v, late, at) {
    if (VLOG.length > 400) VLOG.shift();
    VLOG.push({ t: G ? +G.play.toFixed(2) : 0, k: kind, f: seg.f, from: +seg.from.toFixed(3), mt: +((at != null ? at : v.currentTime) || 0).toFixed(3), rate: +seg.rate.toFixed(2),
      late: +late.toFixed(3), step: G && G.atk && G.atk.st ? G.atk.st.k : '' });
  }
  /** 매 프레임: 페이드 진행 + 영상이 게임 시계의 목표 시각을 따라가게 */
  function follow(dt, gdt) {
    if (fading) { fading.t += dt; var o = Math.min(1, fading.t / FADE); fading.v.style.opacity = o.toFixed(3); if (o >= 1) endFade(); }
    VSTAT.minCover = Math.min(VSTAT.minCover, vids.querySelector('.live') ? 1 : fading ? +fading.v.style.opacity : 0);
    if (!seg) return;
    if (!seg.shown) { seg.waited += dt; tryReveal(); }
    if (seg.loop) return;
    var v = VE[seg.f];
    if (gdt === 0 && seg.shown) { if (!v.paused) v.pause(); return; }   // 히트스톱: 무는 프레임에서 영상도 정지
    seg.el += gdt;

    }
    if (k === 'tell' || k === 'lunge' || k === 'hold' || k === 'tilt') ring(a.locked ? a.lockX : a.ringX, a.r, a.locked, 1);
  }
  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); ctx.setTransform(dpr * s, 0, 0, dpr * s, 0, 0);
    // 세계 층(원·쿠키·입자)은 영상과 똑같이 흔들리고 펀치된다
    ctx.save(); ctx.translate(G.camX + G.ox, G.camY + G.oy); ctx.scale(G.zoom, G.zoom); ctx.translate(-G.ox, -G.oy);
    drawAim(); drawCookie();
    G.fx.forEach(function (p) {
      var al = 1 - p.t / p.life;
      ctx.fillStyle = p.c === 'blade' ? 'rgba(96,170,58,' + al + ')' : p.c === 'crumb' ? 'rgba(196,132,68,' + al + ')' : 'rgba(255,255,255,' + al * 0.8 + ')';
      ctx.beginPath(); if (p.c === 'blade') ctx.ellipse(p.x, p.y, p.r * 0.6, p.r * 2.2, p.vx * 0.004, 0, Math.PI * 2); else ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();
    var a = G.atk;
    if (a && a.P.reps && a.st && a.st.k !== 'boop') {   // 연타 ●●●
      var done = a.rep - 1 + ((a.st.k === 'stamp' || a.st.k === 'back') ? 1 : 0);
      for (var j = 0; j < a.P.reps; j++) { ctx.beginPath(); ctx.arc(Wl / 2 + (j - (a.P.reps - 1) / 2) * 26, 78, 9, 0, Math.PI * 2); ctx.fillStyle = j < done ? 'rgba(255,255,255,0.5)' : '#ff6b6b'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = OL; ctx.stroke(); }
    }
    if (G.huh > 0) { ctx.save(); ctx.globalAlpha = Math.min(1, G.huh * 2); drawText('??', Wl * 0.78, Hl * 0.16, 36, '#ffffff'); ctx.restore(); }
    G.pops.forEach(function (p) { var q = p.t / p.life, sc = q < 0.15 ? 0.6 + q / 0.15 * 0.6 : 1.2 - Math.min(0.2, q - 0.15); ctx.save(); ctx.globalAlpha = q > 0.75 ? (1 - q) / 0.25 : 1; ctx.translate(p.x, p.y - q * 30); ctx.scale(sc, sc); drawText(p.text, 0, 0, p.size, p.color); ctx.restore(); });
    if (G.state !== 'title') {
      for (var i = 0; i < 3; i++) { ctx.save(); ctx.translate(26 + i * 34, 34); ctx.fillStyle = i < G.hearts ? '#ff6b8b' : 'rgba(255,255,255,0.4)'; ctx.strokeStyle = OL; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(0, 9); ctx.bezierCurveTo(-16, -2, -9, -15, 0, -6); ctx.bezierCurveTo(9, -15, 16, -2, 0, 9); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }
      drawText(String(G.score), Wl - 18, 36, 34, '#ffffff', 'right');
      if (G.combo >= 2) drawText(G.combo + '연속', Wl - 18, 66, 18, '#ffd23f', 'right');
    } else {
      drawText('킁킁!', Wl / 2, Hl * 0.08, 60, '#ffffff');
      if (G.best) drawText('최고 ' + G.best, Wl / 2, Hl * 0.08 + 44, 18, '#ffd23f');
      drawText(ready < FIRST_FILES.length ? '강아지 불러오는 중…' : '쿠키를 끌어서 앙! 을 피해요', Wl / 2, floorY - 70, 22, '#ffffff');
    }
  }

  /* ---------------- 루프 ---------------- */
  var last = performance.now();
  function frame(now) { requestAnimationFrame(frame); checkReady(); var dt = Math.min(0.05, (now - last) / 1000); last = now; if (G) { update(dt); render(); } }
  window.addEventListener('resize', resize); if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);

  /* ---------------- 읽기 전용 관찰 창 (자동 검증용) ---------------- */
  function toClient(x, y) { var r = cv.getBoundingClientRect(); return { x: Math.round(r.left + x * s), y: Math.round(r.top + y * s) }; }
  window.kung = {
    snapshot: function () {
      var a = G.atk, n = nosePose(), cn = toClient(n.x, n.y), aim = a && a.st ? (a.locked && a.lockX != null ? a.lockX : a.tx) : null, hits = hitsOf(a);
      return { state: G.state, t: +G.play.toFixed(2), score: G.score, hearts: G.hearts, combo: G.combo, dodges: G.dodges, boops: G.boops, prints: G.printCount, best: G.best,
        ready: ready, readyAll: readyAll, files: FIRST_FILES.length + MORE_FILES.length, kinds: G.kinds.slice(), hitKinds: G.hitKinds.slice(), lanes: G.lanes.slice(), warnF2: G.warnF2,
        clip: cur.f, mir: cur.mir ? 1 : 0, clipT: +(+(VE[cur.f].currentTime) || 0).toFixed(2), shift: Math.round(G.shift), zoom: +G.zoom.toFixed(3),
        src: VE[IDLE] ? VE[IDLE].currentSrc.split('/').pop() : '',
        cookie: { x: Math.round(G.cookie.x), sx: toClient(G.cookie.x, 0).x, sy: toClient(0, cookieY()).y, hidden: G.cookie.hidden ? 1 : 0, bites: Math.max(0, 3 - G.hearts), popT: +G.cookie.popT.toFixed(2) },
        sfx: { want: SFXN.want, loaded: SFXN.loaded, failed: SFXN.failed }, lanesX: laneX.map(Math.round), slanesX: laneX.map(function (x) { return toClient(x, 0).x; }), budget: Math.round(BUDGET), hsN: G.hsN, hsTotal: +G.hsTotal.toFixed(3), freeze: G.freeze > 0 ? 1 : 0,
        bite: a && a.set ? (function () { var b = frameToScreen(a.set.bite.x, a.set.bite.y, a.mir), c = toClient(b.x, b.y); return { sx: c.x, sy: c.y }; })() : null,
        atk: a && a.st ? { kind: a.kind, step: a.st.k, phase: a.fake ? 'fake' : a.st.k, i: a.i, rep: a.rep, t: +a.t.toFixed(3), dur: +a.dur.toFixed(3), fake: a.fake ? 1 : 0, color: a.locked ? 'red' : 'white', first: a.first ? 1 : 0,
          r: Math.round(a.r), tx: aim == null ? null : Math.round(aim), stx: aim == null ? null : toClient(aim, 0).x, lane: a.lane == null ? null : a.lane, key: a.key || null, mir: a.mir ? 1 : 0,
          hits: hits.map(function (v) { return [Math.round(v[0]), Math.round(v[1])]; }), shits: hits.map(function (v) { return [toClient(v[0], 0).x, toClient(v[1], 0).x]; }) } : null,
        nose: { sx: cn.x, sy: cn.y, r: Math.round(n.r * s) }, over: document.getElementById('over').classList.contains('show'), shot: !!G.shot,
        vstat: { cuts: VSTAT.cuts, late: VSTAT.late, seekLive: VSTAT.seekLive, resync: VSTAT.resync, tellCuts: VSTAT.tellCuts, minCover: VSTAT.minCover, fading: fading ? 1 : 0 } };
    },
    vlog: function () { return VLOG.slice(); }
  };

  if (Q.get('nocv')) cv.style.opacity = '0';   // 픽셀 검사용 (터치는 그대로 받음)
  resize(); newGame(false); requestAnimationFrame(frame);
})();
</script>
