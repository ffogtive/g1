<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>빙글쿵 목업</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<!--
  모아쿵! 빙글쿵 — 원 그리기 손맛 목업 v0
  가설: 부술 곳 둘레에 동그라미를 "그리는 동작" 자체를 회오리로 바꿔 주면(바퀴마다 삑·진동·층 상승),
        손을 떼는 순간의 쿵(히트스톱·흔들림·파편)이 탭/드래그보다 더 새로운 손맛이 된다.
  - 바퀴 수: 획의 진행 방향(접선) 회전량 누적. 닫힌 곡선이면 '중심 기준 각도'와 같고, 반쪽 호·찌그러진 원에도 흔들리지 않는다.
    첫 반 바퀴 방향만 인정, 역회전은 진행만 멈춤(줄지 않음).
  - 원 중심/반지름: 최근 한 바퀴 점(최대 60개)의 무게중심·평균 거리. 첫 바퀴 전에는 원 맞춤(최소제곱)으로 미리 보여 준다.
  - 힘 = (1 + 0.5 × 들린 수) × 층, 충격 반지름 = 50 + 4 × 들린 수
-->
<style>
  :root { --ink:#3b2a22; --pill:rgba(255,255,255,.92); --line:#e7d6c8; --accent:#ff7a59; --gold:#ffc23a; color-scheme: light; }
  html, body { margin:0; height:100%; overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; touch-action:none; color:var(--ink); background:#7cc56a; font-family:"Jua","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; }
  #app { position:fixed; inset:0; display:flex; flex-direction:column;
    padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px); }
  #bar { flex:none; height:52px; display:flex; align-items:center; gap:8px; padding:0 10px; }
  .pill { min-width:44px; height:40px; border:0; border-radius:999px; background:var(--pill); box-shadow:0 2px 0 var(--line); font:inherit; font-size:20px; color:var(--ink); padding:0 12px; display:grid; place-items:center; cursor:pointer; }
  .pill:active { transform:translateY(1px); box-shadow:0 1px 0 var(--line); }
  #lives { flex:1; display:flex; gap:4px; align-items:center; min-width:0; }
  .face { width:34px; height:34px; flex:none; transition:transform .25s cubic-bezier(.2,1.6,.5,1), opacity .25s, filter .25s; }
  .face svg { width:100%; height:100%; display:block; }
  .face.used { opacity:.32; filter:grayscale(1); transform:scale(.78); }
  .face.next { animation:bob 1.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform:translateY(-3px) rotate(-6deg); } }
  #score { font-variant-numeric:tabular-nums; min-width:70px; }
  #score.bump { animation:bump .3s cubic-bezier(.2,1.8,.5,1); }
  @keyframes bump { from { transform:scale(1.35); } }
  #stage { flex:1; position:relative; min-height:0; }
  canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block; }
  #over { position:absolute; inset:0; display:none; place-items:center; background:rgba(59,42,34,.35); z-index:5; }
  #over.show { display:grid; }
  .card { background:#fffaf3; border-radius:24px; padding:20px 24px; text-align:center; box-shadow:0 12px 40px rgba(59,42,34,.35); animation:pop .3s cubic-bezier(.2,1.5,.5,1); }
  @keyframes pop { from { transform:scale(.8); opacity:0; } }
  .stars { font-size:48px; letter-spacing:4px; line-height:1.1; }
  .stars span { display:inline-block; animation:starIn .45s cubic-bezier(.2,1.8,.5,1) both; }
  .stars span:nth-child(2) { animation-delay:.12s; } .stars span:nth-child(3) { animation-delay:.24s; }
  @keyframes starIn { from { transform:scale(0) rotate(-40deg); } }
  .stars .on { color:var(--gold); text-shadow:0 3px 0 #d8962a; } .stars .off { color:#e3d6c9; }
  .big { font-size:30px; margin:6px 0 14px; font-variant-numeric:tabular-nums; }
  .row { display:flex; gap:10px; justify-content:center; }
  .row .pill { font-size:24px; height:52px; min-width:72px; }
  .row .pill.main { background:var(--accent); color:#fff; box-shadow:0 3px 0 #c9553a; }
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <button id="back" class="pill" aria-label="목업 고르기로">←</button>
    <div id="lives" aria-label="남은 회오리"></div>
    <div id="score" class="pill" aria-label="점수">0</div>
    <button id="restart" class="pill" aria-label="다시">↻</button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="over"><div class="card" id="card"></div></div>
  </div>
</div>
<script>
(function () {
  'use strict';
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d'), stage = document.getElementById('stage');
  var TAU = Math.PI * 2;
  var FONT = '"Jua","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif';
  var UNITS = 5, POTS = 3, BOSS_R = 40, BOX = 36, PEB = 12, CHIP = 11, LIFT_MAX = 20;
  var LAYER_COL = ['#ffffff', '#ffffff', '#ffe14d', '#ff9a2e'];
  var T_HANG = 0.15, T_FALL = 0.2, HITSTOP = 0.08, SHAKE = 8;

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function rnd(a, b) { return a + Math.random() * (b - a); }

  /* ---------------- 오디오 (모든 호출 try) ---------------- */
  var AC = null, master = null, noiseBuf = null, wind = null;
  function audio() {
    try {
      if (!AC) {
        var A = window.AudioContext || window.webkitAudioContext; if (!A) return;
        AC = new A();
        var comp = AC.createDynamicsCompressor();
        master = AC.createGain(); master.gain.value = 0.9;
        master.connect(comp); comp.connect(AC.destination);
        var len = Math.floor(AC.sampleRate * 1.5);
        noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
        var d = noiseBuf.getChannelData(0); for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      }
      if (AC.state === 'suspended') AC.resume();
    } catch (e) {}
  }
  function tone(f, f2, dur, vol, type, delay, attack) {
    try {
      if (!AC) return;
      var t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(f, t);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + (attack || 0.004));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.03);
    } catch (e) {}
  }
  function noise(dur, vol, type, f, f2, q, delay) {
    try {
      if (!AC) return;
      var t = AC.currentTime + (delay || 0), src = AC.createBufferSource(), flt = AC.createBiquadFilter(), g = AC.createGain();
      src.buffer = noiseBuf;
      flt.type = type || 'lowpass'; flt.frequency.setValueAtTime(f || 1000, t); flt.Q.value = q || 0.7;
      if (f2) flt.frequency.exponentialRampToValueAtTime(f2, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(flt); flt.connect(g); g.connect(master);
      src.start(t, Math.random() * 1.0); src.stop(t + dur + 0.03);
    } catch (e) {}
  }
  function startWind() {
    try {
      if (!AC) return; stopWind();
      var src = AC.createBufferSource(), bp = AC.createBiquadFilter(), g = AC.createGain();
      src.buffer = noiseBuf; src.loop = true; bp.type = 'bandpass'; bp.frequency.value = 400; bp.Q.value = 0.9; g.gain.value = 0.0001;
      src.connect(bp); bp.connect(g); g.connect(master); src.start();
      wind = { src: src, bp: bp, g: g };
    } catch (e) {}
  }
  function setWind(level, freq) { try { if (!wind) return; var t = AC.currentTime; wind.g.gain.setTargetAtTime(Math.max(0.0001, level), t, 0.06); wind.bp.frequency.setTargetAtTime(freq, t, 0.08); } catch (e) {} }
  function stopWind() { try { if (!wind) return; var w = wind; wind = null; var t = AC.currentTime; w.g.gain.setTargetAtTime(0.0001, t, 0.05); w.src.stop(t + 0.35); } catch (e) {} }
  function vib(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

  var NOTES = [523.25, 659.25, 783.99, 1046.5];
  function sLap(n) { var f = NOTES[Math.min(n, 4) - 1] * (n > 4 ? Math.pow(1.06, Math.min(n - 4, 6)) : 1); tone(f, null, 0.18, 0.26, 'triangle'); tone(f * 2, null, 0.1, 0.07, 'sine', 0.03); }
  function sLift() { tone(320, 780, 0.08, 0.12, 'sine'); }
  function sHang() { tone(480, 760, 0.15, 0.07, 'triangle'); }
  function sFall() { tone(1000, 240, 0.2, 0.09, 'sine'); noise(0.2, 0.12, 'bandpass', 1800, 500, 1.2); }
  function sThud(force) {
    var v = clamp(0.5 + force * 0.06, 0.5, 0.95);
    tone(170, 36, 0.5, v, 'sine', 0, 0.003); tone(92, 30, 0.6, v * 0.6, 'sine');
    noise(0.35, v * 0.7, 'lowpass', 1100, 110, 0.7); noise(0.07, v * 0.3, 'bandpass', 2600, null, 1);
  }
  function sPuff() { tone(220, 90, 0.18, 0.25, 'sine'); noise(0.15, 0.2, 'lowpass', 700, 150); }
  function sClang() {
    [1180, 1712, 2390, 3105, 3870].forEach(function (f, i) { tone(f, f * 0.996, 1.1 - i * 0.16, 0.1 - i * 0.013, 'sine', 0, 0.002); });
    tone(620, 600, 0.5, 0.06, 'triangle'); noise(0.05, 0.25, 'highpass', 3200);
    [0.27, 0.45, 0.58, 0.67].forEach(function (d, j) { [1500, 2240, 3020].forEach(function (f) { tone(f * (1 + j * 0.035), null, 0.22, Math.max(0.012, 0.05 - 0.01 * j), 'sine', d, 0.002); }); });
  }
  function sDing() { tone(2093, null, 0.16, 0.2, 'sine', 0, 0.002); tone(3140, null, 0.08, 0.07, 'sine', 0, 0.002); noise(0.03, 0.15, 'highpass', 4200); }
  function sCrack() { noise(0.07, 0.4, 'bandpass', 1600, null, 1.3); tone(190, 90, 0.07, 0.14, 'square'); }
  function sBreak() { noise(0.24, 0.55, 'bandpass', 950, 380, 0.8); noise(0.06, 0.35, 'highpass', 2600, null, 0.7, 0.03); tone(130, 60, 0.16, 0.25, 'triangle'); }
  function sCancel() { tone(520, 300, 0.12, 0.08, 'sine'); }
  var lastTick = 0;
  function sTick() { var n = performance.now(); if (n - lastTick < 45) return; lastTick = n; tone(rnd(850, 1250), null, 0.04, 0.05, 'triangle'); }
  function sWin() { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, null, 0.28, 0.2, 'triangle', i * 0.11); }); }
  function sLose() { [392, 311, 262].forEach(function (f, i) { tone(f, f * 0.97, 0.32, 0.18, 'triangle', i * 0.18); }); }

  /* ---------------- 레이아웃 ---------------- */
  var dpr = 1, stageW = 390, stageH = 700, s = 1, Wl = 390, Hl = 700, ox = 0, bossX = 195, bossY = 266, bg = null;
  function calcBossY(h) { return Math.round(Math.max(240, Math.min(h * 0.38, h - 330))); }
  function resize() {
    var r = stage.getBoundingClientRect();
    if (r.width < 10 || r.height < 10) return;
    stageW = r.width; stageH = r.height;
    dpr = Math.min(3, window.devicePixelRatio || 1);
    cv.width = Math.round(stageW * dpr); cv.height = Math.round(stageH * dpr);
    s = Math.min(stageW / 390, stageH / 700); Wl = stageW / s; Hl = stageH / s;
    var nox = (Wl - 390) / 2, nby = calcBossY(Hl), dx = nox - ox, dy = nby - bossY;
    ox = nox; bossX = ox + 195; bossY = nby;
    if (G && (dx || dy)) shiftWorld(dx, dy);
    buildBg();
  }
  function shiftWorld(dx, dy) {
    G.boxes.forEach(function (b) { b.x += dx; b.y += dy; });
    G.items.forEach(function (it) { it.x += dx; it.y += dy; it.hx0 += dx; it.hy0 += dy; if (it.anim) { it.anim.fx += dx; it.anim.fy += dy; it.anim.tx += dx; it.anim.ty += dy; } });
    G.fx = newFx(); G.stroke = null; stopWind(); if (G.state === 'draw') G.state = 'idle';
    if (G.slam) { G.slam.cx += dx; G.slam.cy += dy; }
  }
  function buildBg() {
    bg = document.createElement('canvas'); bg.width = cv.width; bg.height = cv.height;
    var g = bg.getContext('2d'); g.setTransform(dpr * s, 0, 0, dpr * s, 0, 0);
    var grad = g.createLinearGradient(0, 0, 0, Hl); grad.addColorStop(0, '#9fd67a'); grad.addColorStop(1, '#7cc56a');
    g.fillStyle = grad; g.fillRect(0, 0, Wl, Hl);
    var R = rng(11);
    g.lineCap = 'round'; g.lineJoin = 'round';
    var paths = [
      [ox - 40, Hl * 0.95, ox + 120, Hl * 0.82, ox + 20, Hl * 0.68, ox + 140, bossY + 170],
      [ox + 440, Hl * 0.74, ox + 320, Hl * 0.66, ox + 330, Hl * 0.9, ox + 250, Hl + 40],
      [ox - 40, bossY - 150, ox + 90, bossY - 230, ox + 230, bossY - 150, ox + 440, bossY - 240]
    ];
    paths.forEach(function (p) {
      g.beginPath(); g.moveTo(p[0], p[1]); g.bezierCurveTo(p[2], p[3], p[4], p[5], p[6], p[7]);
      g.strokeStyle = 'rgba(170,128,80,.20)'; g.lineWidth = 30; g.stroke();
      g.strokeStyle = 'rgba(214,180,128,.20)'; g.lineWidth = 16; g.stroke();
    });
    for (var i = 0; i < Math.round(Wl * Hl / 4200); i++) {
      var x = R() * Wl, y = R() * Hl;
      g.strokeStyle = 'rgba(52,118,44,' + (0.16 + R() * 0.14) + ')'; g.lineWidth = 1.6;
      g.beginPath(); g.moveTo(x - 4, y - 5); g.lineTo(x - 1, y); g.lineTo(x, y - 7); g.lineTo(x + 1, y); g.lineTo(x + 4, y - 5); g.stroke();
    }
    for (i = 0; i < 18; i++) {
      g.fillStyle = R() < 0.5 ? 'rgba(255,255,255,.7)' : 'rgba(255,226,110,.75)';
      g.beginPath(); g.arc(R() * Wl, R() * Hl, 2, 0, TAU); g.fill();
    }
  }

  /* ---------------- 게임 상태 ---------------- */
  var G = null, tutorial = true, activeId = null, lastPtr = { x: -999, y: -999 }, hitstop = 0, shakeAmp = 0, time = 0;
  function newFx() { return { parts: [], puffs: [], rings: [], sparks: [], flys: [], pops: [], marks: [] }; }
  function newGame() {
    stopWind(); activeId = null; hitstop = 0; shakeAmp = 0;
    G = {
      state: 'idle', stateT: 0, units: UNITS, pots: POTS, score: 0,
      boxes: [], items: [], stroke: null, slam: null, lastLaps: 0, lastLayer: 0, end: null, endT: 0,
      boss: { hurt: 0, flinch: 0, squash: 0, blink: 2 },
      vc: { x: bossX, y: bossY, R: 60, phase: 0 }, flash: 0, flashX: 0, flashY: 0, flashR: 0,
      fx: newFx()
    };
    for (var k = 0; k < 8; k++) {
      var a = k * TAU / 8 + Math.PI / 8;
      G.boxes.push({ x: bossX + Math.cos(a) * 70, y: bossY + Math.sin(a) * 70, hp: 2, broken: false, flash: 0, squash: 0, rot: (k % 2 ? 1 : -1) * 0.05, seed: k * 7 + 3, puffT: 0 });
    }
    var R = rng(20261012);
    for (var i = 0; i < 12; i++) {
      for (var tries = 0; tries < 300; tries++) {
        var ang = i / 12 * TAU + (R() - 0.5) * 0.45, rad = 120 + R() * 80;
        var x = bossX + Math.cos(ang) * rad, y = bossY + Math.sin(ang) * rad;
        if (x < ox + 16 || x > ox + 374 || y < 18 || y > Hl - 18) continue;
        var ok = true;
        for (var j = 0; j < G.items.length; j++) if (dist(x, y, G.items[j].x, G.items[j].y) < 24) { ok = false; break; }
        if (ok || tries > 250) { G.items.push(newItem('peb', x, y)); break; }
      }
    }
    hideOver(); hud(true);
  }
  function newItem(kind, x, y) {
    return { kind: kind, size: kind === 'peb' ? PEB : CHIP, x: x, y: y, z: 0, lifted: false, anim: null, hx0: x, hy0: y,
      phi: 0, rho: 0, jit: Math.random(), rot: Math.random() * TAU, vr: 0, wob: Math.random() * TAU };
  }

  /* ---------------- 원 판정 ---------------- */
  function newStroke(p) { return { pts: [p], dh: [0], net: 0, peak: 0, dir: 0, laps: 0, layer: 0, lapInt: 0, cx: p.x, cy: p.y, R: 0, valid: false, loopStart: 0, turn: 0, spin: 0 }; }
  function wrap(a) { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; }
  function addPoint(st, x, y) {
    var pts = st.pts, lp = pts[pts.length - 1];
    if ((x - lp.x) * (x - lp.x) + (y - lp.y) * (y - lp.y) < 16) return false;   // 4 논리px 간격
    pts.push({ x: x, y: y });
    var n = pts.length, d = 0;
    if (n >= 3) {
      var a = pts[n - 3], b = pts[n - 2];
      d = wrap(Math.atan2(y - b.y, x - b.x) - Math.atan2(b.y - a.y, b.x - a.x));
      if (Math.abs(d) > 2.0) d = 0;     // 뾰족하게 꺾인 곳(왕복)은 무시
      if (n === 3) d *= 2;              // 첫 마디의 회전은 측정이 안 되므로 보정 → 원 1바퀴 = 정확히 2π
    }
    st.dh.push(d);
    if (st.dir === 0) {
      st.net += d;
      if (Math.abs(st.net) >= Math.PI) { st.dir = st.net > 0 ? 1 : -1; st.net = Math.abs(st.net); st.peak = st.net; }   // 첫 반 바퀴 방향 고정
      st.turn += Math.abs(d);
    } else {
      st.net += st.dir * d;
      if (st.net > st.peak) { st.turn += st.net - st.peak; st.peak = st.net; }
      else if (st.net < st.peak - Math.PI / 2) st.net = st.peak - Math.PI / 2;      // 역회전: 멈출 뿐 줄지 않음
    }
    st.laps = (st.dir === 0 ? Math.abs(st.net) : st.peak) / TAU;
    var li = Math.floor(st.laps);
    if (li > st.lapInt) { st.lapInt = li; st.layer = Math.min(3, li); onLap(li); }
    if (pts.length > 1600) { pts.splice(0, 600); st.dh.splice(0, 600); }
    return true;
  }
  function kasa(P) {
    var n = P.length, mx = 0, my = 0, i;
    for (i = 0; i < n; i++) { mx += P[i].x; my += P[i].y; } mx /= n; my /= n;
    var Suu = 0, Svv = 0, Suv = 0, Suuu = 0, Svvv = 0, Suvv = 0, Svuu = 0;
    for (i = 0; i < n; i++) { var u = P[i].x - mx, v = P[i].y - my; Suu += u * u; Svv += v * v; Suv += u * v; Suuu += u * u * u; Svvv += v * v * v; Suvv += u * v * v; Svuu += v * u * u; }
    var det = Suu * Svv - Suv * Suv;
    if (!(Math.abs(det) > 1e-6 * (Suu + Svv) * (Suu + Svv) + 1e-9)) return null;
    var A = 0.5 * (Suuu + Suvv), B = 0.5 * (Svvv + Svuu);
    var uc = (A * Svv - B * Suv) / det, vc = (Suu * B - Suv * A) / det;
    var R = Math.sqrt(uc * uc + vc * vc + (Suu + Svv) / n);
    if (!isFinite(R) || R > 600) return null;
    return { x: uc + mx, y: vc + my };
  }
  function fitStroke(st) {
    var pts = st.pts, dh = st.dh, n = pts.length;
    if (n < 6) { st.valid = false; return; }
    var sum = 0, i = n - 1;
    for (; i > 0; i--) { sum += dh[i]; if (Math.abs(sum) >= TAU) break; }
    var start = Math.max(0, i - 1), full = Math.abs(sum) >= TAU * 0.97;
    var cnt = n - start, m = Math.min(cnt, 60), step = cnt / m, P = [];
    for (var k = 0; k < m; k++) P.push(pts[start + Math.floor(k * step)]);       // 최근 점 최대 60개

    } else {
      G.state = 'lose'; sLose();
      card.innerHTML = '<div class="stars"><span class="off">★</span><span class="off">★</span><span class="off">★</span></div><div class="big">' + G.score + '</div><div class="row"><button class="pill main" data-a="restart" aria-label="다시">↻</button><button class="pill" data-a="back" aria-label="목업 고르기로">←</button></div>';
    }
    over.classList.add('show');
  }
  function hideOver() { over.classList.remove('show'); card.innerHTML = ''; }
  function goBack() { if (history.length > 1) history.back(); else location.href = (location.protocol === 'file:' ? 'index.html' : './'); }
  function restart() { tutorial = false; newGame(); }
  over.addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; audio(); if (b.dataset.a === 'restart') restart(); else goBack(); });
  document.getElementById('restart').addEventListener('click', function () { audio(); restart(); });
  document.getElementById('back').addEventListener('click', goBack);

  /* ---------------- 루프 ---------------- */
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
    if (G) { update(dt); render(); }
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);

  /* ---------------- 읽기 전용 검증 API ---------------- */
  function toClient(x, y) { var r = cv.getBoundingClientRect(); return { x: r.left + x * s, y: r.top + y * s }; }
  function r1(v) { return Math.round(v * 10) / 10; }
  window.binggle = Object.freeze({
    snapshot: function () {
      var st = G.stroke, c = null;
      if (st && st.valid && G.state === 'draw') c = { x: st.cx, y: st.cy };
      else if (G.slam && (G.state === 'hang' || G.state === 'fall' || G.state === 'settle')) c = { x: G.slam.cx, y: G.slam.cy };
      var cc = c ? toClient(c.x, c.y) : null;
      return JSON.parse(JSON.stringify({
        state: G.state, units: G.units, score: G.score,
        laps: Math.round((st ? st.laps : G.lastLaps) * 1000) / 1000,
        layer: st ? st.layer : G.lastLayer,
        lifted: countLifted(),
        center: cc ? { x: r1(cc.x), y: r1(cc.y), lx: r1(c.x), ly: r1(c.y), r: st && G.state === 'draw' ? r1(st.R * s) : null } : null,
        pots: G.pots,
        boxes: G.boxes.map(function (b) { var p = toClient(b.x, b.y); return { hp: b.hp, broken: b.broken, sx: r1(p.x), sy: r1(p.y) }; }),
        pebbles: G.items.map(function (it) { var p = toClient(it.x, it.y); return { sx: r1(p.x), sy: r1(p.y), lifted: it.lifted, kind: it.kind }; }),
        boss: (function () { var p = toClient(bossX, bossY); return { sx: r1(p.x), sy: r1(p.y), r: r1(BOSS_R * s) }; })(),
        lastSlam: G.slam && G.slam.force != null ? { force: G.slam.force, impactR: G.slam.IR, lifted: G.slam.lifted.length, layer: G.slam.layer } : null,
        scale: s, over: over.classList.contains('show'), tutorial: tutorial
      }));
    },
    toClient: function (x, y) { var p = toClient(x, y); return { x: p.x, y: p.y }; }
  });

  resize();
  newGame();
  requestAnimationFrame(frame);
})();
</script>
