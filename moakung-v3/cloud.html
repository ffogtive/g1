<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>구름착 목업</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<!--
  모아쿵! 몽글탑 C "구름착" — 비교 목업 (v0.4 '쿵'과 나란히)
  가설: 앵그리버드 같다는 느낌은 "옆으로 쏴서 남의 요새를 부순다"에서 온다. 재미가 확인된 아슬아슬 쌓기 + 스프링 튕기기는 그대로 두고,
        목표를 "위로 튕겨 내 탑을 구름에 착! 세우기"로 뒤집는다. 친구마다 동사 하나 — 개성이 화면에 보이게.
  - 구름은 아래에서 통과, 위에서만 밟힘(몽글 구름). 착지해서 선 친구만 다음 구름으로 데려간다 → 많이 쌓을수록 다 데려가지만 아슬아슬.
  - 동사: 꽝돌(맨 아래면 오뚝이 — 비행 중 탑을 바로 세움, 무게중심 길은 그대로) · 부풀(날 때 톡 → 빵빵 낙하산) ·
          몽이(스프링 바로 위면 한 번 더 통 +20%) · 길쭉(높이를 싸게, 대신 위가 흔들). 서로 닿은 친구는 날 때 붙어 있다가 세게 부딪치면 똑 끊김.
  - 착지: 슬로모 → 도장 "착!" → 아래부터 착-착-착 → 자동 인증샷 → 기다리던 친구 "나도!" → 다음 구름.
  - 밸런스는 tools/cloud-sim.js 가 이 파일의 WORLD 블록을 그대로 돌려 확인한다.
-->
<style>
  :root { --ink:#3b2a22; --pill:rgba(255,255,255,.92); --line:#e7d6c8; --accent:#ff7a59; --gold:#ffc23a; color-scheme: light; }
  html, body { margin:0; height:100%; overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; touch-action:none; color:var(--ink); background:#a9dcff; font-family:"Jua","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; }
  #app { position:fixed; inset:0; display:flex; flex-direction:column; background:linear-gradient(#a9dcff, #e9f6ff 45%, #fff1cf);
    padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px); }
  #bar { flex:none; height:52px; display:flex; align-items:center; gap:8px; padding:0 10px; }
  .pill { min-width:44px; height:40px; border:0; border-radius:999px; background:var(--pill); box-shadow:0 2px 0 var(--line); font:inherit; font-size:20px; color:var(--ink); padding:0 12px; display:grid; place-items:center; cursor:pointer; }
  .pill:active { transform:translateY(1px); }
  #flags { flex:1; display:flex; gap:4px; align-items:center; min-width:0; }
  .flag { width:22px; height:26px; flex:none; transition:opacity .3s, transform .3s; }
  .flag.used { opacity:.22; transform:scale(.85); }
  #score { font-variant-numeric:tabular-nums; min-width:64px; }
  #stage { flex:1; position:relative; min-height:0; }
  canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block; }
  #over { position:absolute; inset:0; display:none; place-items:center; background:rgba(59,42,34,.35); z-index:5; }
  #over.show { display:grid; }
  .card { background:#fffaf3; border-radius:24px; padding:20px 24px; text-align:center; box-shadow:0 12px 40px rgba(59,42,34,.35); animation:pop .3s cubic-bezier(.2,1.5,.5,1); }
  @keyframes pop { from { transform:scale(.8); opacity:0; } }
  .stars { font-size:52px; letter-spacing:4px; line-height:1.1; }
  .stars span { display:inline-block; animation:starIn .45s cubic-bezier(.2,1.8,.5,1) both; }
  .stars span:nth-child(2) { animation-delay:.35s; } .stars span:nth-child(3) { animation-delay:.7s; }
  @keyframes starIn { from { transform:scale(0) rotate(-40deg); opacity:0; } }
  .stars .on { color:var(--gold); text-shadow:0 3px 0 #d8962a; } .stars .off { color:#e3d6c9; }
  .big { font-size:30px; margin:6px 0 4px; font-variant-numeric:tabular-nums; }
  .sub { font-size:15px; color:#8a6a5a; margin-bottom:14px; }
  .row { display:flex; gap:10px; justify-content:center; }
  .row .pill { font-size:24px; height:52px; min-width:72px; }
  .row .pill.main { background:var(--accent); color:#fff; box-shadow:0 3px 0 #c9553a; }
  #rot { position:fixed; inset:0; display:none; place-items:center; text-align:center; font-size:22px; background:#fff1cf; z-index:20; padding:24px; }
  @media (orientation: landscape) and (max-height: 520px) { #rot { display:grid; } }
  #err { position:absolute; inset:0; display:none; place-items:center; padding:24px; text-align:center; font-size:18px; z-index:9; background:#fff1cf; }
</style>
</head>
<body>
<div id="rot">📱 세로로 돌려 주세요</div>
<div id="app">
  <div id="bar">
    <button id="back" class="pill" aria-label="목업 고르기로">←</button>
    <div id="flags" aria-label="남은 발사"></div>
    <div id="score" class="pill" aria-label="점수">0</div>
    <button id="restart" class="pill" aria-label="다시">↻</button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="over"><div class="card" id="card"></div></div>
    <div id="err">물리 엔진(vendor/planck.min.js)을 불러오지 못했어요.<br>폴더째 열었는지 확인해 주세요.</div>
  </div>
</div>
<script src="vendor/planck.min.js"></script>
<script>
/*WORLD-START*/
// 몽글탑 C "구름착" 물리 규칙 — 목업(cloud.html)과 계산기(tools/cloud-sim.js)가 이 블록을 그대로 같이 쓴다.
// 결정론: 이 안에는 무작위·시각 의존이 없다 (같은 입력 → 같은 결과).
// 바탕은 v0.4(tower.html)의 쌓기·스프링·점선. 다른 점: 위로 쏴서 구름에 "착!" 세우기 + 친구 동사.
var PL = planck;
var PHY = {
  G: 10, DT: 1 / 60, VI: 10, PI: 6,
  V_MAX: 16.5, M0: 3, P_MIN: 0.2, ANG_MIN: 35, ANG_MAX: 145,     // 위로 쏜다: 오른쪽 위 35° ~ 왼쪽 위 145°
  PULL_X: 0.15, PULL_Y: 0.55, PULL_V: 1.6, PULL_A: 6, TILT: 0.06,
  PLATE: { hw: 0.75, hh: 0.1, mass: 3, kx: 2500, cx: 87, ky: 900, cy: 30, kr: 300, cr: 10.5 },
  HOLD_T: 0.25, GUIDE_T0: 0.1, GUIDE_T1: 0.55, QUIET_V: 0.12, QUIET_W: 0.3,
  WELD_HZ: 4, WELD_DAMP: 0.7, WELD_BREAK: 140,          // 날 때 서로 닿은 친구는 부드럽게 붙음 · 세게 부딪치면 끊어져 와르르
  SPIN: 0.22,                                            // 삐딱하게 쌓으면(무게중심이 받침 가운데서 비켜나면) 빙글 돈다
  KWANG_K: 9, KWANG_D: 3,                                // 꽝돌 오뚝이: 맨 아래면 탑 기울기를 되돌리는 힘(알짜 힘 0 → 점선 그대로)
  MONG_BOOST: 1.2,                                       // 몽이가 스프링 바로 위면 한 번 더 통 (+20%)
  PUFF_LIFT: 0.85, PUFF_DRAG: 1.6, PUFF_R2: 0.62,        // 부풀 톡 → 빵빵 낙하산: 무리 무게의 85%만큼 위로 · 속도 반대 저항
  STAND_ANG: 35, LAND_WAIT: 2.5                          // 착지: 기울기 35° 미만으로 구름 위에 얹혀 있으면 "섰다"
};
var CAT = { GROUND: 1, PLATE: 2, FRIEND: 4, CLOUD: 8 };
var DIMS = {
  mong:  { shape: 'ngon', n: 10, r: 0.46, density: 1.0, friction: 0.8, rest: 0.35, angDamp: 1.5, w8: 1 },
  puff:  { shape: 'ngon', n: 12, r: 0.40, density: 1.0, friction: 0.8, rest: 0.2, angDamp: 1.0, w8: 0.5 },
  gil:   { shape: 'capsule', w: 0.62, h: 2.3, rb: 0.07, rt: 0.22, density: 0.8, friction: 0.8, rest: 0.1, angDamp: 0.3, w8: 1 },
  kwang: { shape: 'rbox', w: 1.3, h: 0.8, r: 0.14, density: 2.5, friction: 0.8, rest: 0.05, angDamp: 0.3, w8: 3 }
};
// 판: 땅 받침에서 구름 A·B·C 를 지나 하늘집 지붕까지. y = 윗면 높이(m), 받침은 윗면 위 0.75m 에 떠 있는 꽃방석 스프링.
var LEVEL = {
  start: ['kwang', 'puff'], flags: 6,
  ground: { x: 0, top: 0.1 },
  clouds: [
    { x: 1.9, top: 4.8, w: 4.0, wait: 'gil' },
    { x: -0.6, top: 9.4, w: 3.8, wait: 'mong' },
    { x: 1.5, top: 13.9, w: 3.6, wait: 'kwang' },
    { x: -1.2, top: 18.3, w: 4.0, house: true }
  ]
};

function ngon(n, r) { var v = []; for (var i = 0; i < n; i++) { var a = -Math.PI / 2 + Math.PI / n + i * 2 * Math.PI / n; v.push({ x: r * Math.cos(a), y: r * Math.sin(a) }); } return v; }
function polyOf(kind) {
  var d = DIMS[kind];
  if (d.shape === 'ngon') return ngon(d.n, d.r);
  var w = d.w / 2, h = d.h / 2, s = Math.SQRT1_2;
  if (d.shape === 'capsule') {
    var rb = d.rb, rt = d.rt;
    return [{ x: -w + rb, y: -h }, { x: w - rb, y: -h }, { x: w, y: -h + rb }, { x: w, y: h - rt }, { x: w - rt + rt * s, y: h - rt + rt * s }, { x: w - rt, y: h },
      { x: -w + rt, y: h }, { x: -w + rt - rt * s, y: h - rt + rt * s }, { x: -w, y: h - rt }, { x: -w, y: -h + rb }];
  }
  var r = d.r;
  return [{ x: -w + r, y: -h }, { x: w - r, y: -h }, { x: w, y: -h + r }, { x: w, y: h - r }, { x: w - r, y: h }, { x: -w + r, y: h }, { x: -w, y: h - r }, { x: -w, y: -h + r }];
}
var POLY = {}; ['mong', 'puff', 'gil', 'kwang'].forEach(function (k) { POLY[k] = polyOf(k); });
function halfW(v) { var m = 0; v.forEach(function (p) { m = Math.max(m, Math.abs(p.x)); }); return m; }
function lowY(v, dx) {
  var best = null;
  for (var i = 0; i < v.length; i++) {
    var a = v[i], b = v[(i + 1) % v.length];
    if ((a.x - dx) * (b.x - dx) <= 0 && a.x !== b.x) { var y = a.y + (dx - a.x) / (b.x - a.x) * (b.y - a.y); if (best === null || y < best) best = y; }
  }
  return best;
}
function polyFix(body, verts, o) {
  return body.createFixture(new PL.Polygon(verts), { density: o.density, friction: o.friction, restitution: o.rest || 0, filterCategoryBits: o.cat, filterMaskBits: o.mask == null ? 0xffff : o.mask });
}
/** 단계 i 의 발사 받침 기준점 (0 = 땅, 1.. = 구름 i-1) */
function anchorOf(level, i) { if (i === 0) return { x: level.ground.x, y: level.ground.top + 0.9 }; var c = level.clouds[i - 1]; return { x: c.x, y: c.top + 0.75 }; }

function mkWorld(level) {
  level = level || LEVEL;
  var world = new PL.World({ gravity: { x: 0, y: -PHY.G } });
  var W = { world: world, level: level, step: 0, t: 0, friends: [], clouds: [], welds: [], events: [], stage: 0, nextId: 100, launch: null, landT: -1, puffTap: false,
    aim: { on: false, p: 0, theta: 80, want: { x: 0, y: 0 }, off: { x: 0, y: 0 }, vel: { x: 0, y: 0 }, tilt: 0, wantTilt: 0, fast: false, fire: false, hold: 0 } };
  var ground = world.createBody();
  ground.createFixture(new PL.Box(60, 1, { x: 0, y: level.ground.top - 1 }, 0), { friction: 0.9, filterCategoryBits: CAT.GROUND });
  ground.ud = { type: 'ground', idx: 0 }; W.ground = ground;
  level.clouds.forEach(function (c, i) {
    var b = world.createBody({ position: { x: c.x, y: c.top } });
    // 윗면은 평평(높은 마찰·반발 0), 양 끝에 낮은 턱 → 살짝 감싸 줌
    b.createFixture(new PL.Box(c.w / 2, 0.35, { x: 0, y: -0.35 }, 0), { friction: 1.0, restitution: 0, filterCategoryBits: CAT.CLOUD });
    [-1, 1].forEach(function (sd) { b.createFixture(new PL.Polygon([{ x: sd * c.w / 2, y: 0 }, { x: sd * (c.w / 2 - 0.35), y: 0 }, { x: sd * c.w / 2, y: 0.12 }].sort(function (p, q) { return p.x - q.x; })), { friction: 1.0, restitution: 0, filterCategoryBits: CAT.CLOUD }); });
    b.ud = { type: 'cloud', idx: i + 1, top: c.top, w: c.w, house: !!c.house };
    W.clouds.push(b);
  });
  var P = PHY.PLATE, a0 = anchorOf(level, 0);
  var plate = world.createBody({ type: 'dynamic', position: { x: a0.x, y: a0.y }, gravityScale: 0 });
  plate.createFixture(new PL.Box(P.hw, P.hh), { density: P.mass / (4 * P.hw * P.hh), friction: 0.9, filterCategoryBits: CAT.PLATE, filterMaskBits: CAT.FRIEND });
  plate.setSleepingAllowed(false); plate.ud = { type: 'plate' }; W.plate = plate; W.anchor = a0;
  world.on('pre-solve', function (c) { preSolve(W, c); });
  for (var s = 0; s < 30; s++) stepW(W);
  W.events.length = 0;
  return W;
}
function addFriend(W, kind, x, y, id) {
  var d = DIMS[kind];
  var b = W.world.createBody({ type: 'dynamic', position: { x: x, y: y }, angularDamping: d.angDamp });
  polyFix(b, POLY[kind], { density: d.density, friction: d.friction, rest: d.rest, cat: CAT.FRIEND });
  b.ud = { type: 'friend', kind: kind, id: id == null ? W.nextId++ : id, state: 'stack', fell: false, placeT: W.t };
  W.friends.push(b); return b;
}
function removeFriend(W, b) { W.welds = W.welds.filter(function (j) { if (j.getBodyA() === b || j.getBodyB() === b) { W.world.destroyJoint(j); return false; } return true; }); W.friends = W.friends.filter(function (f) { return f !== b; }); b.ud.dead = true; W.world.destroyBody(b); }
function stackFriends(W) { return W.friends.filter(function (b) { return b.ud.state === 'stack'; }); }

function rayDown(W, x) {
  var best = 1, top = W.anchor.y + 30, bot = W.anchor.y - 4;
  W.world.rayCast({ x: x, y: top }, { x: x, y: bot }, function (fx, pt, n, frac) {
    var u = fx.getBody().ud;
    if (u && u.type === 'friend' && u.state !== 'stack') return -1;
    if (u && u.type === 'cloud' && u.idx > W.stage) return -1;   // 위 구름은 무시 (지금 받침 쪽만)
    if (frac < best) best = frac;
    return frac;
  });
  return top + (bot - top) * best;
}
function landing(W, kind, x) {
  var v = POLY[kind], hw = halfW(v), best = -1e9;
  [-0.95, -0.66, -0.33, 0, 0.33, 0.66, 0.95].forEach(function (k) {
    var dx = k * hw, ly = lowY(v, dx); if (ly === null) return;
    best = Math.max(best, rayDown(W, x + dx) - ly);
  });
  return best + 0.04;
}
function canDrop(W, x) { var p = W.plate.getPosition(); return Math.abs(x - p.x) <= PHY.PLATE.hw + 0.3; }

function preSolve(W, c) {
  var fA = c.getFixtureA(), fB = c.getFixtureB(), a = fA.getBody().ud || {}, b = fB.getBody().ud || {};
  // 구름은 아래·옆에서는 통과, 위에서 내려앉을 때만 밟힘 (몽글 구름 = 한 방향 발판)
  if ((a.type === 'cloud' && b.type === 'friend') || (b.type === 'cloud' && a.type === 'friend')) {
    var cl = a.type === 'cloud' ? a : b, ff = a.type === 'cloud' ? fB : fA, fb = ff.getBody();
    if (ff.getAABB(0).lowerBound.y < cl.top - 0.12 || fb.getLinearVelocity().y > 0.5) { c.setEnabled(false); return; }
  }
  if ((a.type === 'friend' && a.state !== 'fly') || (b.type === 'friend' && b.state !== 'fly')) {
    var fresh = (a.type === 'friend' && W.t - (a.placeT || -9) < 0.6) || (b.type === 'friend' && W.t - (b.placeT || -9) < 0.6);
    c.setRestitution(fresh ? 0.1 : 0);
  }
  // 날아가는 무리가 목표 구름(또는 그 받침)에 처음 닿음 → 착지 시작
  if (W.launch && W.landT < 0) {
    var tgt = W.stage + 1, hitT = (a.type === 'friend' && a.state === 'fly' && (b.type === 'cloud' && b.idx === tgt)) || (b.type === 'friend' && b.state === 'fly' && (a.type === 'cloud' && a.idx === tgt));
    if (hitT) { W.landT = W.t; W.events.push({ type: 'touch', stage: tgt }); }
  }
}

/* ---------------- 받침(스프링) ---------------- */
function clampMag(x, y, m) { var l = Math.sqrt(x * x + y * y); return l > m ? { x: x / l * m, y: y / l * m } : { x: x, y: y }; }
function plateControl(W) {
  var a = W.aim, P = PHY.PLATE, dt = PHY.DT, A = W.anchor;
  if (a.hold > 0) { a.hold -= dt; if (a.hold <= 0) aimCancel(W, false); }
  var vmax = a.fast ? 8 : PHY.PULL_V, amax = a.fast ? 200 : PHY.PULL_A;
  var tv = clampMag((a.want.x - a.off.x) * 12, (a.want.y - a.off.y) * 12, vmax);
  var dv = clampMag(tv.x - a.vel.x, tv.y - a.vel.y, amax * dt);
  a.vel.x += dv.x; a.vel.y += dv.y; a.off.x += a.vel.x * dt; a.off.y += a.vel.y * dt;
  var tr = (a.fast ? 4 : 0.7) * dt;
  a.tilt += Math.max(-tr, Math.min(tr, a.wantTilt - a.tilt));
  if (a.fast && Math.abs(a.off.x) + Math.abs(a.off.y) < 0.005 && Math.abs(a.tilt) < 0.002) a.fast = false;
  var b = W.plate, p = b.getPosition(), v = b.getLinearVelocity(), ang = b.getAngle(), w = b.getAngularVelocity();
  b.applyForceToCenter({ x: P.kx * (A.x + a.off.x - p.x) - P.cx * v.x, y: P.ky * (A.y + a.off.y - p.y) - P.cy * v.y }, true);
  b.applyTorque(P.kr * (a.tilt - ang) - P.cr * w, true);
}
function aimSet(W, p, theta) {
  var a = W.aim; p = Math.max(0, Math.min(1, p)); theta = Math.max(PHY.ANG_MIN, Math.min(PHY.ANG_MAX, theta));
  var th = theta * Math.PI / 180;
  a.on = true; a.fast = false; a.p = p; a.theta = theta; a.hold = 0;
  a.want = { x: -PHY.PULL_X * p * Math.cos(th), y: -PHY.PULL_Y * p };
  a.wantTilt = -(90 - theta) * PHY.TILT * Math.PI / 180 * Math.min(1, p / 0.3);
}
function aimCancel(W, fast) { var a = W.aim; a.on = false; a.p = 0; a.want = { x: 0, y: 0 }; a.wantTilt = 0; a.fast = !!fast; a.hold = 0; }
function aimRelease(W) {
  if (W.aim.p < PHY.P_MIN || !groupOf(W).length) { aimCancel(W, false); return false; }
  W.aim.fire = true; return true;
}
/** 발사될 무리: 받침에 닿은 친구(= 바닥) + 그 위로 닿은 친구… 바닥 목록도 함께 */
function groupOf(W) {
  var out = [], seen = {}, q = [W.plate];
  out.bottom = [];
  while (q.length) {
    var b = q.shift();
    for (var ce = b.getContactList(); ce; ce = ce.next) {
      var o = ce.other, u = o && o.ud;
      if (!u || u.type !== 'friend' || u.state !== 'stack' || seen[u.id] || !ce.contact.isTouching()) continue;
      seen[u.id] = true;
      if (touches(o, 'ground') || touches(o, 'cloud')) continue;

      var p = slotPos(i), sc = trayScale(t.kind), d = DIMS[t.kind], hh = (d.shape === 'ngon' ? d.r * Math.cos(Math.PI / d.n) : d.h / 2) * sc;
      ctx.fillStyle = 'rgba(40,80,30,0.22)'; ctx.beginPath(); ctx.ellipse(p.x, p.y + 2, p.w * 0.32, 5, 0, 0, Math.PI * 2); ctx.fill();
      if (t.status === 'ready' || t.status === 'dizzy') {
        var bob = t.status === 'ready' ? Math.sin(G.t * 3 + t.bob) * 1.5 : 0;
        ctx.save(); ctx.translate(p.x + wig, p.y - hh + bob); ctx.scale(1 + t.sq * 0.12, 1 - t.sq * 0.12);
        drawFriend(t.kind, sc, { mood: t.status === 'dizzy' ? 9 : 0, grey: t.status === 'dizzy' });
        ctx.restore();
        var w8 = DIMS[t.kind].w8, nd = Math.ceil(w8);   // 무게 점 ●=1 ○=0.5
        for (var d2 = 0; d2 < nd; d2++) { var dx2 = p.x + (d2 - (nd - 1) / 2) * 9; ctx.beginPath(); ctx.arc(dx2, p.y + 13, 3.2, 0, Math.PI * 2); if (d2 < Math.floor(w8)) { ctx.fillStyle = 'rgba(59,42,34,0.75)'; ctx.fill(); } else { ctx.strokeStyle = 'rgba(59,42,34,0.75)'; ctx.lineWidth = 1.5; ctx.stroke(); } }
        if (t.status === 'dizzy') { var ty = p.y - hh * 2 - 10; ctx.fillStyle = '#fff'; ctx.strokeStyle = OL; ctx.lineWidth = 3; ctx.font = '13px Jua, sans-serif'; ctx.textAlign = 'center'; ctx.strokeText('어질', p.x + 16, ty); ctx.fillText('어질', p.x + 16, ty); }
      } else if (t.status === 'return') {
        var q = Math.min(1, t.k), e = 1 - (1 - q) * (1 - q), fx = t.from.x + (p.x - t.from.x) * e, fy = t.from.y + (p.y - hh - t.from.y) * e - Math.sin(Math.PI * q) * 50, ks = t.from.sc + (sc - t.from.sc) * e;
        ctx.save(); ctx.translate(fx, fy); ctx.rotate((1 - q) * (t.dizzyBack ? 6 : 0)); drawFriend(t.kind, ks, { mood: t.dizzyBack ? 9 : 0, grey: t.dizzyBack && q > 0.5 }); ctx.restore();
      } else if (t.status === 'spent') {
        ctx.strokeStyle = 'rgba(40,80,30,0.35)'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(p.x, p.y - 18, 14, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
      }
    });
  }
  function drawDragPreview(k) {
    var d = G.drag; if (!d || d.type !== 'friend') return;
    var kind = d.t.kind, w = toWorld(dropX(d), d.y - 70), lifted = d.y0 - d.y > 30 || Math.abs(d.x - d.x0) > 30, ok = lifted && G.state === 'build' && canDrop(G.W, w.x);
    if (ok) {
      var y = landing(G.W, kind, w.x), v = POLY[kind], lo = 1e9; v.forEach(function (p) { lo = Math.min(lo, p.y); });
      // 떨어질 자리: 반투명 친구 + 수직 점선 + 닿는 곳 그림자
      ctx.save(); ctx.globalAlpha = 0.35; ctx.translate(sx(w.x), sy(y)); drawFriend(kind, k, {}); ctx.restore();
      ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 3; ctx.setLineDash([4, 6]);
      ctx.beginPath(); ctx.moveTo(sx(w.x), d.y - 70 + (-lo) * k); ctx.lineTo(sx(w.x), sy(y + lo)); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(59,42,34,0.35)'; ctx.beginPath(); ctx.ellipse(sx(w.x), sy(y + lo), halfW(v) * k * 0.7, 4, 0, 0, Math.PI * 2); ctx.fill();
    }
    var tilt = Math.max(-0.26, Math.min(0.26, -G.dragVx * 0.03));
    ctx.save(); ctx.translate(d.x, d.y - 70); ctx.rotate(tilt); ctx.scale(1.08, 1.08); if (!ok) ctx.globalAlpha = 0.6; drawFriend(kind, k, { mood: ok ? 0 : 2, look: 'wide' }); ctx.restore();
    if (!ok && lifted) { ctx.strokeStyle = 'rgba(230,60,40,0.8)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(d.x - 10, d.y - 80); ctx.lineTo(d.x + 10, d.y - 60); ctx.moveTo(d.x + 10, d.y - 80); ctx.lineTo(d.x - 10, d.y - 60); ctx.stroke(); }
  }
  /** 첫 판 손가락 시연 (글 없음): ① 꽝돌을 끌어 받침에 ② 받침 쪽을 아래·뒤로 당기기 */
  function hand(x, y, press) {
    ctx.save(); ctx.globalAlpha = 0.9;
    ctx.fillStyle = 'rgba(255,255,255,0.95)'; ctx.strokeStyle = OL; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(x, y, press ? 13 : 15, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (press) { ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, 24, 0, Math.PI * 2); ctx.stroke(); }
    ctx.restore();
  }
  function drawTutorial(k) {
    G.tutAimDemo = 0;
    if (G.state !== 'build' || G.drag || G.tut.step === 0) return;
    if (G.tut.step === 1) {
      var want = stackFriends(G.W).length ? 'puff' : 'kwang', i = -1;
      G.tray.forEach(function (t, j) { if (i < 0 && t.status === 'ready' && t.kind === want) i = j; });
      if (i < 0) G.tray.forEach(function (t, j) { if (i < 0 && t.status === 'ready') i = j; }); if (i < 0) return;
      var a = slotPos(i), q = (G.t % 1.8) / 1.8, A = G.W.anchor, tx = sx(A.x), ty = sy(stackTop() + 1.0) + 70, demoKind = G.tray[i].kind;
      var e = q < 0.15 ? 0 : q > 0.75 ? 1 : (q - 0.15) / 0.6, ee = e * e * (3 - 2 * e), hx = a.x + (tx - a.x) * ee, hy = a.y - 20 + (ty - a.y + 20) * ee;
      if (q > 0.15 && q < 0.85) { ctx.save(); ctx.globalAlpha = 0.55; ctx.translate(hx, hy - 70); drawFriend(demoKind, k, {}); ctx.restore(); }
      hand(hx, hy, q > 0.12 && q < 0.8);
    } else if (G.tut.step === 2 && stackFriends(G.W).length && G.tut.idle > 1.2) {
      var g = groupOf(G.W), c = comOf(g); if (!c) return;
      var C = nextCloud(), dir = C && C.x < G.W.anchor.x ? -1 : 1;
      var q2 = (G.t % 2) / 2, e2 = q2 < 0.2 ? 0 : q2 > 0.8 ? 1 : (q2 - 0.2) / 0.6, x0 = Math.max(40, Math.min(Wl - 40, sx(c.x) + dir * 110)), y0 = Math.max(90, sy(c.y) - 70);
      G.tutAimDemo = e2 * (q2 < 0.9 ? 1 : 0);
      hand(x0 - dir * 18 * e2, y0 + 95 * e2, q2 > 0.18 && q2 < 0.9);
    }
  }

  /* ---------------- HUD·오버레이 ---------------- */
  var flagsEl = document.getElementById('flags'), scoreEl = document.getElementById('score'), over = document.getElementById('over'), card = document.getElementById('card');
  var FLAG = '<svg class="flag" viewBox="0 0 22 26" aria-hidden="true"><rect x="3" y="2" width="3" height="23" rx="1.5" fill="#6e4529"/><path d="M6 3 L20 7 L6 12 Z" fill="#57b8d9" stroke="#3b2a22" stroke-width="1.5" stroke-linejoin="round"/></svg>';
  function hud() {
    var h = ''; for (var i = 0; i < LEVEL.flags; i++) h += FLAG.replace('class="flag"', 'class="flag' + (i >= G.flags ? ' used' : '') + '"');
    if (flagsEl.innerHTML !== h) flagsEl.innerHTML = h;
    scoreEl.textContent = G.score;
  }
  /** 별: 하늘집 도착 ★ · 깃발 2개 이상 남김 ★ · 친구 전원 데려옴 ★ */
  function showWin() {
    var brought = G.tray.length, all = brought >= G.total, bonus = G.flags * 300 + (all ? 1000 : 0); G.score += bonus; hud();
    var n = 1 + (G.flags >= 2 ? 1 : 0) + (all ? 1 : 0), st = '';
    for (var i = 0; i < 3; i++) st += '<span class="' + (i < n ? 'on' : 'off') + '">★</span>';
    var prev = G.best, isBest = !prev || n > prev.stars || (n === prev.stars && G.score > prev.score);
    if (isBest) saveBest({ stars: n, score: G.score });
    var bestTxt = isBest ? '최고 기록!' : '최고 ' + '★'.repeat(prev.stars) + ' ' + prev.score;
    card.innerHTML = '<div class="stars">' + st + '</div><div class="big">' + G.score + '</div><div class="sub">데려온 친구 ' + brought + '/' + G.total + ' · 남은 깃발 ' + G.flags + '<br>' + bestTxt + '</div><div class="row"><button class="pill main" data-a="restart" aria-label="다시">↻</button><button class="pill" data-a="back" aria-label="목업 고르기로">←</button></div>';
    over.classList.add('show');
    for (var q = 0; q < n; q++) (function (q) { setTimeout(function () { SND.star(q); buzz(25); }, 350 * q + 150); })(q);
  }
  function showLose() {
    card.innerHTML = '<div class="stars"><span class="off">★</span><span class="off">★</span><span class="off">★</span></div><div class="big">' + G.score + '</div><div class="sub">구름 ' + G.W.stage + '/' + LEVEL.clouds.length + '까지 올라갔어요</div><div class="row"><button class="pill main" data-a="restart" aria-label="다시">↻ 다시</button><button class="pill" data-a="back" aria-label="목업 고르기로">←</button></div>';
    over.classList.add('show');
  }
  function hideOver() { over.classList.remove('show'); card.innerHTML = ''; }
  function goBack() { location.href = location.protocol === 'file:' ? 'index.html' : './'; }
  over.addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; audio(); if (b.dataset.a === 'restart') { firstRun = false; newGame(); } else goBack(); });
  document.getElementById('restart').addEventListener('click', function () { audio(); firstRun = false; ptr = null; newGame(); });
  document.getElementById('back').addEventListener('click', goBack);

  /* ---------------- 루프 ---------------- */
  var last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);   // 오류가 나도 루프가 멈추지 않게 먼저 예약
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (G) { update(dt); render(); }
  }
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);

  /* ---------------- 읽기 전용 관찰 창 (자동 검증용) ---------------- */
  function toClient(x, y) { var r = cv.getBoundingClientRect(); return { x: Math.round(r.left + x * s), y: Math.round(r.top + y * s) }; }
  function r3(v) { return Math.round(v * 1000) / 1000; }
  window.cloud = {
    snapshot: function () {
      var W = G.W, pl = W.plate.getPosition(), L = G.lastLaunch, C = nextCloud();
      return JSON.parse(JSON.stringify({
        state: G.state, stage: W.stage, flags: G.flags, score: G.score, aiming: G.aiming, p: r3(G.p), theta: r3(G.theta), step: W.step, tut: G.tut.step, welds: W.welds.length,
        friends: W.friends.map(function (b) { var c = b.getPosition(), v = b.getLinearVelocity(), cl = toClient(sx(c.x), sy(c.y)); return { id: b.ud.id, kind: b.ud.kind, state: b.ud.state, x: r3(c.x), y: r3(c.y), a: r3(b.getAngle()), v: r3(Math.hypot(v.x, v.y)), vy: r3(v.y), puffed: !!b.ud.puffed, mood: moodOf(b), sx: cl.x, sy: cl.y }; }),
        tray: G.tray.map(function (t, i) { var p = slotPos(i), cl = toClient(p.x, p.y - 24); return { id: t.id, kind: t.kind, status: t.status, sx: cl.x, sy: cl.y }; }),
        left: G.left.map(function (f) { return f.kind; }), total: G.total,
        plate: (function () { var cl = toClient(sx(pl.x), sy(pl.y)); return { x: r3(pl.x), y: r3(pl.y), a: r3(W.plate.getAngle()), sx: cl.x, sy: cl.y }; })(),
        anchor: W.anchor, next: C ? { x: C.x, top: C.top, w: C.w, house: !!C.house } : null,
        landT: r3(W.landT), result: G.result ? { stage: G.result.stage, n: G.result.stood.length, center: G.result.center } : null,
        lastLaunch: L ? { p: r3(L.p), theta: r3(L.theta), M: r3(L.M), n: L.n, kinds: L.kinds, boost: L.boost, kwang: L.kwang, maxTilt: r3(L.maxTilt), guide: L.guide.slice(0, 30).map(function (q) { return [q.x, q.y]; }), track: L.track.slice(0, 30).map(function (q) { return [q.x, q.y]; }) } : null,
        photo: !!G.photo, cam: { x: r3(cam.x), y: r3(cam.y), ppm: r3(cam.ppm) },
        over: over.classList.contains('show'), won: G.won
      }));
    },
    toClient: function (x, y) { return toClient(sx(x), sy(y)); },
    /** (읽기 전용) 지금 탑을 theta° 로 쏴서 무게중심이 (tx, ty) 를 지나려면 당길 비율 p */
    aimFor: function (theta, tx, ty) {
      var g = groupOf(G.W), c = comOf(g); if (!c) return null;
      var th = theta * Math.PI / 180, dx = tx - c.x, dy = ty - c.y, den = 2 * Math.pow(Math.cos(th), 2) * (dx * Math.tan(th) - dy);
      if (den <= 0) return 1;
      return Math.min(1, Math.sqrt(PHY.G * dx * dx / den) / launchSpeed(c.M, 1, boostOf(g)));
    },
    pullPx: PULL_FULL,
    scale: function () { return s; }
  };

  resize();
  newGame();
  requestAnimationFrame(frame);
})();
</script>
