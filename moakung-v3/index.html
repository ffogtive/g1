<title>모아쿵 손맛 비교</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<!--
  모아쿵! 손맛 비교 고르기 화면 (몽글탑 v0.4 · 빙글쿵 v0)
  가설: 같은 판에서 "쌓고 밀기(몽글탑)"와 "원 그려 모아 쿵(빙글쿵)"을 번갈아 해 보면 어느 쪽이 처음 보는 손맛인지 바로 판단할 수 있다.
-->
<style>
  :root { --ink:#3b2a22; --soft:#7a6252; --card:#fffaf3; --line:#e7d6c8; --a:#ff9a3c; --b:#57b8d9; color-scheme: light; }
  html, body { height:100%; }
  body { margin:0; background:linear-gradient(#a9dcff, #fff1cf); color:var(--ink); font-family:"Jua","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; }
  main { min-height:100%; box-sizing:border-box; display:flex; flex-direction:column; justify-content:center; gap:18px; max-width:440px; margin:0 auto; padding-block:24px; padding-inline:16px; }
  h1 { margin:0; text-align:center; font-weight:normal; font-size:34px; letter-spacing:1px; text-wrap:balance; }
  h1 small { display:block; font-size:16px; color:var(--soft); letter-spacing:0; margin-top:4px; }
  a.pick { display:grid; grid-template-columns:96px 1fr; gap:14px; align-items:center; text-decoration:none; color:inherit; background:var(--card); border-radius:22px; padding:14px; box-shadow:0 4px 0 var(--line), 0 10px 24px rgba(59,42,34,.12); }
  a.pick:active { transform:translateY(2px); box-shadow:0 2px 0 var(--line); }
  .badge { display:inline-grid; place-items:center; width:30px; height:30px; border-radius:50%; color:#fff; font-size:18px; margin-right:6px; vertical-align:middle; }
  .t { font-size:24px; }
  .d { color:var(--soft); font-size:15px; margin-top:4px; line-height:1.4; }
  svg { width:96px; height:96px; display:block; }
  .note { text-align:center; color:var(--soft); font-size:14px; line-height:1.5; }
</style>
<main>
  <h1>모아쿵! <small>어느 손맛이 더 좋아요?</small></h1>
  <a class="pick" href="tower.html">
    <svg viewBox="0 0 96 96" aria-hidden="true">
      <rect x="0" y="0" width="96" height="96" rx="18" fill="#dff3ff"/>
      <rect x="0" y="72" width="96" height="24" fill="#8fd36d"/>
      <rect x="18" y="58" width="22" height="16" rx="8" fill="#ff9a3c" stroke="#3b2a22" stroke-width="2.5"/>
      <rect x="21" y="22" width="16" height="36" rx="8" fill="#8fd14f" stroke="#3b2a22" stroke-width="2.5"/>
      <rect x="16" y="8" width="26" height="15" rx="5" fill="#a3acb6" stroke="#3b2a22" stroke-width="2.5"/>
      <rect x="56" y="54" width="18" height="18" rx="3" fill="#c98a4b" stroke="#7a4b22" stroke-width="2"/>
      <rect x="74" y="44" width="18" height="28" rx="3" fill="#9aa3ad" stroke="#4f5862" stroke-width="2"/>
      <path d="M46 34 q10 -10 20 0" fill="none" stroke="#3b2a22" stroke-width="3" stroke-linecap="round"/>
      <path d="M62 30 l6 4 -7 3" fill="none" stroke="#3b2a22" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div><div class="t"><span class="badge" style="background:var(--a)">A</span>몽글탑 <small style="font-size:14px;color:var(--soft)">v0.4</small></div><div class="d">끌어다 아슬아슬 쌓고, 스프링을 당겨 튕! 모아서 쿵!</div></div>
  </a>
  <a class="pick" href="circle.html">
    <svg viewBox="0 0 96 96" aria-hidden="true">
      <rect x="0" y="0" width="96" height="96" rx="18" fill="#9fd67a"/>
      <circle cx="48" cy="52" r="30" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="10 7" opacity=".9"/>
      <circle cx="48" cy="52" r="14" fill="#8a6a52" stroke="#3b2a22" stroke-width="2.5"/>
      <rect x="38" y="47" width="20" height="5" rx="2" fill="#1d1512"/>
      <circle cx="30" cy="30" r="4" fill="#b8b0a4"/><circle cx="70" cy="36" r="4" fill="#b8b0a4"/><circle cx="66" cy="74" r="4" fill="#b8b0a4"/>
      <path d="M80 22 a30 30 0 0 1 4 18" fill="none" stroke="#3b2a22" stroke-width="3" stroke-linecap="round"/>
      <path d="M79 37 l5 4 4 -6" fill="none" stroke="#3b2a22" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div><div class="t"><span class="badge" style="background:var(--b)">B</span>빙글쿵</div><div class="d">동그라미를 그려 모으고, 손을 떼면 쿵!</div></div>
  </a>
  <p class="note">설명 없이 바로 해 보세요.<br>각 화면 왼쪽 위 ←로 돌아와 바꿀 수 있어요.</p>
</main>
