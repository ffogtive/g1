<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>몽글탑 목업 v0.4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<!--
  모아쿵! 몽글탑 — 목업 v0.4 (진짜 물리 + 스프링 발사대)
  가설: v0.3의 "물리"는 계산식이라 가이드가 안 믿기고, 쌓기는 늘 정가운데라 긴장이 없고, 밀기 각도는 결과를 안 바꿨다.
        진짜 2D 물리(planck.js = Box2D)에 "끌어다 원하는 자리에 놓기"와 "스프링을 당겨 튕기기"를 붙이면 셋이 한꺼번에 풀린다.
  - 쌓기: 친구를 끌어 올려 놓으면 그 자리에 진짜로 얹힌다. 몽이는 10각 털뭉치라 비켜 놓으면 구르고, 길쭉은 높지만 밑이 좁고,
          꽝돌은 넓고 무거운 받침. 받침 밖으로 떨어지면 "어질" — 이번 발사엔 못 쓰고 트레이로 돌아온다.
  - 당기기: 탑 쪽을 눌러 아래·뒤로 당기면 스프링이 눌리고(당긴 길이 = 힘, 방향 = 각도) 받침이 발사 쪽으로 살짝 기운다.
          높고 좁은 탑을 낮게 쏘려고 오래 당기면 넘어갈 수 있다. 앞부분 점선 = 엔진과 같은 적분식이라 실제 비행과 겹친다.
  - 튕!: 탑이 통째로 같은 속도로 날아간다. 속도 = V·p·√(3/(3+무게)) → 많이 모을수록 세지만 덜 날아간다.
  - 쾅: 블록은 충격량만큼 금이 가고 깨진다. 왕두더지 양동이는 "왕 자리로 함께 쏟아진 친구 수와 무게×속도"로 벗겨진다
        (혼자는 '띵'뿐 · 둘이면 1개 · 셋이면 2개…) → 모아서 쿵!
  - 밸런스는 tools/sim.js 가 이 파일의 WORLD 블록을 그대로 돌려 확인한다.
-->
<style>
  :root { --ink:#3b2a22; --pill:rgba(255,255,255,.92); --line:#e7d6c8; --accent:#ff7a59; --gold:#ffc23a; color-scheme: light; }
  html, body { margin:0; height:100%; overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; touch-action:none; color:var(--ink); background:#a9dcff; font-family:"Jua","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; }
  #app { position:fixed; inset:0; display:flex; flex-direction:column; background:linear-gradient(#a9dcff, #e9f6ff 45%, #fff1cf);
    padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px); }
  #bar { flex:none; height:52px; display:flex; align-items:center; gap:8px; padding:0 10px; }
  .pill { min-width:44px; height:40px; border:0; border-radius:999px; background:var(--pill); box-shadow:0 2px 0 var(--line); font:inherit; font-size:20px; color:var(--ink); padding:0 12px; display:grid; place-items:center; cursor:pointer; }
  .pill:active { transform:translateY(1px); }
  #flags { flex:1; display:flex; gap:4px; align-items:center; min-width:0; }
  .flag { width:22px; height:26px; flex:none; transition:opacity .3s, transform .3s; }
  .flag.used { opacity:.22; transform:scale(.85); }
  #score { font-variant-numeric:tabular-nums; min-width:64px; }
  #stage { flex:1; position:relative; min-height:0; }
  canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block; }
  #over { position:absolute; inset:0; display:none; place-items:center; background:rgba(59,42,34,.35); z-index:5; }
  #over.show { display:grid; }
  .card { background:#fffaf3; border-radius:24px; padding:20px 24px; text-align:center; box-shadow:0 12px 40px rgba(59,42,34,.35); animation:pop .3s cubic-bezier(.2,1.5,.5,1); }
  @keyframes pop { from { transform:scale(.8); opacity:0; } }
  .stars { font-size:52px; letter-spacing:4px; line-height:1.1; }
  .stars span { display:inline-block; animation:starIn .45s cubic-bezier(.2,1.8,.5,1) both; }
  .stars span:nth-child(2) { animation-delay:.35s; } .stars span:nth-child(3) { animation-delay:.7s; }
  @keyframes starIn { from { transform:scale(0) rotate(-40deg); opacity:0; } }
  .stars .on { color:var(--gold); text-shadow:0 3px 0 #d8962a; } .stars .off { color:#e3d6c9; }
  .big { font-size:30px; margin:6px 0 4px; font-variant-numeric:tabular-nums; }
  .sub { font-size:15px; color:#8a6a5a; margin-bottom:14px; }
  .row { display:flex; gap:10px; justify-content:center; }
  .row .pill { font-size:24px; height:52px; min-width:72px; }
  .row .pill.main { background:var(--accent); color:#fff; box-shadow:0 3px 0 #c9553a; }
  #err { position:absolute; inset:0; display:none; place-items:center; padding:24px; text-align:center; font-size:18px; z-index:9; background:#fff1cf; }
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <button id="back" class="pill" aria-label="목업 고르기로">←</button>
    <div id="flags" aria-label="남은 발사"></div>
    <div id="score" class="pill" aria-label="점수">0</div>
    <button id="restart" class="pill" aria-label="다시">↻</button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="over"><div class="card" id="card"></div></div>
    <div id="err">물리 엔진(vendor/planck.min.js)을 불러오지 못했어요.<br>폴더째 열었는지 확인해 주세요.</div>
  </div>
</div>
<script src="vendor/planck.min.js"></script>
<script>
/*WORLD-START*/
// 몽글탑 v0.4 물리 규칙 — 목업(tower.html)과 계산기(tools/sim.js)가 이 블록을 그대로 같이 쓴다.
// 결정론: 이 안에는 무작위·시각 의존이 없다 (같은 입력 → 같은 결과).
var PL = planck;
var PHY = {
  G: 10, DT: 1 / 60, VI: 10, PI: 6,
  V_MAX: 22, M0: 3, P_MIN: 0.15, ANG_MIN: 20, ANG_MAX: 75,      // 발사 속도 = V_MAX·p·√(M0/(M0+M)) : 많이 모을수록 세게 치지만 덜 날아감
  PULL_X: 0.15, PULL_Y: 0.55, PULL_V: 1.6, PULL_A: 6, TILT: 0.06, // 당기면 받침이 뒤·아래로 (m), 받침 속도·가속 상한, 조준 기울기(°/°)
  PLATE: { x: 0, y: 1.0, hw: 0.75, hh: 0.1, mass: 3, kx: 2500, cx: 87, ky: 900, cy: 30, kr: 300, cr: 10.5 },
  VN_MIN: 1.5, J0: 1.5, T: { W: 4, S: 8 }, HP: { W: 2, S: 3 }, DMG_MAX: 2, WIN_BLOCK: 0.15,
  K_P: 10, KING_ZONE: 0.7, ZONE_V: 3, WIN_KING: 0.4, KING_CD: 0.4, KING_FALL_VN: 3,
  PUFF_R: 1.6, PUFF_IMP: 6, PUFF_DMG: 2, PUFF_ARM: 0.1,
  NOCOLL_T: 0.5, GUIDE_T0: 0.1, GUIDE_T1: 0.55, QUIET_V: 0.12, QUIET_W: 0.3
};
var CAT = { GROUND: 1, PLATE: 2, FRIEND: 4, BLOCK: 8, KING: 16, MOLE: 32 };
// 몸 = 성격: 몽이(10각 털뭉치, 구름) · 부풀(12각 가시) · 길쭉(높지만 밑이 좁음) · 꽝돌(넓고 무거운 받침)
var DIMS = {
  mong:  { shape: 'ngon', n: 10, r: 0.46, density: 1.0, friction: 0.8, rest: 0.35, angDamp: 1.5 },
  puff:  { shape: 'ngon', n: 12, r: 0.40, density: 1.0, friction: 0.8, rest: 0.2, angDamp: 1.0 },
  gil:   { shape: 'capsule', w: 0.62, h: 2.3, rb: 0.07, rt: 0.22, density: 0.8, friction: 0.8, rest: 0.1, angDamp: 0.3 },
  kwang: { shape: 'rbox', w: 1.3, h: 0.8, r: 0.14, density: 2.5, friction: 0.8, rest: 0.05, angDamp: 0.3 }
};
var LEVEL = {
  roster: ['kwang', 'gil', 'mong', 'kwang', 'mong', 'gil', 'mong', 'puff', 'kwang', 'mong'],
  flags: 4, buckets: 3,
  cols: [{ x: 6.0, cells: 'WW', mole: true }, { x: 7.2, cells: 'SW' }, { x: 8.4, cells: 'W', mole: true }],
  pedestal: { x: 10.3, w: 2.4, h: 0.5 },
  king: { r: 0.85, density: 2.5 }
};

function ngon(n, r) { var v = []; for (var i = 0; i < n; i++) { var a = -Math.PI / 2 + Math.PI / n + i * 2 * Math.PI / n; v.push({ x: r * Math.cos(a), y: r * Math.sin(a) }); } return v; }
function polyOf(kind) {
  var d = DIMS[kind];
  if (d.shape === 'ngon') return ngon(d.n, d.r);
  var w = d.w / 2, h = d.h / 2, s = Math.SQRT1_2;
  if (d.shape === 'capsule') {
    var rb = d.rb, rt = d.rt;
    return [{ x: -w + rb, y: -h }, { x: w - rb, y: -h }, { x: w, y: -h + rb }, { x: w, y: h - rt }, { x: w - rt + rt * s, y: h - rt + rt * s }, { x: w - rt, y: h },
      { x: -w + rt, y: h }, { x: -w + rt - rt * s, y: h - rt + rt * s }, { x: -w, y: h - rt }, { x: -w, y: -h + rb }];
  }
  var r = d.r;
  return [{ x: -w + r, y: -h }, { x: w - r, y: -h }, { x: w, y: -h + r }, { x: w, y: h - r }, { x: w - r, y: h }, { x: -w + r, y: h }, { x: -w, y: h - r }, { x: -w, y: -h + r }];
}
var POLY = {}; ['mong', 'puff', 'gil', 'kwang'].forEach(function (k) { POLY[k] = polyOf(k); });
function halfW(v) { var m = 0; v.forEach(function (p) { m = Math.max(m, Math.abs(p.x)); }); return m; }
/** 다각형 아래쪽 윤곽: x = dx 세로선과 만나는 가장 낮은 y (없으면 null) */
function lowY(v, dx) {
  var best = null;
  for (var i = 0; i < v.length; i++) {
    var a = v[i], b = v[(i + 1) % v.length];
    if ((a.x - dx) * (b.x - dx) <= 0 && a.x !== b.x) { var y = a.y + (dx - a.x) / (b.x - a.x) * (b.y - a.y); if (best === null || y < best) best = y; }
  }
  return best;
}
function polyFix(body, verts, o) {
  return body.createFixture(new PL.Polygon(verts), { density: o.density, friction: o.friction, restitution: o.rest || 0, filterCategoryBits: o.cat, filterMaskBits: o.mask == null ? 0xffff : o.mask });
}

function mkWorld(level) {
  level = level || LEVEL;
  var world = new PL.World({ gravity: { x: 0, y: -PHY.G } });
  var W = { world: world, level: level, step: 0, t: 0, friends: [], blocks: [], moles: [], hitQ: [], killQ: [], boomQ: [], events: [], damageOn: false,
    buckets: level.buckets, kingWin: null, kingCD: 0, kingFell: false, launch: null, nextId: 100,
    aim: { on: false, p: 0, theta: 45, want: { x: 0, y: 0 }, off: { x: 0, y: 0 }, vel: { x: 0, y: 0 }, tilt: 0, wantTilt: 0, fast: false, fire: false } };
  var ground = world.createBody();
  ground.createFixture(new PL.Box(60, 1, { x: 10, y: -1 }, 0), { friction: 0.8, filterCategoryBits: CAT.GROUND });
  ground.ud = { type: 'ground' }; W.ground = ground;
  var P = PHY.PLATE;
  var plate = world.createBody({ type: 'dynamic', position: { x: P.x, y: P.y }, gravityScale: 0 });
  plate.createFixture(new PL.Box(P.hw, P.hh), { density: P.mass / (4 * P.hw * P.hh), friction: 0.9, filterCategoryBits: CAT.PLATE, filterMaskBits: CAT.FRIEND });
  plate.setSleepingAllowed(false); plate.ud = { type: 'plate' }; W.plate = plate;
  level.cols.forEach(function (c, ci) {
    for (var i = 0; i < c.cells.length; i++) addBlock(W, c.cells[i], c.x, 0.5 + i, 1, 1);
    if (c.mole) {
      var m = world.createBody({ type: 'dynamic', position: { x: c.x, y: c.cells.length + 0.3 * Math.cos(Math.PI / 10) } });
      polyFix(m, ngon(10, 0.3), { density: 0.6, friction: 0.8, cat: CAT.MOLE });
      m.ud = { type: 'mole', id: 'm' + ci }; W.moles.push(m);
    }
  });
  var pd = level.pedestal;
  W.pedestal = addBlock(W, 'S', pd.x, pd.h / 2, pd.w, pd.h);
  var kr = level.king.r, king = world.createBody({ type: 'dynamic', position: { x: pd.x, y: pd.h + kr * Math.cos(Math.PI / 12) } });
  polyFix(king, ngon(12, kr), { density: level.king.density, friction: 0.8, rest: 0.05, cat: CAT.KING });
  king.ud = { type: 'king' }; W.king = king;
  world.on('pre-solve', function (c) { preSolve(W, c); });
  world.on('post-solve', function (c, imp) { postSolve(W, c, imp); });
  for (var s = 0; s < 180; s++) stepW(W);   // 요새가 제자리를 잡을 때까지 (피해 없음)
  W.events.length = 0; W.hitQ.length = 0; W.damageOn = true;
  return W;
}
function addBlock(W, m, x, y, w, h) {
  var b = W.world.createBody({ type: 'dynamic', position: { x: x, y: y } });
  b.createFixture(new PL.Box(w / 2, h / 2), { density: m === 'S' ? 2.0 : 0.7, friction: 0.7, restitution: 0.05, filterCategoryBits: CAT.BLOCK });
  b.ud = { type: 'block', m: m, hp: PHY.HP[m] + (w * h > 1.2 ? 1 : 0), max: PHY.HP[m] + (w * h > 1.2 ? 1 : 0), w: w, h: h, id: 'b' + W.blocks.length };
  W.blocks.push(b); return b;
}
function addFriend(W, kind, x, y, id) {
  var d = DIMS[kind];
  var b = W.world.createBody({ type: 'dynamic', position: { x: x, y: y }, angularDamping: d.angDamp });
  polyFix(b, POLY[kind], { density: d.density, friction: d.friction, rest: d.rest, cat: CAT.FRIEND });
  b.ud = { type: 'friend', kind: kind, id: id == null ? W.nextId++ : id, state: 'stack', fell: false };
  W.friends.push(b); return b;
}
function removeFriend(W, b) { W.friends = W.friends.filter(function (f) { return f !== b; }); b.ud.dead = true; W.world.destroyBody(b); }
function stackFriends(W) { return W.friends.filter(function (b) { return b.ud.state === 'stack'; }); }

/** 아래로 광선: x 에서 처음 닿는 받침·쌓인 친구·땅·블록의 높이 */
function rayDown(W, x) {
  var best = 1, top = 30, bot = -2;
  W.world.rayCast({ x: x, y: top }, { x: x, y: bot }, function (fx, pt, n, frac) {
    var u = fx.getBody().ud;
    if (u && u.type === 'friend' && u.state !== 'stack') return -1;
    if (frac < best) best = frac;
    return frac;
  });
  return top + (bot - top) * best;
}
/** 친구를 x 에 내려놓을 때 몸 중심 높이: 몸 폭 곳곳에서 아래 윤곽과 닿는 곳 중 가장 높은 곳 + 0.04m (살짝 떨어뜨림) */
function landing(W, kind, x) {
  var v = POLY[kind], hw = halfW(v), best = -1e9;
  [-0.95, -0.66, -0.33, 0, 0.33, 0.66, 0.95].forEach(function (k) {
    var dx = k * hw, ly = lowY(v, dx); if (ly === null) return;
    best = Math.max(best, rayDown(W, x + dx) - ly);
  });
  return best + 0.04;
}
function canDrop(W, x) { var p = W.plate.getPosition(); return Math.abs(x - p.x) <= PHY.PLATE.hw + 0.3; }

/* ---------------- 접촉: 반발·피해 ---------------- */
function preSolve(W, c) {
  var A = c.getFixtureA().getBody(), B = c.getFixtureB().getBody(), a = A.ud || {}, b = B.ud || {};
  // 발사 직후 받침이 튕겨 오를 때 날아가는 친구와 부딪치지 않게
  if ((a.type === 'plate' && b.state === 'fly') || (b.type === 'plate' && a.state === 'fly')) { var lf = a.type === 'plate' ? b : a; if (W.t - lf.flyT0 < PHY.NOCOLL_T) { c.setEnabled(false); return; } }
  // 쌓는 동안은 통통 튀지 않게 (튕! 뒤 날아가는 친구만 원래 반발)
  if ((a.type === 'friend' && a.state !== 'fly') || (b.type === 'friend' && b.state !== 'fly')) c.setRestitution(0);
  var wm = c.getWorldManifold(null);
  if (!wm || !c.getManifold().pointCount) return;
  var p = wm.points[0], va = A.getLinearVelocityFromWorldPoint(p), vb = B.getLinearVelocityFromWorldPoint(p);
  var vn = (va.x - vb.x) * wm.normal.x + (va.y - vb.y) * wm.normal.y;   // 다가오는 속도 (+)
  c._vn = Math.max(c._vn && c._step === W.step ? c._vn : 0, vn); c._step = W.step;
}
function postSolve(W, c, imp) {
  var n = c.getManifold().pointCount, J = 0;
  for (var i = 0; i < n; i++) J = Math.max(J, imp.normalImpulses[i] || 0);
  if (J <= 0) return;
  W.hitQ.push({ a: c.getFixtureA().getBody(), b: c.getFixtureB().getBody(), J: J, vn: c._step === W.step ? c._vn || 0 : 0 });
}
function processHits(W) {
  var q = W.hitQ; W.hitQ = [];
  q.forEach(function (e) {
    if (!e.a.ud || !e.b.ud || e.a.ud.dead || e.b.ud.dead) return;
    hitOne(W, e.a, e.b, e); hitOne(W, e.b, e.a, e);
  });
}
function hitOne(W, tb, sb, e) {
  var T = tb.ud, S = sb.ud;
  if (T.type === 'friend') {
    if (e.J > 0.6 && e.vn > 1) W.events.push({ type: 'friendHit', body: tb, J: e.J });
    if (T.state === 'fly' && S.type === 'friend' && S.zoned && !T.zoned && e.vn >= PHY.VN_MIN) T.hitSeat = true;   // 왕 위에 쌓인 친구 위로 쏟아져도 왕 자리로
    if (T.kind === 'puff' && T.state === 'fly' && !T.boom && W.t - T.flyT0 >= PHY.PUFF_ARM && S.type !== 'friend' && S.type !== 'plate') { T.boom = true; W.boomQ.push(tb); }
    return;
  }
  if (!W.damageOn) return;
  if (T.type === 'block') {
    if (tb === W.pedestal && S.type === 'friend' && S.state === 'fly') S.hitSeat = true;   // 왕 받침을 친 것도 왕 자리로
    if (e.vn < PHY.VN_MIN || S.type === 'plate') return;
    blockHit(W, tb, e.J);
  } else if (T.type === 'king') {
    if (S.type === 'friend' && S.state === 'fly' && e.vn > 0.5) kingHit(W, e.J);
    else if (S.type === 'ground' && e.vn >= PHY.KING_FALL_VN && !W.kingFell && W.buckets > 0) { W.kingFell = true; popBuckets(W, 1, 'fall'); }
  } else if (T.type === 'mole') {
    if (!T.ko && ((e.vn >= PHY.VN_MIN && e.J >= 1) || S.type === 'ground')) moleKO(W, tb);
  }
}
function blockHit(W, b, J) {
  var u = b.ud, w = u.win;
  if (!w || W.t - w.t0 > PHY.WIN_BLOCK) w = u.win = { t0: W.t, J: 0, done: 0 };
  w.J += J;   // 같은 블록에 짧은 시간에 들어온 충격은 합친다 (탑 = 합쳐서 침)
  var tot = Math.min(PHY.DMG_MAX, Math.max(0, Math.floor((w.J - PHY.J0) / PHY.T[u.m])));
  if (tot > w.done) damage(W, b, tot - w.done), w.done = tot;
}
function damage(W, b, d) {
  var u = b.ud; if (u.dead || u.hp <= 0) return;
  u.hp = Math.max(0, u.hp - d);
  var p = b.getPosition();
  W.events.push({ type: u.hp > 0 ? 'blockHit' : 'blockBreak', body: b, m: u.m, d: d, hp: u.hp, x: p.x, y: p.y, w: u.w, h: u.h });
  if (u.hp <= 0) { u.dead = true; W.killQ.push(b); }
}

      var th = theta * Math.PI / 180, dx = tx - c.x, dy = ty - c.y, den = 2 * Math.pow(Math.cos(th), 2) * (dx * Math.tan(th) - dy);
      if (den <= 0) return 1;
      return Math.min(1, Math.sqrt(PHY.G * dx * dx / den) / launchSpeed(c.M, 1));
    },
    pullPx: PULL_FULL,
    scale: function () { return s; }
  };

  resize();
  newGame();
  requestAnimationFrame(frame);
})();
</script>
