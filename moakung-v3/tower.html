<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>몽글탑 목업 v0.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<!--
  모아쿵! 몽글탑 — 목업 v0.2 (판 1개를 깊게)
  가설: 친구를 "한 번 쓰면 끝인 카드"로 만들고, 무게·바닥 면적에 따라 쌓을수록 흔들리게 하면
        "누구를 지금 쓰고 누구를 아낄까"(머리)와 "하나만 더 올릴까?"(손의 긴장)가 생긴다.
  - 흔들림: 이음새마다 (위 무게 × 무게중심 높이) ÷ 받치는 폭. 한계를 넘으면 가장 약한 이음새 위가 뒤로 쏟아져 그 친구들을 잃는다.
  - 넘어지는 친구는 밑동을 축으로 원호를 그린다. 앞에 원호보다 높은 벽이 있으면 거기 걸린다 → 벽을 먼저 열어야 왕두더지에 닿는다.
  - 미리보기(아이콘·원호·떨림)와 실제 착지는 같은 simulate() 결과 → 항상 일치.
  - 판 구성은 전수 탐색으로 확인: 최선 = 친구 4마리 남기고 승리, 첫 밀기 후보의 37%가 이길 수 있는 길.
-->
<style>
  :root { --ink:#3b2a22; --pill:rgba(255,255,255,.92); --line:#e7d6c8; --accent:#ff7a59; --gold:#ffc23a; color-scheme: light; }
  html, body { margin:0; height:100%; overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; touch-action:none; color:var(--ink); background:#a9dcff; font-family:"Jua","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; }
  #app { position:fixed; inset:0; display:flex; flex-direction:column; background:linear-gradient(#a9dcff, #e9f6ff 45%, #fff1cf);
    padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px); }
  #bar { flex:none; height:52px; display:flex; align-items:center; gap:8px; padding:0 10px; }
  .pill { min-width:44px; height:40px; border:0; border-radius:999px; background:var(--pill); box-shadow:0 2px 0 var(--line); font:inherit; font-size:20px; color:var(--ink); padding:0 12px; display:grid; place-items:center; cursor:pointer; }
  .pill:active { transform:translateY(1px); }
  #lives { flex:1; display:flex; gap:2px; align-items:center; min-width:0; }
  .dot { width:11px; height:11px; flex:none; border-radius:50%; border:1.5px solid #3b2a22; box-sizing:border-box; }
  .dot.used { opacity:.25; }
  #score { font-variant-numeric:tabular-nums; min-width:64px; }
  #stage { flex:1; position:relative; min-height:0; }
  canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block; }
  #over { position:absolute; inset:0; display:none; place-items:center; background:rgba(59,42,34,.35); z-index:5; }
  #over.show { display:grid; }
  .card { background:#fffaf3; border-radius:24px; padding:20px 24px; text-align:center; box-shadow:0 12px 40px rgba(59,42,34,.35); animation:pop .3s cubic-bezier(.2,1.5,.5,1); }
  @keyframes pop { from { transform:scale(.8); opacity:0; } }
  .stars { font-size:52px; letter-spacing:4px; line-height:1.1; }
  .stars span { display:inline-block; animation:starIn .45s cubic-bezier(.2,1.8,.5,1) both; }
  .stars span:nth-child(2) { animation-delay:.35s; } .stars span:nth-child(3) { animation-delay:.7s; }
  @keyframes starIn { from { transform:scale(0) rotate(-40deg); opacity:0; } }
  .stars .on { color:var(--gold); text-shadow:0 3px 0 #d8962a; } .stars .off { color:#e3d6c9; }
  .big { font-size:30px; margin:6px 0 4px; font-variant-numeric:tabular-nums; }
  .sub { font-size:15px; color:#8a6a5a; margin-bottom:14px; }
  .row { display:flex; gap:10px; justify-content:center; }
  .row .pill { font-size:24px; height:52px; min-width:72px; }
  .row .pill.main { background:var(--accent); color:#fff; box-shadow:0 3px 0 #c9553a; }
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <button id="back" class="pill" aria-label="목업 고르기로">←</button>
    <div id="lives" aria-label="남은 친구"></div>
    <div id="score" class="pill" aria-label="점수">0</div>
    <button id="restart" class="pill" aria-label="다시">↻</button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="over"><div class="card" id="card"></div></div>
  </div>
</div>
<script>
/*RULES-START*/
// 몽글탑 v0.2 규칙 (목업과 계산기가 같이 씀)
var KIND = {
  mong:  { h: 1.0, wb: 0.5,  wt: 0.5,  m: 1.0 },
  gil:   { h: 2.5, wb: 0.6,  wt: 0.55, m: 1.2 },
  kwang: { h: 1.0, wb: 1.3,  wt: 1.2,  m: 3.0 },
  puff:  { h: 0.8, wb: 0.4,  wt: 0.35, m: 0.5 }
};
var RULE = { LIMIT: 24, STUMP: 0.6, KING: 5, KING_END: 6, KWANG2: 3 };   // 왕두더지는 5·6번 칸(2칸 너비)
/** 탑 흔들림: 이음새마다 (위 무게 × 무게중심 높이) ÷ 받치는 폭. R = 최댓값 / LIMIT, R > 1 이면 가장 약한 이음새 위가 무너짐 */
function stability(kinds) {
  var n = kinds.length, B = [], b = 0, best = 0, weak = -1, T = [];
  for (var i = 0; i < n; i++) { B.push(b); b += KIND[kinds[i]].h; }
  for (var j = 0; j < n; j++) {
    var S = j === 0 ? KIND[kinds[0]].wb + RULE.STUMP : Math.min(KIND[kinds[j - 1]].wt, KIND[kinds[j]].wb);
    var mom = 0;
    for (var k = j; k < n; k++) { var K = KIND[kinds[k]]; mom += K.m * (B[k] + K.h / 2 - B[j]); }
    var t = mom / S; T.push(t);
    if (t > best) { best = t; weak = j; }
  }
  return { R: best / RULE.LIMIT, weak: weak, T: T, top: b };
}
/** 넘어지는 친구(중심 높이 c)는 밑동을 축으로 원호를 그린다. 착지 칸보다 앞에 원호보다 높은 기둥이 있으면 거기 걸린다 */
function blockAt(cols, c) {
  var land = Math.floor(c);
  for (var j = 0; j < Math.min(land, RULE.KING); j++) {
    var H = cols[j].cells.length;
    if (!H) continue;
    var y = Math.sqrt(Math.max(0, c * c - j * j));
    if (y < H + 0.5) return j;
  }
  return -1;
}
function simulate(cols0, buckets, kinds) {
  var cols = cols0.map(function (c) { return { cells: c.cells.slice(), mole: c.mole }; });
  var bk = buckets, base = 0, ev = [];
  function hit(col, kind, lvl) {
    var h = { col: col, broke: [], mole: false, bucket: false, clang: false, ding: false, miss: false };
    if (col > RULE.KING_END || col < 0) { h.miss = true; return h; }
    if (col >= RULE.KING) {
      h.col = RULE.KING;
      // 양동이: 꽝돌은 1개(KWANG2 레벨 이상 높이면 한 방에 2개), 몽이는 3층(레벨 2) 이상이면 1개, 길쭉·부풀은 못 벗김
      var n = kind === 'kwang' ? (lvl >= RULE.KWANG2 ? 2 : 1) : kind === 'mong' ? (lvl >= 2 ? 1 : 0) : 0;   // 부풀 폭발은 양동이를 못 벗김
      var take = Math.min(n, bk);
      if (take) { bk -= take; h.bucket = take; } else h.clang = true;
      return h;
    }
    var c = cols[col], top = function () { return c.cells[c.cells.length - 1]; };
    if (kind === 'kwang') { for (var a = 0; a < 2 && c.cells.length; a++) h.broke.push(c.cells.pop()); }
    else if (kind === 'puff') { if (c.cells.length) h.broke.push(c.cells.pop()); }
    else {
      var p = kind === 'mong' ? 1 + (lvl >> 1) : 1;
      for (var q = 0; q < p && c.cells.length && top() === 'W'; q++) h.broke.push(c.cells.pop());
      if (!h.broke.length && c.cells.length) h.ding = true;
    }
    if ((h.broke.length || !c.cells.length) && c.mole) { c.mole = false; h.mole = true; }
    return h;
  }
  kinds.forEach(function (kind, i) {
    var K = KIND[kind], c = base + K.h / 2, hits = [], blk = blockAt(cols, c), span = null, land;
    if (kind === 'gil') {
      if (blk >= 0) span = [blk, blk + 1]; else span = [Math.floor(base + 1e-6), Math.floor(base + K.h - 1e-6)];
      for (var x = span[0]; x <= span[1]; x++) hits.push(hit(x, kind, i));
      land = blk >= 0 ? blk : Math.floor(base + K.h / 2);
    } else {
      land = blk >= 0 ? blk : Math.floor(c);
      if (kind === 'puff') { var r = i >= 3 ? 2 : 1; span = [land - r, land + r]; for (var y2 = land - r; y2 <= land + r; y2++) if (y2 >= 0 && y2 < RULE.KING) hits.push(hit(y2, kind, i)); }   // 높을수록 크게 터짐(반경 1→2), 벽만 부숨
      else hits.push(hit(land, kind, i));
    }
    ev.push({ i: i, kind: kind, base: base, center: c, land: land, blocked: blk >= 0, span: span, hits: hits });
    base += K.h;
  });
  return { ev: ev, cols: cols, buckets: bk };
}
/*RULES-END*/

(function () {
  'use strict';
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d'), stage = document.getElementById('stage');
  var C = 44, MAX_TOWER = 6;
  // 그림용 정보 (규칙 KIND 와 별개)
  var LOOK = {
    mong:  { w: 0.92, col: '#ff9a3c', dark: '#c8631a', name: '몽이' },
    gil:   { w: 0.66, col: '#8fd14f', dark: '#4f9a24', name: '길쭉' },
    kwang: { w: 1.3,  col: '#a3acb6', dark: '#5e6873', name: '꽝돌' },
    puff:  { w: 0.86, col: '#ff5d5d', dark: '#c8302f', name: '부풀' }
  };
  var ROSTER = ['kwang', 'mong', 'gil', 'mong', 'kwang', 'puff', 'mong', 'gil', 'kwang', 'mong', 'gil', 'mong'];   // 꽝돌3 길쭉3 몽이5 부풀1
  var BOARD = [['W', 'W'], ['S', 'W'], ['W', 'W', 'W'], ['W', 'S'], ['W', 'W', 'S', 'S']];                     // 4번 = 왕두더지 앞 벽 (꼭대기 돌)
  var BUCKETS = 3;
  var BEST_KEY = 'mongle.v02.best';

  /* ---------------- 레이아웃 ---------------- */
  var s = 1, dpr = 1, Wl = 390, Hl = 760, ox = 0, groundY = 500, hillTop = 530, pivotX = 64, towerX = 40;
  function resize() {
    var r = stage.getBoundingClientRect();
    if (r.width < 10 || r.height < 10) return;
    dpr = Math.min(2.5, window.devicePixelRatio || 1);
    s = Math.min(r.width / 390, r.height / 700);
    Wl = r.width / s; Hl = r.height / s; ox = (Wl - 390) / 2;
    hillTop = Hl - 210; groundY = hillTop - 30;
    pivotX = ox + 64; towerX = ox + 40;
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    if (G) G.friends.forEach(function (f) { var h = homeOf(f.home); f.hx = h.x; f.hy = h.y; if (f.state === 'hill') { f.x = h.x; f.y = h.y; } });
  }
  function homeOf(i) { var row = i < 6 ? 0 : 1, k = row ? i - 6 : i; return { x: ox + 36 + k * 64 + (row ? 30 : 0), y: hillTop + (row ? 186 : 98) }; }
  function colX(c) { return pivotX + (c + 0.5) * C; }
  var KING_X = function () { return pivotX + (RULE.KING + 1) * C; };   // 왕두더지 가운데 (5·6번 칸 사이)
  function kingTopY() { return groundY - 60 - G.buckets * 13; }   // 쌓인 양동이 맨 위 (양동이 0개면 머리 꼭대기)
  function colTop(c) { return c < RULE.KING ? groundY - G.cols[c].cells.length * C : kingTopY(); }

  /* ---------------- 상태 ---------------- */
  var G = null, firstRun = true;
  function loadBest() { try { return JSON.parse(localStorage.getItem(BEST_KEY) || 'null'); } catch (e) { return null; } }
  function saveBest(b) { try { localStorage.setItem(BEST_KEY, JSON.stringify(b)); } catch (e) { /* 무시 */ } }
  function newGame() {
    G = {
      state: 'build', score: 0, buckets: BUCKETS, angle: 0, angleV: 0,
      cols: BOARD.map(function (c) { return { cells: c.slice(), mole: true }; }),
      friends: ROSTER.map(function (k, i) { var h = homeOf(i); return { id: i, kind: k, home: i, state: 'hill', x: h.x, y: h.y, hx: h.x, hy: h.y, bob: Math.random() * 6, sq: 0 }; }),
      tower: [], drag: null, simKey: '', sim: null, stab: { R: 0, weak: -1 }, t: 0,
      fx: [], pops: [], freeze: 0, shake: 0, slow: 1, zoom: 0, idleT: 0, ghost: firstRun, boarded: false, pushTotal: 0, ko: 0, best: loadBest()
    };
    hideOver(); hud();
  }
  function friendsLeft() { return G.friends.filter(function (f) { return f.state === 'hill' || f.state === 'tower' || f.state === 'board' || f.state === 'unboard'; }).length; }
  function towerKinds() { return G.tower.map(function (f) { return f.kind; }); }
  function currentSim() {
    var key = towerKinds().join(',') + '|' + G.cols.map(function (c) { return c.cells.join('') + (c.mole ? 'm' : ''); }).join('/') + '|' + G.buckets;
    if (key !== G.simKey) { G.simKey = key; G.sim = simulate(G.cols, G.buckets, towerKinds()); G.stab = stability(towerKinds()); }
    return G.sim;
  }

  /* ---------------- 소리·진동 ---------------- */
  var AC = null;
  function audio() { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) { AC = null; } }
  function tone(type, f0, f1, dur, vol, delay) {
    if (!AC) return;
    try {
      var t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (e) { /* 무시 */ }
  }
  function noise(dur, vol, freq, type) {
    if (!AC) return;
    try {
      var n = Math.floor(AC.sampleRate * dur), b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
      var src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
      src.buffer = b; f.type = type || 'lowpass'; f.frequency.value = freq || 900; g.gain.value = vol;
      src.connect(f); f.connect(g); g.connect(AC.destination); src.start();
    } catch (e) { /* 무시 */ }
  }
  var SND = {
    board: function (lvl, heavy) { var f = [523, 587, 659, 698, 784, 880][Math.min(5, lvl)]; tone('sine', f, 0, 0.14, 0.25); tone('triangle', f * 2, 0, 0.08, 0.06); if (heavy) { tone('sine', 140, 70, 0.18, 0.4); noise(0.08, 0.15, 400); } },
    unboard: function () { tone('sine', 660, 330, 0.12, 0.15); },
    creak: function (r) { tone('sawtooth', 90 + r * 60, 70 + r * 40, 0.22, 0.03 + r * 0.05); },
    tick: function (a) { tone('square', 120 + a * 6, 90, 0.03, 0.03 + a * 0.004); },
    latch: function () { tone('square', 900, 600, 0.04, 0.12); tone('sine', 300, 0, 0.06, 0.2); },
    thud: function (p) { tone('sine', 140 + p * 10, 40, 0.32, Math.min(0.9, 0.4 + p * 0.15)); noise(0.18, 0.28 + p * 0.08, 500 + p * 200); tone('triangle', 1800, 900, 0.05, 0.06); },
    crack: function (stone) { noise(0.12, 0.35, stone ? 2400 : 1500, 'bandpass'); tone('square', stone ? 220 : 160, 80, 0.07, 0.1); },
    ding: function () { tone('triangle', 1500, 0, 0.18, 0.18); tone('sine', 2250, 0, 0.12, 0.08); },
    clang: function () { [700, 943, 1210, 1580].forEach(function (f, i) { tone('square', f, f * 0.98, 0.45 - i * 0.06, 0.05); }); },
    boom: function () { noise(0.5, 0.6, 700); tone('sine', 90, 30, 0.6, 0.8); },
    tang: function () { tone('triangle', 1900, 1700, 0.1, 0.15); },
    pop: function () { tone('sine', 500, 1300, 0.09, 0.2); },
    swoosh: function () { noise(0.25, 0.12, 2400); },
    whiff: function () { noise(0.3, 0.1, 1800, 'bandpass'); },
    collapse: function () { noise(0.6, 0.5, 600); [300, 240, 180].forEach(function (f, i) { tone('triangle', f, f * 0.7, 0.2, 0.15, i * 0.12); }); },
    ko: function () { tone('sine', 220, 60, 0.9, 0.6); noise(0.4, 0.4, 900); [784, 988, 1175, 1568].forEach(function (f, i) { tone('triangle', f, 0, 0.25, 0.16, 0.5 + i * 0.1); }); },
    star: function (i) { tone('triangle', [1046, 1318, 1568][i], 0, 0.3, 0.22); tone('sine', [2093, 2637, 3136][i], 0, 0.15, 0.06); },
    lose: function () { [392, 330, 262].forEach(function (f, i) { tone('triangle', f, 0, 0.3, 0.16, i * 0.15); }); }
  };
  function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) { /* 무시 */ } }

  /* ---------------- 입력 ---------------- */
  function toL(e) { var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / s, y: (e.clientY - r.top) / s }; }
  function body(f, sc) { var K = KIND[f.kind], L = LOOK[f.kind]; return { cx: f.x, cy: f.y - K.h * C * sc / 2, hw: L.w * C * sc / 2, hh: K.h * C * sc / 2 }; }
  function hillHit(p, inner) {
    var best = null, bd = 1e9;
    G.friends.forEach(function (f) {
      if (f.state !== 'hill') return;
      var b = body(f, 0.74), k = inner ? 0.6 : 1.15;
      var hw = Math.max(inner ? 0 : 22, b.hw) * k, hh = Math.max(inner ? 0 : 22, b.hh) * k;
      if (hw <= 0 || hh <= 0) return;
      var dx = (p.x - b.cx) / hw, dy = (p.y - b.cy) / hh, d = dx * dx + dy * dy;
      if (d <= 1 && d < bd) { bd = d; best = f; }
    });
    return best;
  }
  function towerSlot(i) { var y = groundY; for (var k = 0; k < i; k++) y -= KIND[G.tower[k].kind].h * C; return { x: towerX, y: y }; }
  function topFriendHit(p) {
    if (!G.tower.length) return null;
    var i = G.tower.length - 1, f = G.tower[i], sl = towerSlot(i);
    var hw = Math.max(24, LOOK[f.kind].w * C / 2), top = sl.y - KIND[f.kind].h * C;
    return (Math.abs(p.x - sl.x) <= hw + 6 && p.y >= top - 12 && p.y <= sl.y + 4) ? f : null;
  }
  function busy() { return G.tower.some(function (t) { return t.state === 'board'; }) || G.state !== 'build'; }
  function board(f) {
    if (G.tower.length >= MAX_TOWER) { SND.tang(); f.sq = 0.5; return; }
    f.state = 'board'; f.bk = 0; f.fx0 = f.x; f.fy0 = f.y;
    G.tower.push(f);
    SND.board(G.tower.length - 1, f.kind === 'kwang');
    G.idleT = 0; G.ghost = false; G.boarded = true;
  }
  function unboard(f) {
    G.tower.pop();
    f.state = 'unboard'; f.bk = 0; var sl = towerSlot(G.tower.length); f.fx0 = sl.x; f.fy0 = sl.y;
    SND.unboard();
  }
  cv.addEventListener('pointerdown', function (e) {
    audio();
    e.preventDefault();
    if (!G || G.drag || G.state !== 'build') return;
    try { cv.setPointerCapture(e.pointerId); } catch (er) { /* 무시 */ }
    var p = toL(e);
    if (p.y >= hillTop - 8) {
      G.drag = { id: e.pointerId, mode: 'board', last: p };
      if (!busyTower()) { var f = hillHit(p, false); if (f) board(f); }
      return;
    }
    if (!G.tower.length || busyTower()) return;

      var k = p.t / p.life, sc = k < 0.15 ? 0.6 + k / 0.15 * 0.6 : 1.2 - Math.min(0.2, (k - 0.15));

      ctx.translate(p.x, p.y - k * 30); ctx.scale(sc, sc);
      ctx.font = p.size + 'px Jua, "Apple SD Gothic Neo", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round'; ctx.lineWidth = p.size * 0.28; ctx.strokeStyle = '#3b2a22'; ctx.strokeText(p.text, 0, 0);
      ctx.fillStyle = p.color; ctx.fillText(p.text, 0, 0);
      ctx.restore();
    });
    // KO 글자
    if (G.ko) {
      var kk2 = Math.min(1, G.koT / 0.25), scK = 2.2 - 1.2 * kk2;
      ctx.save(); ctx.translate(KING_X() - 10, groundY - 150); ctx.rotate(-0.15); ctx.scale(scK, scK);
      ctx.font = '46px Jua, "Apple SD Gothic Neo", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round'; ctx.lineWidth = 12; ctx.strokeStyle = '#3b2a22'; ctx.strokeText('K.O.', 0, 0);
      ctx.fillStyle = '#ffd23f'; ctx.fillText('K.O.', 0, 0); ctx.restore();
    }
    // 첫 판 손가락 시연: 언덕 친구 톡 → (태운 뒤) 밀기 화살표
    if (G.ghost && G.state === 'build' && !G.drag) {
      var target = G.friends.filter(function (f) { return f.state === 'hill' && f.kind === 'kwang'; })[0];
      if (target) {
        var gk = (G.t % 1.4) / 1.4, press = gk > 0.35 && gk < 0.6 ? 1 : 0;
        ctx.save(); ctx.globalAlpha = 0.85;
        ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.beginPath(); ctx.arc(target.x + 10, target.y - 24 + (press ? 4 : -6), 15 - press * 2, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#3b2a22'; ctx.lineWidth = 2.5; ctx.stroke();
        if (press) { ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(target.x + 10, target.y - 20, 24, 0, Math.PI * 2); ctx.stroke(); }
        ctx.restore();
      }
    }
    if (G.state === 'build' && G.tower.length && !G.drag && G.idleT > 3) {
      var hx = towerX + 34 + Math.sin(G.t * 6) * 6, hy = groundY - 26;
      ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.strokeStyle = '#3b2a22'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(hx, hy - 9); ctx.lineTo(hx + 14, hy); ctx.lineTo(hx, hy + 9); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }
  function easeIO(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

  /* ---------------- HUD·오버레이 ---------------- */
  var livesEl = document.getElementById('lives'), scoreEl = document.getElementById('score'), over = document.getElementById('over'), card = document.getElementById('card');
  function hud() {
    var h = '';
    G.friends.forEach(function (f) { var used = !(f.state === 'hill' || f.state === 'tower' || f.state === 'board' || f.state === 'unboard'); h += '<span class="dot' + (used ? ' used' : '') + '" style="background:' + LOOK[f.kind].col + '"></span>'; });
    if (livesEl.innerHTML !== h) livesEl.innerHTML = h;
    scoreEl.textContent = G.score;
  }
  function starsFor(left) { return left >= 3 ? 3 : left >= 1 ? 2 : 1; }
  function showWin() {
    var left = friendsLeft(), bonus = left * 300; G.score += bonus; hud();
    var n = starsFor(left), st = '';
    for (var i = 0; i < 3; i++) st += '<span class="' + (i < n ? 'on' : 'off') + '">★</span>';
    var prev = G.best, isBest = !prev || n > prev.stars || (n === prev.stars && G.score > prev.score);
    if (isBest) saveBest({ stars: n, score: G.score });
    var bestTxt = isBest ? '최고 기록!' : '최고 ' + '★'.repeat(prev.stars) + ' ' + prev.score;
    card.innerHTML = '<div class="stars">' + st + '</div><div class="big">' + G.score + '</div><div class="sub">남은 친구 ' + left + ' · ' + bestTxt + '</div><div class="row"><button class="pill main" data-a="restart" aria-label="다시">↻</button><button class="pill" data-a="back" aria-label="목업 고르기로">←</button></div>';
    over.classList.add('show');
    for (var k = 0; k < n; k++) (function (k) { setTimeout(function () { SND.star(k); buzz(25); }, 350 * k + 150); })(k);
  }
  function showLose() {
    card.innerHTML = '<div class="stars"><span class="off">★</span><span class="off">★</span><span class="off">★</span></div><div class="big">' + G.score + '</div><div class="sub">친구를 다 썼어요</div><div class="row"><button class="pill main" data-a="restart" aria-label="다시">↻ 다시</button><button class="pill" data-a="back" aria-label="목업 고르기로">←</button></div>';
    over.classList.add('show');
  }
  function hideOver() { over.classList.remove('show'); card.innerHTML = ''; }
  function goBack() { if (history.length > 1) history.back(); else location.href = location.protocol === 'file:' ? 'index.html' : './'; }
  over.addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; audio(); if (b.dataset.a === 'restart') { firstRun = false; newGame(); } else goBack(); });
  document.getElementById('restart').addEventListener('click', function () { audio(); firstRun = false; newGame(); });
  document.getElementById('back').addEventListener('click', goBack);

  /* ---------------- 루프 ---------------- */
  var last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);   // 오류가 나도 루프가 멈추지 않게 먼저 예약
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (G) { update(dt); render(); }
  }
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);

  /* ---------------- 읽기 전용 관찰 창 (자동 검증용) ---------------- */
  function toClient(x, y) { var r = cv.getBoundingClientRect(); return { x: r.left + x * s, y: r.top + y * s }; }
  window.mongle = {
    snapshot: function () {
      var kinds = towerKinds(), sim = kinds.length ? simulate(G.cols, G.buckets, kinds) : null, st = kinds.length ? stability(kinds) : null;
      return JSON.parse(JSON.stringify({
        state: G.state, score: G.score, buckets: G.buckets, angle: G.angle, left: friendsLeft(),
        tower: kinds, stab: st ? { R: +st.R.toFixed(3), weak: st.weak } : null,
        cols: G.cols.map(function (c) { return { cells: c.cells.join(''), mole: c.mole }; }),
        preview: sim ? sim.ev.map(function (e) { return { kind: e.kind, land: e.land, blocked: e.blocked, hits: e.hits.map(function (h) { return { col: h.col, broke: h.broke.length, bucket: h.bucket || 0, ding: h.ding, clang: h.clang, miss: h.miss }; }) }; }) : [],
        previewAfter: sim ? { cols: sim.cols.map(function (c) { return { cells: c.cells.join(''), mole: c.mole }; }), buckets: sim.buckets } : null,
        hill: G.friends.filter(function (f) { return f.state === 'hill'; }).map(function (f) { var b = body(f, 0.74), p = toClient(b.cx, b.cy); return { id: f.id, kind: f.kind, sx: Math.round(p.x), sy: Math.round(p.y) }; }),
        towerTop: kinds.length ? (function () { var i = kinds.length - 1, sl = towerSlot(i), p = toClient(sl.x, sl.y - KIND[kinds[i]].h * C / 2); return { sx: Math.round(p.x), sy: Math.round(p.y) }; })() : null,
        towerBase: (function () { var p = toClient(towerX, groundY - C * 0.5); return { sx: Math.round(p.x), sy: Math.round(p.y) }; })(),
        over: over.classList.contains('show'), ko: !!G.ko
      }));
    }
  };

  resize();
  newGame();
  requestAnimationFrame(frame);
})();
</script>
